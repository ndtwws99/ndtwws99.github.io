  <script type="module">
    import { initTwinPage, openTwinChat, getWebPrefs, getSiteSettings } from "./assets/js/layout.js";
    import { renderPostList } from "./assets/js/post-ui.js";
    import {
      db,
      collection,
      doc,
      addDoc,
      updateDoc,
      deleteDoc,
      arrayUnion,
      arrayRemove,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      uploadToCloudinary,
      pushNotification,
      sanitizeHtml,
      isUserAdmin,
      STORY_BACKGROUNDS,
      getStoryBgCss,
      DEFAULT_AVATAR,
      escapeHtml,
      formatTime,
      showToast,
      friendlyError,
      toMillis
    } from "./assets/js/firebase-service.js";

    let me = null;
    let allPosts = [];
    let activeFilter = "all";
    let selectedFile = null;
    let composerIsHtml = false;
    let viewingStory = null;
    let storyLikeBusy = false;
    const storiesById = new Map();
    let pendingStoryId = new URLSearchParams(window.location.search).get("story");

    // ---- Collapsible & HTML Post Composer ----
    const composerCard = document.getElementById("twin-composer-card");
    const compCollapseBtn = document.getElementById("comp-collapse-btn");
    const postFeelingEl = document.getElementById("post-feeling");
    const postContentEl = document.getElementById("post-content");
    const modeTextBtn = document.getElementById("comp-mode-text");
    const modeHtmlBtn = document.getElementById("comp-mode-html");
    const htmlPrevBtn = document.getElementById("comp-html-preview-btn");
    const htmlPrevWrap = document.getElementById("comp-html-preview");
    const htmlPrevBody = document.getElementById("comp-html-preview-body");

    function expandComposer(shouldFocus = false) {
      if (!composerCard.classList.contains("expanded")) {
        composerCard.classList.add("expanded");
        postContentEl.rows = 3;
      }
      if (shouldFocus) postContentEl.focus();
    }

    function collapseComposer() {
      composerCard.classList.remove("expanded");
      postContentEl.rows = 1;
      postContentEl.style.height = "";
      postContentEl.blur();
    }

    function isComposerEmpty() {
      return !postContentEl.value.trim() && !selectedFile && !postFeelingEl.value && !composerIsHtml;
    }

    composerCard.addEventListener("click", () => {
      if (!composerCard.classList.contains("expanded")) {
        expandComposer(true);
      }
    });
    postContentEl.addEventListener("focus", () => expandComposer(false));
    compCollapseBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      collapseComposer();
    });
    document.addEventListener("click", (e) => {
      if (composerCard.classList.contains("expanded") && !composerCard.contains(e.target) && isComposerEmpty()) {
        collapseComposer();
      }
    });
    composerCard.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && composerCard.classList.contains("expanded") && isComposerEmpty()) {
        collapseComposer();
      }
    });

    function canUseHtmlPosts() {
      return getSiteSettings().allowHtmlPosts || isUserAdmin(me);
    }

    function syncHtmlPermission() {
      const allowed = canUseHtmlPosts();
      modeHtmlBtn.style.display = allowed ? "" : "none";
      if (!allowed && composerIsHtml) {
        composerIsHtml = false;
        syncComposerMode();
      }
    }

    function syncComposerMode() {
      modeTextBtn.classList.toggle("active", !composerIsHtml);
      modeHtmlBtn.classList.toggle("active", composerIsHtml);
      postContentEl.classList.toggle("code-mode", composerIsHtml);
      postContentEl.placeholder = composerIsHtml
        ? "Nhập mã HTML (VD: <h3>Chào Twin!</h3><p>Nội dung <b>in đậm</b>, <mark>nổi bật</mark>...</p>)"
        : "Bạn đang nghĩ gì?";
      htmlPrevBtn.style.display = composerIsHtml ? "inline-flex" : "none";
      if (!composerIsHtml) htmlPrevWrap.style.display = "none";
    }
    modeTextBtn.onclick = () => { composerIsHtml = false; syncComposerMode(); };
    modeHtmlBtn.onclick = () => {
      if (!canUseHtmlPosts()) return showToast("Quản trị viên đã tạm tắt chế độ đăng bài HTML.");
      composerIsHtml = true;
      syncComposerMode();
    };
    window.addEventListener("twin-site-settings-changed", syncHtmlPermission);
    htmlPrevBtn.onclick = () => {
      const show = htmlPrevWrap.style.display === "none";
      htmlPrevWrap.style.display = show ? "block" : "none";
      if (show) htmlPrevBody.innerHTML = sanitizeHtml(postContentEl.value);
    };
    postContentEl.addEventListener("input", () => {
      if (composerIsHtml && htmlPrevWrap.style.display !== "none") {
        htmlPrevBody.innerHTML = sanitizeHtml(postContentEl.value);
      }
    });

    // ---- Post image preview ----
    const previewWrap = document.getElementById("post-preview-wrap");
    const previewImg = document.getElementById("post-preview-img");
    const fileInput = document.getElementById("post-image-file");

    fileInput.onchange = () => {
      selectedFile = fileInput.files[0] || null;
      if (selectedFile) {
        previewImg.src = URL.createObjectURL(selectedFile);
        previewWrap.style.display = "block";
      } else {
        previewWrap.style.display = "none";
      }
    };
    document.getElementById("post-preview-remove").onclick = () => {
      selectedFile = null;
      fileInput.value = "";
      previewWrap.style.display = "none";
    };

    // ---- Story Creator Modal (Text & Image) ----
    const createStoryModal = document.getElementById("create-story-modal");
    const csTabText = document.getElementById("cs-tab-text");
    const csTabImage = document.getElementById("cs-tab-image");
    const csPanelText = document.getElementById("cs-panel-text");
    const csPanelImage = document.getElementById("cs-panel-image");
    const csTextStage = document.getElementById("cs-text-stage");
    const csTextInput = document.getElementById("cs-text-input");
    const csFontSelect = document.getElementById("cs-font-select");
    const csSwatchRow = document.getElementById("cs-swatch-row");
    const csImgInput = document.getElementById("cs-img-input");
    const csImgPreviewBox = document.getElementById("cs-img-preview-box");
    const csImgPreview = document.getElementById("cs-img-preview");
    const csImgLabel = document.getElementById("cs-img-label");
    const csImgCaption = document.getElementById("cs-img-caption");

    let selectedStoryBg = STORY_BACKGROUNDS[0].id;
    let selectedStoryFile = null;

    function renderSwatches() {
      csSwatchRow.innerHTML = "";
      STORY_BACKGROUNDS.forEach((bg) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = `twin-swatch ${bg.id === selectedStoryBg ? "active" : ""}`;
        b.style.background = bg.css;
        b.title = bg.label;
        b.onclick = () => {
          selectedStoryBg = bg.id;
          csTextStage.style.background = bg.css;
          renderSwatches();
        };
        csSwatchRow.appendChild(b);
      });
    }
    csTextStage.style.background = STORY_BACKGROUNDS[0].css;
    renderSwatches();

    csTextInput.addEventListener("input", () => {
      csTextStage.textContent = csTextInput.value.trim() || "Bắt đầu nhập nội dung tin...";
    });
    csFontSelect.addEventListener("change", () => {
      csTextStage.className = `twin-story-stage ${csFontSelect.value}`;
    });

    csTabText.onclick = () => {
      csTabText.classList.add("active");
      csTabImage.classList.remove("active");
      csPanelText.style.display = "block";
      csPanelImage.style.display = "none";
    };
    csTabImage.onclick = () => {
      csTabImage.classList.add("active");
      csTabText.classList.remove("active");
      csPanelImage.style.display = "block";
      csPanelText.style.display = "none";
    };
    document.getElementById("cs-close-btn").onclick = () => createStoryModal.classList.remove("open");

    csImgInput.onchange = () => {
      selectedStoryFile = csImgInput.files[0] || null;
      if (selectedStoryFile) {
        csImgPreview.src = URL.createObjectURL(selectedStoryFile);
        csImgPreviewBox.style.display = "block";
        csImgLabel.textContent = "Đổi ảnh: " + selectedStoryFile.name;
      } else {
        csImgPreviewBox.style.display = "none";
        csImgLabel.textContent = "Chọn ảnh từ thiết bị";
      }
    };

    // ---- Story Viewer Modal ----
    const storyModal = document.getElementById("story-modal");
    const storyLikeBtn = document.getElementById("story-modal-like-btn");
    const storyLikeCountEl = document.getElementById("story-modal-like-count");
    const storyLikeSummaryEl = document.getElementById("story-modal-like-summary");
    const storyHeartBurstEl = document.getElementById("story-modal-heart-burst");

    document.getElementById("story-modal-close").onclick = () => storyModal.classList.remove("open");
    document.getElementById("story-modal-del").onclick = async () => {
      if (!viewingStory || !me || (viewingStory.authorUid !== me.uid && !isUserAdmin(me))) return;
      if (!confirm("Xóa tin này?")) return;
      try {
        await deleteDoc(doc(db, "stories", viewingStory.id));
        storyModal.classList.remove("open");
        showToast("Đã xóa tin.");
      } catch (err) {
        showToast(friendlyError(err));
      }
    };

    function renderStoryLikeState(s) {
      if (!s) return;
      const likes = Array.isArray(s.likes) ? s.likes : [];
      const liked = Boolean(me && likes.includes(me.uid));
      const count = likes.length;

      storyLikeBtn.classList.toggle("liked", liked);
      storyLikeBtn.setAttribute("aria-pressed", liked ? "true" : "false");
      storyLikeBtn.title = liked ? "Bỏ thả tim" : "Thả tim tin này";
      storyLikeCountEl.textContent = String(count);

      if (count === 0) {
        storyLikeSummaryEl.textContent = "Hãy là người đầu tiên thả tim";
      } else if (count === 1) {
        storyLikeSummaryEl.textContent = liked ? "Bạn đã thả tim tin này" : "1 người đã thả tim";
      } else {
        storyLikeSummaryEl.textContent = liked
          ? `Bạn và ${count - 1} người khác đã thả tim`
          : `${count} người đã thả tim`;
      }
    }

    function playStoryHeartEffect() {
      storyLikeBtn.classList.remove("pop");
      void storyLikeBtn.offsetWidth;
      storyLikeBtn.classList.add("pop");

      storyHeartBurstEl.classList.remove("burst");
      void storyHeartBurstEl.offsetWidth;
      storyHeartBurstEl.classList.add("burst");
    }

    async function toggleStoryLike({ onlyLike = false } = {}) {
      if (!viewingStory || !me || storyLikeBusy) return;
      const prevLikes = Array.isArray(viewingStory.likes) ? [...viewingStory.likes] : [];
      const alreadyLiked = prevLikes.includes(me.uid);

      if (onlyLike && alreadyLiked) {
        playStoryHeartEffect();
        return;
      }

      const nextLikes = alreadyLiked
        ? prevLikes.filter((uid) => uid !== me.uid)
        : [...prevLikes, me.uid];

      viewingStory = { ...viewingStory, likes: nextLikes };
      renderStoryLikeState(viewingStory);
      if (!alreadyLiked) playStoryHeartEffect();

      storyLikeBusy = true;
      try {
        await updateDoc(doc(db, "stories", viewingStory.id), {
          likes: alreadyLiked ? arrayRemove(me.uid) : arrayUnion(me.uid)
        });
        if (!alreadyLiked && viewingStory.authorUid && viewingStory.authorUid !== me.uid) {
          pushNotification(viewingStory.authorUid, {
            fromUid: me.uid,
            fromName: me.name,
            fromAvatar: me.avatar || DEFAULT_AVATAR,
            text: "đã thả tim tin của bạn ❤️",
            link: `./index.html?story=${encodeURIComponent(viewingStory.id)}`
          }).catch(() => {});
        }
      } catch (err) {
        viewingStory = { ...viewingStory, likes: prevLikes };
        renderStoryLikeState(viewingStory);
        showToast(friendlyError(err));
      } finally {
        storyLikeBusy = false;
      }
    }

    storyLikeBtn.onclick = () => toggleStoryLike();
    document.getElementById("story-modal-img").ondblclick = () => toggleStoryLike({ onlyLike: true });
    document.getElementById("story-modal-text-stage").ondblclick = () => toggleStoryLike({ onlyLike: true });

    function openStoryViewer(s) {
      viewingStory = s;
      const imgEl = document.getElementById("story-modal-img");
      const stageEl = document.getElementById("story-modal-text-stage");
      const capEl = document.getElementById("story-modal-caption");
      const delBtn = document.getElementById("story-modal-del");

      document.getElementById("story-modal-avatar").src = s.authorAvatar || DEFAULT_AVATAR;
      document.getElementById("story-modal-author").textContent = s.authorName || "Thành viên";
      document.getElementById("story-modal-time").textContent = formatTime(s.createdAt);
      delBtn.style.display = me && (s.authorUid === me.uid || isUserAdmin(me)) ? "grid" : "none";
      storyHeartBurstEl.classList.remove("burst");

      if (s.type === "text" || (!s.imageUrl && s.text)) {
        imgEl.style.display = "none";
        stageEl.style.display = "flex";
        stageEl.style.background = getStoryBgCss(s.bgId || s.bgCss);
        stageEl.className = `twin-story-stage ${s.fontClass || "font-bold"}`;
        stageEl.textContent = s.text || "";
        capEl.style.display = "none";
      } else {
        stageEl.style.display = "none";
        imgEl.style.display = "block";
        imgEl.src = s.imageUrl;
        if (s.caption) {
          capEl.textContent = s.caption;
          capEl.style.display = "block";
        } else {
          capEl.style.display = "none";
        }
      }
      renderStoryLikeState(s);
      storyModal.classList.add("open");
    }

    // ---- Feed Filters & Infinite Scroll (đọc theo cài đặt người dùng) ----
    let feedPageSize = getWebPrefs().feedPageSize || 5;
    let visibleFeedCount = feedPageSize;
    let lastFilteredCount = 0;
    let feedLoadingMore = false;
    const feedSentinel = document.getElementById("twin-feed-sentinel");

    window.addEventListener("twin-prefs-changed", (e) => {
      const nextSize = Number(e.detail?.feedPageSize) || 5;
      if (nextSize !== feedPageSize) {
        feedPageSize = nextSize;
        visibleFeedCount = feedPageSize;
        renderFeedList(document.getElementById("twin-global-search")?.value || "");
      }
    });

    function loadMoreFeedPosts() {
      if (feedLoadingMore || visibleFeedCount >= lastFilteredCount) return;
      feedLoadingMore = true;
      setTimeout(() => {
        visibleFeedCount += feedPageSize;
        feedLoadingMore = false;
        renderFeedList(document.getElementById("twin-global-search")?.value || "");
      }, 150);
    }

    if ("IntersectionObserver" in window && feedSentinel) {
      const feedObserver = new IntersectionObserver(
        (entries) => {
          if (entries.some((entry) => entry.isIntersecting)) {
            loadMoreFeedPosts();
          }
        },
        { rootMargin: "240px 0px" }
      );
      feedObserver.observe(feedSentinel);
    }
    if (feedSentinel) {
      feedSentinel.onclick = () => loadMoreFeedPosts();
    }

    document.querySelectorAll(".feed-filter").forEach((btn) => {
      btn.onclick = () => {
        activeFilter = btn.dataset.filter;
        document.querySelectorAll(".feed-filter").forEach((b) => {
          b.classList.toggle("active", b === btn);
        });
        renderFeedList(document.getElementById("twin-global-search")?.value || "", { resetPagination: true });
      };
    });

    function renderFeedList(filterText = "", { resetPagination = false } = {}) {
      const feed = document.getElementById("twin-feed");
      const q = filterText.trim().toLowerCase();
      if (resetPagination) visibleFeedCount = feedPageSize;

      const filtered = allPosts
        .filter((p) => {
          if (activeFilter === "pinned" && !p.pinned) return false;
          if (activeFilter === "photo" && !p.imageUrl) return false;
          if (activeFilter === "page" && !p.pageId) return false;
          if (!q) return true;
          return (
            (p.content || "").toLowerCase().includes(q) ||
            (p.authorName || "").toLowerCase().includes(q) ||
            (p.pageName || "").toLowerCase().includes(q) ||
            (p.groupName || "").toLowerCase().includes(q)
          );
        })
        .sort((a, b) => {
          const pinA = a.pinned ? 1 : 0;
          const pinB = b.pinned ? 1 : 0;
          if (pinB !== pinA) return pinB - pinA;
          if (pinA && pinB && (b.pinnedAt || 0) !== (a.pinnedAt || 0)) {
            return (b.pinnedAt || 0) - (a.pinnedAt || 0);
          }
          return toMillis(b.createdAt) - toMillis(a.createdAt);
        });

      // Nếu mở link trực tiếp tới bài viết (#post-...), tự động mở rộng số bài hiển thị để cuộn tới đúng bài đó
      if (window.location.hash.startsWith("#post-")) {
        const targetId = decodeURIComponent(window.location.hash.slice("#post-".length));
        const targetIdx = filtered.findIndex((p) => p.id === targetId);
        if (targetIdx >= visibleFeedCount) {
          visibleFeedCount = targetIdx + 1;
        }
      }

      lastFilteredCount = filtered.length;
      const visiblePosts = filtered.slice(0, visibleFeedCount);

      const empty = q
        ? '<div class="twin-card" style="text-align:center;color:var(--text-3);padding:32px;">Không tìm thấy bài viết phù hợp.</div>'
        : '<div class="twin-card" style="text-align:center;color:var(--text-3);padding:32px;">Chưa có bài viết nào. Hãy chia sẻ điều đầu tiên trên Twin!</div>';
      renderPostList(feed, visiblePosts, me, empty);

      if (feedSentinel) {
        if (!filtered.length) {
          feedSentinel.style.display = "none";
          feedSentinel.classList.remove("has-more");
        } else if (visiblePosts.length < filtered.length) {
          const remaining = filtered.length - visiblePosts.length;
          feedSentinel.style.display = "flex";
          feedSentinel.classList.add("has-more");
          feedSentinel.innerHTML = `<span class="twin-feed-spinner"></span><span>Đang tải thêm bài viết cũ hơn (${remaining} bài còn lại)...</span>`;
        } else if (filtered.length > feedPageSize) {
          feedSentinel.style.display = "flex";
          feedSentinel.classList.remove("has-more");
          feedSentinel.innerHTML = `<span>Bạn đã xem hết tất cả ${filtered.length} bài viết</span>`;
        } else {
          feedSentinel.style.display = "none";
          feedSentinel.classList.remove("has-more");
        }
      }
    }

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;

        document.getElementById("side-me-name").textContent = me.name;
        document.getElementById("side-me-avatar").src = me.avatar || DEFAULT_AVATAR;
        document.getElementById("composer-avatar").src = me.avatar || DEFAULT_AVATAR;
        syncHtmlPermission();

        const searchEl = document.getElementById("twin-global-search");
        const initialQ = new URLSearchParams(window.location.search).get("q");
        if (searchEl && initialQ) searchEl.value = initialQ;
        searchEl?.addEventListener("input", (e) => renderFeedList(e.target.value, { resetPagination: true }));

        // Publish Post (Text or HTML)
        document.getElementById("btn-publish-post").onclick = async () => {
          const btn = document.getElementById("btn-publish-post");
          const content = postContentEl.value.trim();
          const feeling = document.getElementById("post-feeling").value;
          if (!content && !selectedFile) return showToast("Hãy nhập nội dung hoặc chọn ảnh.");
          btn.disabled = true;
          btn.textContent = "Đang đăng...";
          try {
            let imageUrl = "";
            if (selectedFile) imageUrl = await uploadToCloudinary(selectedFile);
            await addDoc(collection(db, "posts"), {
              authorUid: me.uid,
              authorName: me.name,
              authorAvatar: me.avatar || DEFAULT_AVATAR,
              content,
              isHtml: composerIsHtml,
              feeling,
              imageUrl,
              pinned: false,
              reactions: {},
              comments: [],
              createdAt: serverTimestamp()
            });
            postContentEl.value = "";
            postFeelingEl.value = "";
            composerIsHtml = false;
            syncComposerMode();
            htmlPrevWrap.style.display = "none";
            selectedFile = null;
            fileInput.value = "";
            previewWrap.style.display = "none";
            collapseComposer();
            showToast("Đã đăng bài!");
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            btn.disabled = false;
            btn.textContent = "Đăng bài";
          }
        };

        // Publish Text Story
        document.getElementById("cs-publish-text").onclick = async () => {
          const text = csTextInput.value.trim();
          if (!text) return showToast("Hãy nhập nội dung cho tin văn bản.");
          const btn = document.getElementById("cs-publish-text");
          btn.disabled = true;
          btn.textContent = "Đang đăng...";
          try {
            await addDoc(collection(db, "stories"), {
              type: "text",
              authorUid: me.uid,
              authorName: me.name,
              authorAvatar: me.avatar || DEFAULT_AVATAR,
              text,
              bgId: selectedStoryBg,
              fontClass: csFontSelect.value,
              imageUrl: "",
              caption: "",
              likes: [],
              createdAt: serverTimestamp()
            });
            csTextInput.value = "";
            csTextStage.textContent = "Bắt đầu nhập nội dung tin...";
            createStoryModal.classList.remove("open");
            showToast("Đã đăng tin văn bản!");
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            btn.disabled = false;
            btn.textContent = "Đăng tin";
          }
        };

        // Publish Image Story
        document.getElementById("cs-publish-img").onclick = async () => {
          if (!selectedStoryFile) return showToast("Hãy chọn một tấm ảnh.");
          const btn = document.getElementById("cs-publish-img");
          btn.disabled = true;
          btn.textContent = "Đang tải ảnh...";
          try {
            const imageUrl = await uploadToCloudinary(selectedStoryFile);
            await addDoc(collection(db, "stories"), {
              type: "image",
              authorUid: me.uid,
              authorName: me.name,
              authorAvatar: me.avatar || DEFAULT_AVATAR,
              imageUrl,
              caption: csImgCaption.value.trim(),
              likes: [],
              createdAt: serverTimestamp()
            });
            selectedStoryFile = null;
            csImgInput.value = "";
            csImgCaption.value = "";
            csImgPreviewBox.style.display = "none";
            csImgLabel.textContent = "Chọn ảnh từ thiết bị";
            createStoryModal.classList.remove("open");
            showToast("Đã đăng tin ảnh!");
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            btn.disabled = false;
            btn.textContent = "Đăng tin ảnh";
          }
        };

        // Stories realtime
        onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "desc"), limit(20)), (snap) => {
          const row = document.getElementById("twin-stories");
          row.innerHTML = `
            <div class="twin-story-card" id="btn-add-story">
              <img class="story-bg" src="${escapeHtml(me.avatar || DEFAULT_AVATAR)}" alt="" />
              <div class="twin-story-overlay">
                <div class="twin-story-plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
                <div class="twin-story-name">Tạo tin</div>
              </div>
            </div>
          `;
          document.getElementById("btn-add-story").onclick = () => {
            createStoryModal.classList.add("open");
          };

          const dayAgo = Date.now() - 24 * 60 * 60 * 1000;
          storiesById.clear();
          snap.forEach((d) => {
            const s = { id: d.id, ...d.data() };
            if (s.createdAt && toMillis(s.createdAt) < dayAgo) return;
            const isTextStory = s.type === "text" || (!s.imageUrl && s.text);
            if (!isTextStory && !s.imageUrl) return;

            storiesById.set(s.id, s);
            const likesCount = Array.isArray(s.likes) ? s.likes.length : 0;
            const likesBadge = likesCount > 0
              ? `<span class="twin-story-likes-badge">❤️ ${likesCount}</span>`
              : "";

            const card = document.createElement("div");
            card.className = "twin-story-card";
            if (isTextStory) {
              card.style.background = getStoryBgCss(s.bgId || s.bgCss);
              card.innerHTML = `
                <div class="twin-story-text-thumb ${escapeHtml(s.fontClass || "")}">${escapeHtml((s.text || "").slice(0, 75))}</div>
                ${likesBadge}
                <div class="twin-story-overlay">
                  <img class="twin-story-avatar" src="${escapeHtml(s.authorAvatar || DEFAULT_AVATAR)}" alt="" />
                  <div class="twin-story-name">${escapeHtml(s.authorName)}</div>
                </div>
              `;
            } else {
              card.innerHTML = `
                <img class="story-bg" src="${escapeHtml(s.imageUrl)}" alt="" />
                ${likesBadge}
                <div class="twin-story-overlay">
                  <img class="twin-story-avatar" src="${escapeHtml(s.authorAvatar || DEFAULT_AVATAR)}" alt="" />
                  <div class="twin-story-name">${escapeHtml(s.authorName)}</div>
                </div>
              `;
            }
            card.onclick = () => openStoryViewer(storiesById.get(s.id) || s);
            row.appendChild(card);
          });

          if (storyModal.classList.contains("open") && viewingStory) {
            const latest = storiesById.get(viewingStory.id);
            if (latest) {
              viewingStory = latest;
              renderStoryLikeState(latest);
            }
          }

          if (pendingStoryId && storiesById.has(pendingStoryId)) {
            const targetStory = storiesById.get(pendingStoryId);
            pendingStoryId = null;
            openStoryViewer(targetStory);
          }
        }, (err) => showToast(friendlyError(err)));

        onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(200)), (snap) => {
          allPosts = [];
          snap.forEach((d) => allPosts.push({ id: d.id, ...d.data() }));
          document.getElementById("stat-posts-count").textContent = String(allPosts.length);
          renderFeedList(document.getElementById("twin-global-search")?.value || "");
        }, (err) => showToast(friendlyError(err)));

        onSnapshot(query(collection(db, "users"), limit(100)), (snap) => {
          const contactsEl = document.getElementById("twin-contacts");
          contactsEl.innerHTML = "";
          document.getElementById("stat-users-count").textContent = String(snap.size);
          snap.forEach((d) => {
            const u = d.data();
            if (u.uid === me.uid) return;
            const btn = document.createElement("button");
            btn.className = "twin-side-item";
            btn.innerHTML = `
              <img class="twin-avatar twin-avatar-sm" src="${escapeHtml(u.avatar || DEFAULT_AVATAR)}" alt="" />
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(u.name)}</span>
            `;
            btn.onclick = () => openTwinChat(u);
            contactsEl.appendChild(btn);
          });
        }, (err) => console.warn("Contacts:", err));
      }
    });
  </script>
</body>
</html>
