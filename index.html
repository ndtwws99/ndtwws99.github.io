<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bảng tin — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội Liquid Glass kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M17 20h30v7.5H36V48h-8V27.5H17z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body class="">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main">
    <div class="twin-grid-3">
      <aside class="twin-sidebar twin-left-col">
        <a href="./profile.html" class="twin-side-item">
          <img class="twin-avatar twin-avatar-sm" id="side-me-avatar" alt="" />
          <span id="side-me-name">Trang cá nhân</span>
        </a>
        <a href="./friends.html" class="twin-side-item">
          <span class="twin-side-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <span>Bạn bè</span>
        </a>
        <a href="./groups.html" class="twin-side-item">
          <span class="twin-side-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg></span>
          <span>Nhóm</span>
        </a>
        <a href="./pages.html" class="twin-side-item">
          <span class="twin-side-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></span>
          <span>Trang</span>
        </a>
        <a href="./messages.html" class="twin-side-item">
          <span class="twin-side-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
          <span>Tin nhắn</span>
        </a>
        <a href="./saved.html" class="twin-side-item">
          <span class="twin-side-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
          <span>Đã lưu</span>
        </a>
        <div class="twin-side-legal">Twin Liquid Glass · 2026</div>
      </aside>

      <section>
        <div class="twin-stories-row" id="twin-stories"></div>

        <div class="twin-card">
          <div class="twin-composer-top">
            <img class="twin-avatar" id="composer-avatar" alt="" />
            <textarea id="post-content" class="twin-textarea" placeholder="Bạn đang nghĩ gì?"></textarea>
          </div>
          <div id="post-preview-wrap" style="margin-top:10px;display:none;position:relative;">
            <img id="post-preview-img" class="twin-post-image" alt="Xem trước" />
            <button id="post-preview-remove" type="button" class="twin-icon-btn" style="position:absolute;top:8px;right:8px;width:30px;height:30px;">✕</button>
          </div>
          <div class="twin-composer-actions">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <label class="twin-btn twin-btn-secondary twin-btn-sm" style="cursor:pointer;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span>Thêm ảnh</span>
                <input id="post-image-file" type="file" accept="image/*" hidden />
              </label>
              <select id="post-feeling" class="twin-select" style="width:auto;padding:6px 12px;border-radius:999px;font-size:13px;">
                <option value="">Cảm xúc...</option>
                <option value="hạnh phúc 😊">Hạnh phúc 😊</option>
                <option value="hào hứng 🤩">Hào hứng 🤩</option>
                <option value="thư giãn 😌">Thư giãn 😌</option>
                <option value="tự hào 💪">Tự hào 💪</option>
                <option value="buồn nhẹ 😔">Buồn nhẹ 😔</option>
              </select>
            </div>
            <button id="btn-publish-post" class="twin-btn twin-btn-primary">Đăng bài</button>
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
          <button class="twin-btn twin-btn-primary twin-btn-sm feed-filter" data-filter="all">Tất cả</button>
          <button class="twin-btn twin-btn-secondary twin-btn-sm feed-filter" data-filter="pinned">Đã ghim</button>
          <button class="twin-btn twin-btn-secondary twin-btn-sm feed-filter" data-filter="photo">Có ảnh</button>
          <button class="twin-btn twin-btn-secondary twin-btn-sm feed-filter" data-filter="page">Từ Trang</button>
        </div>

        <div id="twin-feed"></div>
      </section>

      <aside class="twin-sidebar twin-right-col">
        <div class="twin-card" style="padding:14px;margin-bottom:14px;">
          <div style="font-size:12px;font-weight:700;color:var(--text-3);margin-bottom:8px;">TỔNG QUAN TWIN</div>
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;">
            <span class="twin-post-meta">Bài viết</span>
            <strong id="stat-posts-count">0</strong>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13.5px;">
            <span class="twin-post-meta">Thành viên</span>
            <strong id="stat-users-count">0</strong>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;padding-right:6px;">
          <div class="twin-side-heading">Người liên hệ</div>
          <a href="./messages.html" style="font-size:12.5px;color:var(--primary);font-weight:600;">Mở Chat</a>
        </div>
        <div id="twin-contacts"></div>
      </aside>
    </div>
  </main>

  <div class="twin-modal-backdrop" id="story-modal">
    <div class="twin-modal" style="max-width:400px;padding:0;overflow:hidden;">
      <div style="position:relative;">
        <img id="story-modal-img" style="width:100%;max-height:72vh;object-fit:cover;" alt="Story" />
        <div style="position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.8);">
          <strong id="story-modal-author"></strong>
          <button id="story-modal-close" class="twin-icon-btn" style="width:32px;height:32px;">✕</button>
        </div>
      </div>
      <div id="story-modal-caption" style="padding:14px;font-size:14px;"></div>
    </div>
  </div>

  <input id="story-file-input" type="file" accept="image/*" hidden />

  <script type="module">
    import { initTwinPage, openTwinChat } from "./assets/js/layout.js";
    import { renderPostList } from "./assets/js/post-ui.js";
    import {
      db,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      uploadToCloudinary,
      DEFAULT_AVATAR,
      escapeHtml,
      showToast,
      friendlyError,
      toMillis
    } from "./assets/js/firebase-service.js";

    let me = null;
    let allPosts = [];
    let activeFilter = "all";
    let selectedFile = null;

    const previewWrap = document.getElementById("post-preview-wrap");
    const previewImg = document.getElementById("post-preview-img");
    const fileInput = document.getElementById("post-image-file");

    fileInput.onchange = () => {
      selectedFile = fileInput.files[0] || null;
      if (selectedFile) {
        previewImg.src = URL.createObjectURL(selectedFile);
        previewWrap.style.display = "block";
      } else {
        previewWrap.style.display = "none";
      }
    };
    document.getElementById("post-preview-remove").onclick = () => {
      selectedFile = null;
      fileInput.value = "";
      previewWrap.style.display = "none";
    };
    document.getElementById("story-modal-close").onclick = () => {
      document.getElementById("story-modal").classList.remove("open");
    };

    document.querySelectorAll(".feed-filter").forEach((btn) => {
      btn.onclick = () => {
        activeFilter = btn.dataset.filter;
        document.querySelectorAll(".feed-filter").forEach((b) => {
          b.className = b === btn
            ? "twin-btn twin-btn-primary twin-btn-sm feed-filter"
            : "twin-btn twin-btn-secondary twin-btn-sm feed-filter";
        });
        renderFeedList(document.getElementById("twin-global-search")?.value || "");
      };
    });

    function renderFeedList(filterText = "") {
      const feed = document.getElementById("twin-feed");
      const q = filterText.trim().toLowerCase();

      const filtered = allPosts
        .filter((p) => {
          if (activeFilter === "pinned" && !p.pinned) return false;
          if (activeFilter === "photo" && !p.imageUrl) return false;
          if (activeFilter === "page" && !p.pageId) return false;
          if (!q) return true;
          return (
            (p.content || "").toLowerCase().includes(q) ||
            (p.authorName || "").toLowerCase().includes(q) ||
            (p.pageName || "").toLowerCase().includes(q) ||
            (p.groupName || "").toLowerCase().includes(q)
          );
        })
        .sort((a, b) => {
          const pinA = a.pinned ? 1 : 0;
          const pinB = b.pinned ? 1 : 0;
          if (pinB !== pinA) return pinB - pinA;
          if (pinA && pinB && (b.pinnedAt || 0) !== (a.pinnedAt || 0)) {
            return (b.pinnedAt || 0) - (a.pinnedAt || 0);
          }
          return toMillis(b.createdAt) - toMillis(a.createdAt);
        });

      const empty = q
        ? '<div class="twin-card" style="text-align:center;color:var(--text-3);padding:32px;">Không tìm thấy bài viết phù hợp.</div>'
        : '<div class="twin-card" style="text-align:center;color:var(--text-3);padding:32px;">Chưa có bài viết nào. Hãy chia sẻ điều đầu tiên trên Twin!</div>';
      renderPostList(feed, filtered, me, empty);
    }

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;

        document.getElementById("side-me-name").textContent = me.name;
        document.getElementById("side-me-avatar").src = me.avatar || DEFAULT_AVATAR;
        document.getElementById("composer-avatar").src = me.avatar || DEFAULT_AVATAR;

        const searchEl = document.getElementById("twin-global-search");
        const initialQ = new URLSearchParams(window.location.search).get("q");
        if (searchEl && initialQ) searchEl.value = initialQ;
        searchEl?.addEventListener("input", (e) => {
          renderFeedList(e.target.value);
        });

        document.getElementById("btn-publish-post").onclick = async () => {
          const btn = document.getElementById("btn-publish-post");
          const content = document.getElementById("post-content").value.trim();
          const feeling = document.getElementById("post-feeling").value;
          if (!content && !selectedFile) return showToast("Hãy nhập nội dung hoặc chọn ảnh.");
          btn.disabled = true;
          btn.textContent = "Đang đăng...";
          try {
            let imageUrl = "";
            if (selectedFile) imageUrl = await uploadToCloudinary(selectedFile);
            await addDoc(collection(db, "posts"), {
              authorUid: me.uid,
              authorName: me.name,
              authorAvatar: me.avatar || DEFAULT_AVATAR,
              content,
              feeling,
              imageUrl,
              pinned: false,
              reactions: {},
              comments: [],
              createdAt: serverTimestamp()
            });
            document.getElementById("post-content").value = "";
            document.getElementById("post-feeling").value = "";
            selectedFile = null;
            fileInput.value = "";
            previewWrap.style.display = "none";
            showToast("Đã đăng bài!");
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            btn.disabled = false;
            btn.textContent = "Đăng bài";
          }
        };

        const storyFile = document.getElementById("story-file-input");
        storyFile.onchange = async () => {
          const f = storyFile.files[0];
          if (!f) return;
          const caption = prompt("Chú thích ngắn cho tin (tùy chọn):", "") || "";
          showToast("Đang tải tin lên...");
          try {
            const imageUrl = await uploadToCloudinary(f);
            await addDoc(collection(db, "stories"), {
              authorUid: me.uid,
              authorName: me.name,
              authorAvatar: me.avatar || DEFAULT_AVATAR,
              imageUrl,
              caption,
              createdAt: serverTimestamp()
            });
            showToast("Đã đăng tin!");
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            storyFile.value = "";
          }
        };

        onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "desc"), limit(15)), (snap) => {
          const row = document.getElementById("twin-stories");
          row.innerHTML = `
            <div class="twin-story-card" id="btn-add-story">
              <img class="story-bg" src="${escapeHtml(me.avatar || DEFAULT_AVATAR)}" alt="" />
              <div class="twin-story-overlay">
                <div class="twin-story-plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
                <div class="twin-story-name">Tạo tin</div>
              </div>
            </div>
          `;
          document.getElementById("btn-add-story").onclick = () => storyFile.click();

          const dayAgo = Date.now() - 24 * 60 * 60 * 1000;
          snap.forEach((d) => {
            const s = d.data();
            if (s.createdAt && toMillis(s.createdAt) < dayAgo) return;
            if (!s.imageUrl) return;
            const card = document.createElement("div");
            card.className = "twin-story-card";
            card.innerHTML = `
              <img class="story-bg" src="${escapeHtml(s.imageUrl)}" alt="" />
              <div class="twin-story-overlay">
                <img class="twin-story-avatar" src="${escapeHtml(s.authorAvatar || DEFAULT_AVATAR)}" alt="" />
                <div class="twin-story-name">${escapeHtml(s.authorName)}</div>
              </div>
            `;
            card.onclick = () => {
              document.getElementById("story-modal-img").src = s.imageUrl;
              document.getElementById("story-modal-author").textContent = s.authorName;
              document.getElementById("story-modal-caption").textContent = s.caption || "";
              document.getElementById("story-modal").classList.add("open");
            };
            row.appendChild(card);
          });
        }, (err) => showToast(friendlyError(err)));

        onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(50)), (snap) => {
          allPosts = [];
          snap.forEach((d) => allPosts.push({ id: d.id, ...d.data() }));
          document.getElementById("stat-posts-count").textContent = String(allPosts.length);
          renderFeedList(document.getElementById("twin-global-search")?.value || "");
        }, (err) => showToast(friendlyError(err)));

        onSnapshot(query(collection(db, "users"), limit(100)), (snap) => {
          const contactsEl = document.getElementById("twin-contacts");
          contactsEl.innerHTML = "";
          document.getElementById("stat-users-count").textContent = String(snap.size);
          snap.forEach((d) => {
            const u = d.data();
            if (u.uid === me.uid) return;
            const btn = document.createElement("button");
            btn.className = "twin-side-item";
            btn.innerHTML = `
              <img class="twin-avatar twin-avatar-sm" src="${escapeHtml(u.avatar || DEFAULT_AVATAR)}" alt="" />
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(u.name)}</span>
            `;
            btn.onclick = () => openTwinChat(u);
            contactsEl.appendChild(btn);
          });
        }, (err) => console.warn("Contacts:", err));
      }
    });
  </script>
</body>
</html>
