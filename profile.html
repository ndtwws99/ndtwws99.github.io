<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#edf2f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080b13" media="(prefers-color-scheme: dark)" />
  <title>Trang cá nhân — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231877f2'/%3E%3Cstop offset='100%25' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M17 20h30v7.5H36V48h-8V27.5H17z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body class="">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main" style="max-width:980px;">
    <section class="twin-profile-hero">
      <div class="twin-cover-wrap">
        <img id="pf-cover" class="twin-cover-img" alt="Ảnh bìa" style="display:none;" />
        <label id="pf-cover-btn" class="twin-btn twin-btn-secondary twin-btn-sm" style="position:absolute;right:16px;bottom:16px;display:none;cursor:pointer;backdrop-filter:blur(8px);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          <span>Đổi ảnh bìa</span>
          <input id="pf-cover-input" type="file" accept="image/*" hidden />
        </label>
      </div>
      <div class="twin-profile-bar">
        <div class="twin-profile-id">
          <div style="position:relative;">
            <img id="pf-avatar" class="twin-avatar twin-avatar-xl" alt="Avatar" />
            <label id="pf-avatar-btn" class="twin-icon-btn" style="position:absolute;right:4px;bottom:4px;display:none;cursor:pointer;box-shadow:var(--shadow-sm);" title="Đổi ảnh đại diện">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
              <input id="pf-avatar-input" type="file" accept="image/*" hidden />
            </label>
          </div>
          <div style="padding-bottom:6px;">
            <h1 id="pf-name" style="font-size:26px;font-weight:800;letter-spacing:-0.5px;">Đang tải...</h1>
            <p id="pf-bio" class="twin-post-meta" style="font-size:14.5px;margin-top:2px;"></p>
          </div>
        </div>
        <div id="pf-actions" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
      </div>
    </section>

    <div class="twin-grid-2">
      <aside class="twin-card twin-profile-about">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="font-size:16.5px;font-weight:800;">Giới thiệu</h3>
          <button id="pf-open-edit-btn" class="twin-btn twin-btn-secondary twin-btn-sm" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <span>Chỉnh sửa</span>
          </button>
        </div>

        <p id="pf-bio-box" style="font-size:14px;color:var(--text-2);margin-bottom:14px;line-height:1.55;"></p>

        <ul id="pf-meta-list" class="twin-profile-meta-list"></ul>
      </aside>

      <section>
        <div id="pf-posts"></div>
      </section>
    </div>
  </main>

  <!-- Modal chỉnh sửa thông tin cá nhân -->
  <div class="twin-modal-backdrop" id="pf-edit-modal">
    <div class="twin-modal" style="max-width:520px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="font-size:19px;font-weight:800;">Chỉnh sửa thông tin cá nhân</h2>
        <button type="button" id="pf-edit-close" class="twin-icon-btn" style="width:32px;height:32px;">✕</button>
      </div>
      <form id="pf-edit-form" style="display:flex;flex-direction:column;gap:12px;">
        <div class="twin-form-field">
          <label for="edit-name">Tên hiển thị</label>
          <input id="edit-name" class="twin-input" type="text" maxlength="60" placeholder="Họ và tên" required />
        </div>
        <div class="twin-form-field">
          <label for="edit-bio">Tiểu sử</label>
          <textarea id="edit-bio" class="twin-textarea" maxlength="300" rows="2" placeholder="Giới thiệu ngắn về bạn..."></textarea>
        </div>
        <div class="twin-form-row">
          <div class="twin-form-field">
            <label for="edit-birthday">Ngày sinh</label>
            <input id="edit-birthday" class="twin-input" type="date" />
          </div>
          <div class="twin-form-field">
            <label for="edit-gender">Giới tính</label>
            <select id="edit-gender" class="twin-select">
              <option value="">Chưa chọn</option>
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
              <option value="Khác">Khác</option>
            </select>
          </div>
        </div>
        <div class="twin-form-row">
          <div class="twin-form-field">
            <label for="edit-hometown">Quê quán</label>
            <input id="edit-hometown" class="twin-input" type="text" maxlength="120" placeholder="VD: Bắc Ninh" />
          </div>
          <div class="twin-form-field">
            <label for="edit-location">Đang sống tại</label>
            <input id="edit-location" class="twin-input" type="text" maxlength="120" placeholder="VD: Hà Nội" />
          </div>
        </div>
        <div class="twin-form-row">
          <div class="twin-form-field">
            <label for="edit-email">Email liên hệ</label>
            <input id="edit-email" class="twin-input" type="email" maxlength="120" placeholder="email@example.com" />
          </div>
          <div class="twin-form-field">
            <label for="edit-phone">Số điện thoại</label>
            <input id="edit-phone" class="twin-input" type="tel" maxlength="30" placeholder="09xx xxx xxx" />
          </div>
        </div>
        <div class="twin-form-row">
          <div class="twin-form-field">
            <label for="edit-work">Công việc</label>
            <input id="edit-work" class="twin-input" type="text" maxlength="120" placeholder="Nghề nghiệp / Nơi làm việc" />
          </div>
          <div class="twin-form-field">
            <label for="edit-education">Học vấn</label>
            <input id="edit-education" class="twin-input" type="text" maxlength="120" placeholder="Trường học / Chuyên ngành" />
          </div>
        </div>
        <div class="twin-form-field">
          <label for="edit-website">Liên kết / Website</label>
          <input id="edit-website" class="twin-input" type="url" maxlength="200" placeholder="https://..." />
        </div>

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
          <button type="button" id="pf-edit-cancel" class="twin-btn twin-btn-secondary">Hủy</button>
          <button type="submit" id="pf-edit-save" class="twin-btn twin-btn-primary">Lưu thông tin</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import { renderPostList } from "./assets/js/post-ui.js";
    import {
      auth,
      db,
      doc,
      getDoc,
      updateDoc,
      updateProfile,
      collection,
      query,
      where,
      onSnapshot,
      arrayUnion,
      arrayRemove,
      uploadToCloudinary,
      pushNotification,
      DEFAULT_AVATAR,
      escapeHtml,
      toMillis,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    const META_ICONS = {
      birthday: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>`,
      gender: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      hometown: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`,
      location: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
      email: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>`,
      phone: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
      work: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`,
      education: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
      website: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>`,
      joined: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>`
    };

    function formatBirthday(val) {
      if (!val) return "";
      const parts = String(val).split("-");
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return val;
    }

    function renderProfileMeta(profile, isMe) {
      const list = document.getElementById("pf-meta-list");
      const rows = [
        { icon: META_ICONS.work, label: "Công việc", value: profile.work },
        { icon: META_ICONS.education, label: "Học vấn", value: profile.education },
        { icon: META_ICONS.location, label: "Đang sống tại", value: profile.location },
        { icon: META_ICONS.hometown, label: "Quê quán", value: profile.hometown },
        { icon: META_ICONS.birthday, label: "Ngày sinh", value: formatBirthday(profile.birthday) },
        { icon: META_ICONS.gender, label: "Giới tính", value: profile.gender },
        { icon: META_ICONS.email, label: "Email", value: profile.email, href: profile.email ? `mailto:${profile.email}` : "" },
        { icon: META_ICONS.phone, label: "Điện thoại", value: profile.phone, href: profile.phone ? `tel:${profile.phone.replace(/\s+/g, "")}` : "" },
        { icon: META_ICONS.website, label: "Website", value: profile.website, href: /^https?:\/\//i.test(profile.website || "") ? profile.website : "", external: true }
      ];

      if (profile.createdAt) {
        const ms = toMillis(profile.createdAt);
        if (ms > 0) {
          rows.push({
            icon: META_ICONS.joined,
            label: "Tham gia",
            value: new Date(ms).toLocaleDateString("vi-VN", { month: "2-digit", year: "numeric" })
          });
        }
      }

      const filled = rows.filter((r) => r.value);
      if (!filled.length) {
        list.innerHTML = `<li class="twin-post-meta" style="padding:4px 0;">${isMe ? 'Chưa cập nhật thông tin chi tiết. Nhấn "Chỉnh sửa" để thêm ngày sinh, quê quán, email...' : "Người dùng chưa cập nhật thêm thông tin."}</li>`;
        return;
      }

      list.innerHTML = filled
        .map((r) => {
          const valHtml = r.href
            ? `<a href="${escapeHtml(r.href)}" ${r.external ? 'target="_blank" rel="noopener noreferrer"' : ""} style="color:var(--primary);font-weight:600;word-break:break-all;">${escapeHtml(r.value)}</a>`
            : `<strong style="font-weight:600;color:var(--text);">${escapeHtml(r.value)}</strong>`;
          return `
            <li class="twin-profile-meta-item">
              <span class="twin-profile-meta-icon">${r.icon}</span>
              <div style="min-width:0;flex:1;">
                <span style="color:var(--text-3);">${r.label}: </span>${valHtml}
              </div>
            </li>`;
        })
        .join("");
    }

    initTwinPage({
      requireAuth: true,
      onReady: async (me) => {
        if (!me) return;
        const targetUid = new URLSearchParams(window.location.search).get("uid") || me.uid;
        const isMe = targetUid === me.uid;

        const snap = await getDoc(doc(db, "users", targetUid));
        if (!snap.exists()) {
          document.getElementById("pf-name").textContent = "Không tìm thấy người dùng";
          return;
        }
        const profile = snap.data();
        if (isMe && !profile.email && auth.currentUser?.email) {
          profile.email = auth.currentUser.email;
        }

        const paintProfileHeader = () => {
          document.title = `${profile.name} — Twin`;
          document.getElementById("pf-name").textContent = profile.name;
          document.getElementById("pf-bio").textContent = profile.bio || "";
          document.getElementById("pf-bio-box").textContent = profile.bio || "Chưa có tiểu sử.";
          document.getElementById("pf-avatar").src = profile.avatar || DEFAULT_AVATAR;
          if (profile.cover) {
            const c = document.getElementById("pf-cover");
            c.src = profile.cover;
            c.style.display = "block";
          }
          renderProfileMeta(profile, isMe);
        };
        paintProfileHeader();

        if (isMe) {
          document.getElementById("pf-cover-btn").style.display = "inline-flex";
          document.getElementById("pf-avatar-btn").style.display = "grid";
          const editBtn = document.getElementById("pf-open-edit-btn");
          editBtn.style.display = "inline-flex";

          const editModal = document.getElementById("pf-edit-modal");
          const closeEdit = () => editModal.classList.remove("open");
          document.getElementById("pf-edit-close").onclick = closeEdit;
          document.getElementById("pf-edit-cancel").onclick = closeEdit;

          editBtn.onclick = () => {
            document.getElementById("edit-name").value = profile.name || "";
            document.getElementById("edit-bio").value = profile.bio || "";
            document.getElementById("edit-birthday").value = profile.birthday || "";
            document.getElementById("edit-gender").value = profile.gender || "";
            document.getElementById("edit-hometown").value = profile.hometown || "";
            document.getElementById("edit-location").value = profile.location || "";
            document.getElementById("edit-email").value = profile.email || "";
            document.getElementById("edit-phone").value = profile.phone || "";
            document.getElementById("edit-work").value = profile.work || "";
            document.getElementById("edit-education").value = profile.education || "";
            document.getElementById("edit-website").value = profile.website || "";
            editModal.classList.add("open");
          };

          document.getElementById("pf-edit-form").onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById("pf-edit-save");
            saveBtn.disabled = true;
            saveBtn.textContent = "Đang lưu...";
            const payload = {
              name: document.getElementById("edit-name").value.trim().slice(0, 60) || profile.name,
              bio: document.getElementById("edit-bio").value.trim().slice(0, 300),
              birthday: document.getElementById("edit-birthday").value,
              gender: document.getElementById("edit-gender").value,
              hometown: document.getElementById("edit-hometown").value.trim().slice(0, 120),
              location: document.getElementById("edit-location").value.trim().slice(0, 120),
              email: document.getElementById("edit-email").value.trim().slice(0, 120),
              phone: document.getElementById("edit-phone").value.trim().slice(0, 30),
              work: document.getElementById("edit-work").value.trim().slice(0, 120),
              education: document.getElementById("edit-education").value.trim().slice(0, 120),
              website: document.getElementById("edit-website").value.trim().slice(0, 200)
            };
            try {
              await updateDoc(doc(db, "users", me.uid), payload);
              if (auth.currentUser && payload.name !== auth.currentUser.displayName) {
                updateProfile(auth.currentUser, { displayName: payload.name }).catch(() => {});
              }
              Object.assign(profile, payload);
              paintProfileHeader();
              closeEdit();
              showToast("Đã cập nhật thông tin cá nhân!");
            } catch (err) {
              showToast(friendlyError(err));
            } finally {
              saveBtn.disabled = false;
              saveBtn.textContent = "Lưu thông tin";
            }
          };

          document.getElementById("pf-avatar-input").onchange = async (e) => {
            const f = e.target.files[0];
            if (!f) return;
            showToast("Đang tải ảnh đại diện...");
            try {
              const url = await uploadToCloudinary(f);
              await updateDoc(doc(db, "users", me.uid), { avatar: url });
              profile.avatar = url;
              document.getElementById("pf-avatar").src = url;
              showToast("Đã cập nhật ảnh đại diện!");
            } catch (err) {
              showToast(friendlyError(err));
            } finally {
              e.target.value = "";
            }
          };

          document.getElementById("pf-cover-input").onchange = async (e) => {
            const f = e.target.files[0];
            if (!f) return;
            showToast("Đang tải ảnh bìa...");
            try {
              const url = await uploadToCloudinary(f);
              await updateDoc(doc(db, "users", me.uid), { cover: url });
              profile.cover = url;
              const c = document.getElementById("pf-cover");
              c.src = url;
              c.style.display = "block";
              showToast("Đã cập nhật ảnh bìa!");
            } catch (err) {
              showToast(friendlyError(err));
            } finally {
              e.target.value = "";
            }
          };
        } else {
          const actions = document.getElementById("pf-actions");
          let state = (me.friends || []).includes(targetUid)
            ? "friend"
            : (me.friendRequests || []).includes(targetUid)
              ? "incoming"
              : (profile.friendRequests || []).includes(me.uid)
                ? "sent"
                : "none";

          const labels = {
            friend: ["Bạn bè", "twin-btn-secondary"],
            incoming: ["Chấp nhận lời mời", "twin-btn-primary"],
            sent: ["Hủy lời mời", "twin-btn-secondary"],
            none: ["Thêm bạn bè", "twin-btn-primary"]
          };

          actions.innerHTML = `
            <button id="btn-add-fr" class="twin-btn"></button>
            <a href="./messages.html?uid=${encodeURIComponent(targetUid)}" class="twin-btn twin-btn-secondary">Nhắn tin</a>
          `;
          const frBtn = document.getElementById("btn-add-fr");
          const paintFr = () => {
            frBtn.textContent = labels[state][0];
            frBtn.className = `twin-btn ${labels[state][1]}`;
            frBtn.disabled = state === "friend";
          };
          paintFr();

          frBtn.onclick = async () => {
            frBtn.disabled = true;
            try {
              if (state === "none") {
                await updateDoc(doc(db, "users", targetUid), { friendRequests: arrayUnion(me.uid) });
                state = "sent";
                showToast("Đã gửi lời mời kết bạn!");
                pushNotification(targetUid, {
                  fromUid: me.uid,
                  fromName: me.name,
                  fromAvatar: me.avatar,
                  type: "friend",
                  text: "đã gửi lời mời kết bạn.",
                  link: "./friends.html"
                });
              } else if (state === "sent") {
                await updateDoc(doc(db, "users", targetUid), { friendRequests: arrayRemove(me.uid) });
                state = "none";
                showToast("Đã hủy lời mời.");
              } else if (state === "incoming") {
                await updateDoc(doc(db, "users", me.uid), { friendRequests: arrayRemove(targetUid), friends: arrayUnion(targetUid) });
                await updateDoc(doc(db, "users", targetUid), { friends: arrayUnion(me.uid), friendRequests: arrayRemove(me.uid) });
                state = "friend";
                showToast(`Bạn và ${profile.name} đã là bạn bè!`);
                pushNotification(targetUid, {
                  fromUid: me.uid,
                  fromName: me.name,
                  fromAvatar: me.avatar,
                  type: "friend",
                  text: "đã chấp nhận lời mời kết bạn.",
                  link: `./profile.html?uid=${encodeURIComponent(me.uid)}`
                });
              }
            } catch (err) {
              showToast(friendlyError(err));
            } finally {
              paintFr();
            }
          };
        }

        const q = query(collection(db, "posts"), where("authorUid", "==", targetUid));
        onSnapshot(q, (snap) => {
          const box = document.getElementById("pf-posts");
          const items = [];
          snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
          items.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || ((b.pinned && a.pinned) ? ((b.pinnedAt || 0) - (a.pinnedAt || 0)) : 0) || (toMillis(b.createdAt) - toMillis(a.createdAt)));
          renderPostList(
            box,
            items,
            me,
            '<div class="twin-card" style="color:var(--text-3);text-align:center;padding:28px;">Chưa có bài viết nào.</div>'
          );
        }, (err) => showToast(friendlyError(err)));
      }
    });
  </script>
</body>
</html>
