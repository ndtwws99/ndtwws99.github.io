<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Trang cá nhân — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23007aff'/%3E%3Cstop offset='100%25' stop-color='%235856d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Cpath d='M19 21h26v6H35.5v18h-7V27H19z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
  <link rel="modulepreload" href="./assets/js/firebase-service.js" />
  <link rel="modulepreload" href="./assets/js/layout.js" />
  <link rel="modulepreload" href="./assets/js/post-ui.js" />
</head>
<body class="">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main" style="max-width:980px;">
    <section class="twin-profile-hero">
      <div class="twin-cover-wrap">
        <img id="pf-cover" class="twin-cover-img" alt="Ảnh bìa" style="display:none;" />
        <div class="twin-cover-actions">
          <label id="pf-cover-btn" class="twin-cover-glass-btn" style="display:none;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.5 7H4.5A2.5 2.5 0 0 0 2 9.5v8A2.5 2.5 0 0 0 4.5 20h15a2.5 2.5 0 0 0 2.5-2.5v-8A2.5 2.5 0 0 0 19.5 7h-3l-2-3Z"/><circle cx="12" cy="13.2" r="3.2"/></svg>
            <span>Đổi ảnh bìa</span>
            <input id="pf-cover-input" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="pf-cover-remove-btn" class="twin-cover-glass-btn" style="display:none;" title="Gỡ ảnh bìa">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span>Gỡ bìa</span>
          </button>
        </div>
      </div>

      <div class="twin-profile-bar">
        <div class="twin-profile-id">
          <div class="twin-profile-avatar-wrap">
            <button type="button" id="pf-avatar-view-trigger" class="twin-profile-avatar-ring twin-profile-avatar-btn" title="Xem ảnh đại diện" aria-label="Xem ảnh đại diện">
              <img id="pf-avatar" class="twin-avatar twin-avatar-xl" alt="Avatar" />
            </button>
            <label id="pf-avatar-btn" class="twin-icon-btn twin-profile-cam-btn" style="display:none;" title="Đổi ảnh đại diện" aria-label="Đổi ảnh đại diện">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.5 7H4.5A2.5 2.5 0 0 0 2 9.5v8A2.5 2.5 0 0 0 4.5 20h15a2.5 2.5 0 0 0 2.5-2.5v-8A2.5 2.5 0 0 0 19.5 7h-3l-2-3Z"/><circle cx="12" cy="13.2" r="3.2"/></svg>
              <input id="pf-avatar-input" type="file" accept="image/*" hidden />
            </label>
          </div>
          <div class="twin-profile-meta-block">
            <h1 id="pf-name" class="twin-profile-name">Đang tải...</h1>
            <div id="pf-presence" class="twin-presence-line" style="display:none;"></div>
            <div class="twin-profile-stats" id="pf-stats">
              <div class="twin-profile-stat">
                <strong id="pf-posts-count">0</strong>
                <span>Bài viết</span>
              </div>
              <div class="twin-profile-stat">
                <strong id="pf-friends-count">0</strong>
                <span>Bạn bè</span>
              </div>
            </div>
          </div>
        </div>
        <div id="pf-actions" class="twin-profile-actions"></div>
      </div>
    </section>

    <div class="twin-profile-tabs-wrap">
      <div class="twin-seg-tabs twin-profile-tabs" role="tablist" aria-label="Mục trang cá nhân">
        <button type="button" class="twin-seg-tab active" data-pftab="posts" role="tab" aria-selected="true">Bài viết <span id="pftab-posts-count" class="twin-tab-badge">0</span></button>
        <button type="button" class="twin-seg-tab" data-pftab="photos" role="tab" aria-selected="false">Album ảnh <span id="pftab-photos-count" class="twin-tab-badge">0</span></button>
        <button type="button" class="twin-seg-tab" data-pftab="videos" role="tab" aria-selected="false">Video <span id="pftab-videos-count" class="twin-tab-badge">0</span></button>
      </div>
    </div>

    <div class="twin-grid-2">
      <aside class="twin-profile-left-stack">
        <div class="twin-card twin-profile-about">
          <h3 style="font-size:16.5px;font-weight:800;letter-spacing:-0.02em;margin-bottom:12px;">Giới thiệu</h3>
          <p id="pf-bio-box" style="font-size:14px;color:var(--text-2);margin-bottom:14px;line-height:1.55;"></p>
          <div id="pf-info-list" class="twin-info-list"></div>
        </div>

        <div id="pf-mini-album-card" class="twin-card" style="display:none;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <h3 style="font-size:15.5px;font-weight:800;letter-spacing:-0.02em;">Album ảnh</h3>
            <button type="button" id="pf-mini-album-all" style="font-size:12.5px;font-weight:700;color:var(--primary);">Xem tất cả</button>
          </div>
          <div id="pf-mini-album-grid" class="twin-profile-mini-album"></div>
        </div>
      </aside>

      <section>
        <div id="pf-tab-posts-panel">
          <div id="pf-composer-slot"></div>
          <div id="pf-posts"></div>
        </div>
        <div id="pf-tab-photos-panel" style="display:none;"></div>
        <div id="pf-tab-videos-panel" style="display:none;"></div>
      </section>
    </div>
  </main>

  <!-- Chế độ xem ảnh đại diện toàn màn hình -->
  <div class="twin-modal-backdrop twin-avatar-lightbox" id="pf-avatar-lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh đại diện">
    <div class="twin-avatar-lightbox-inner">
      <div class="twin-avatar-lightbox-bar">
        <div id="pf-lightbox-title" class="twin-avatar-lightbox-title">Ảnh đại diện</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button type="button" id="pf-lightbox-change" class="twin-btn twin-btn-secondary twin-btn-sm" style="display:none;">Đổi ảnh đại diện</button>
          <button type="button" id="pf-lightbox-close" class="twin-icon-btn twin-lightbox-close-btn" aria-label="Đóng">✕</button>
        </div>
      </div>
      <div class="twin-avatar-lightbox-stage">
        <img id="pf-lightbox-img" src="" alt="Ảnh đại diện phóng lớn" />
      </div>
    </div>
  </div>

  <!-- Modal chỉnh sửa đầy đủ thông tin trang cá nhân -->
  <div class="twin-modal-backdrop" id="pf-edit-modal">
    <div class="twin-modal" style="max-width:560px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="font-size:19px;font-weight:800;">Chỉnh sửa trang cá nhân</h2>
        <button type="button" id="pf-edit-close" class="twin-icon-btn" style="width:34px;height:34px;">✕</button>
      </div>
      <form id="pf-edit-form" style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <label class="twin-field-label" for="pf-in-name">Tên hiển thị</label>
          <input id="pf-in-name" class="twin-input" type="text" maxlength="60" placeholder="Họ và tên" required />
        </div>

        <div>
          <label class="twin-field-label" for="pf-in-bio">Tiểu sử</label>
          <textarea id="pf-in-bio" class="twin-textarea" maxlength="300" placeholder="Giới thiệu ngắn về bạn..." style="min-height:72px;"></textarea>
        </div>

        <div class="twin-form-grid-2">
          <div>
            <label class="twin-field-label" for="pf-in-birthday">Ngày sinh</label>
            <input id="pf-in-birthday" class="twin-input" type="date" />
          </div>
          <div>
            <label class="twin-field-label" for="pf-in-gender">Giới tính</label>
            <select id="pf-in-gender" class="twin-select">
              <option value="">Không hiển thị</option>
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
              <option value="Khác">Khác</option>
            </select>
          </div>
        </div>

        <div class="twin-form-grid-2">
          <div>
            <label class="twin-field-label" for="pf-in-hometown">Quê quán</label>
            <input id="pf-in-hometown" class="twin-input" type="text" maxlength="100" placeholder="VD: Đà Nẵng, Việt Nam" />
          </div>
          <div>
            <label class="twin-field-label" for="pf-in-location">Nơi sống hiện tại</label>
            <input id="pf-in-location" class="twin-input" type="text" maxlength="100" placeholder="VD: TP. Hồ Chí Minh" />
          </div>
        </div>

        <div class="twin-form-grid-2">
          <div>
            <label class="twin-field-label" for="pf-in-work">Công việc</label>
            <input id="pf-in-work" class="twin-input" type="text" maxlength="100" placeholder="VD: Thiết kế UI/UX tại Twin" />
          </div>
          <div>
            <label class="twin-field-label" for="pf-in-education">Học vấn</label>
            <input id="pf-in-education" class="twin-input" type="text" maxlength="100" placeholder="VD: Đại học Bách Khoa" />
          </div>
        </div>

        <div class="twin-form-grid-2">
          <div>
            <label class="twin-field-label" for="pf-in-relationship">Mối quan hệ</label>
            <select id="pf-in-relationship" class="twin-select">
              <option value="">Không hiển thị</option>
              <option value="Độc thân">Độc thân</option>
              <option value="Đang hẹn hò">Đang hẹn hò</option>
              <option value="Đã đính hôn">Đã đính hôn</option>
              <option value="Đã kết hôn">Đã kết hôn</option>
              <option value="Phức tạp">Phức tạp</option>
            </select>
          </div>
          <div>
            <label class="twin-field-label" for="pf-in-phone">Số điện thoại</label>
            <input id="pf-in-phone" class="twin-input" type="tel" maxlength="25" placeholder="VD: 0901 234 567" />
          </div>
        </div>

        <div class="twin-form-grid-2">
          <div>
            <label class="twin-field-label" for="pf-in-email">Email liên hệ</label>
            <input id="pf-in-email" class="twin-input" type="email" maxlength="120" placeholder="email@example.com" />
          </div>
          <div>
            <label class="twin-field-label" for="pf-in-website">Website / Liên kết</label>
            <input id="pf-in-website" class="twin-input" type="url" maxlength="180" placeholder="https://..." />
          </div>
        </div>

        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2);cursor:pointer;">
          <input id="pf-in-show-email" type="checkbox" style="width:16px;height:16px;accent-color:var(--primary);" />
          <span>Hiển thị địa chỉ email trên trang cá nhân</span>
        </label>

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
          <button type="button" id="pf-edit-cancel" class="twin-btn twin-btn-secondary">Hủy</button>
          <button type="submit" id="pf-edit-save" class="twin-btn twin-btn-primary">Lưu thông tin</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import { renderPostList, mountPostComposer, renderMediaGallery, extractMediaFromPosts, openMediaLightbox } from "./assets/js/post-ui.js";
    import {
      auth,
      db,
      doc,
      getDoc,
      updateDoc,
      updateProfile,
      collection,
      query,
      where,
      onSnapshot,
      arrayUnion,
      arrayRemove,
      uploadToCloudinary,
      pushNotification,
      isUserAdmin,
      isGuestUser,
      renderAdminIconHtml,
      getUserPresence,
      canViewPost,
      unfriendUser,
      twinConfirm,
      DEFAULT_AVATAR,
      escapeHtml,
      toMillis,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    const INFO_ICONS = {
      work: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="3"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M2 13h20"/></svg>`,
      education: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
      location: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5.5-8 11.5-8 11.5S4 15.5 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`,
      hometown: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V19a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V9.5"/></svg>`,
      birthday: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M8 8v4"/><path d="M12 8v4"/><path d="M16 8v4"/></svg>`,
      gender: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M19.5 20.5a7.5 7.5 0 0 0-15 0"/></svg>`,
      heart: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
      mail: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>`,
      phone: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
      globe: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 2.5a14 14 0 0 0 0 19 14 14 0 0 0 0-19"/><path d="M2.5 12h19"/></svg>`,
      calendar: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="3"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>`
    };

    function formatBirthday(val) {
      if (!val) return "";
      const parts = String(val).split("-");
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return val;
    }

    function safeExternalUrl(raw) {
      const s = String(raw || "").trim();
      if (!s) return "";
      try {
        const u = new URL(/^https?:\/\//i.test(s) ? s : `https://${s}`);
        if (u.protocol === "http:" || u.protocol === "https:") return u.href;
      } catch {}
      return "";
    }

    function renderProfileDetails(profile, isMe, viewerIsAdmin = false) {
      document.title = `${profile.name} — Twin`;
      const nameEl = document.getElementById("pf-name");
      nameEl.innerHTML = `${escapeHtml(profile.name || "Thành viên Twin")}${renderAdminIconHtml(profile)}${
        isUserAdmin(profile) ? `<span class="twin-role-badge admin" style="vertical-align:middle;">Quản trị viên</span>` : ""
      }`;
      document.getElementById("pf-bio-box").textContent = profile.bio || "Chưa có tiểu sử.";
      document.getElementById("pf-friends-count").textContent = String((profile.friends || []).length);

      const canSeePrivateInfo = isMe || viewerIsAdmin || profile.showPersonalInfo !== false;
      const rows = [];

      if (canSeePrivateInfo) {
        if (profile.work) {
          rows.push({ icon: INFO_ICONS.work, html: `Công việc: <strong>${escapeHtml(profile.work)}</strong>` });
        }
        if (profile.education) {
          rows.push({ icon: INFO_ICONS.education, html: `Học vấn: <strong>${escapeHtml(profile.education)}</strong>` });
        }
        if (profile.location) {
          rows.push({ icon: INFO_ICONS.location, html: `Sống tại <strong>${escapeHtml(profile.location)}</strong>` });
        }
        if (profile.hometown) {
          rows.push({ icon: INFO_ICONS.hometown, html: `Quê quán: <strong>${escapeHtml(profile.hometown)}</strong>` });
        }
        if (profile.birthday) {
          rows.push({ icon: INFO_ICONS.birthday, html: `Ngày sinh: <strong>${escapeHtml(formatBirthday(profile.birthday))}</strong>` });
        }
        if (profile.gender) {
          rows.push({ icon: INFO_ICONS.gender, html: `Giới tính: <strong>${escapeHtml(profile.gender)}</strong>` });
        }
        if (profile.relationship) {
          rows.push({ icon: INFO_ICONS.heart, html: `Tình trạng: <strong>${escapeHtml(profile.relationship)}</strong>` });
        }
        const displayEmail = profile.email || (isMe ? auth?.currentUser?.email || "" : "");
        if (displayEmail && profile.showEmail !== false) {
          rows.push({
            icon: INFO_ICONS.mail,
            html: `Email: <a href="mailto:${escapeHtml(displayEmail)}" style="color:var(--primary);font-weight:600;word-break:break-all;">${escapeHtml(displayEmail)}</a>`
          });
        }
        if (profile.phone) {
          rows.push({
            icon: INFO_ICONS.phone,
            html: `Điện thoại: <a href="tel:${escapeHtml(profile.phone)}" style="color:var(--primary);font-weight:600;">${escapeHtml(profile.phone)}</a>`
          });
        }
        const webHref = safeExternalUrl(profile.website);
        if (webHref) {
          const prettyUrl = webHref.replace(/^https?:\/\//i, "").replace(/\/$/, "");
          rows.push({
            icon: INFO_ICONS.globe,
            html: `<a href="${escapeHtml(webHref)}" target="_blank" rel="noopener noreferrer" style="color:var(--primary);font-weight:600;word-break:break-all;">${escapeHtml(prettyUrl)}</a>`
          });
        }
      }
      if (profile.createdAt) {
        const ms = toMillis(profile.createdAt);
        if (ms > 0) {
          const d = new Date(ms);
          rows.push({
            icon: INFO_ICONS.calendar,
            html: `Tham gia Twin từ <strong>tháng ${d.getMonth() + 1}/${d.getFullYear()}</strong>`
          });
        }
      }

      const listEl = document.getElementById("pf-info-list");
      const hiddenNotice = !canSeePrivateInfo
        ? `<p class="twin-post-meta" style="margin-bottom:8px;">Thành viên này đang ẩn thông tin cá nhân chi tiết.</p>`
        : "";
      if (!rows.length) {
        listEl.innerHTML = `${hiddenNotice}<p class="twin-post-meta">${isMe ? "Thêm ngày sinh, quê quán, email... để mọi người hiểu thêm về bạn." : "Chưa có thông tin giới thiệu chi tiết."}</p>`;
      } else {
        listEl.innerHTML =
          hiddenNotice +
          rows
            .map(
              (r) => `
          <div class="twin-info-item">
            <span class="twin-info-icon">${r.icon}</span>
            <span class="twin-info-text">${r.html}</span>
          </div>`
            )
            .join("");
      }
    }

    initTwinPage({
      requireAuth: true,
      onReady: async (me) => {
        if (!me) return;
        const guest = isGuestUser(me);
        const queryUid = new URLSearchParams(window.location.search).get("uid");

        if (guest && !queryUid) {
          const mainEl = document.querySelector("main.twin-main");
          if (mainEl) {
            mainEl.style.maxWidth = "640px";
            mainEl.innerHTML = `
              <section class="twin-card twin-guest-gate">
                <div class="twin-guest-gate-icon" aria-hidden="true">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c.8-3.6 3.5-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
                </div>
                <h2>Bạn đang ở chế độ Khách</h2>
                <p class="twin-post-meta">Đăng nhập để tạo hồ sơ cá nhân, đăng bài viết và kết nối với bạn bè trên Twin.</p>
                <a href="./login.html" class="twin-btn twin-btn-primary">Đăng nhập / Tạo tài khoản</a>
              </section>
            `;
          }
          return;
        }

        const targetUid = queryUid || me.uid;
        const isMe = !guest && targetUid === me.uid;

        let snap;
        try {
          snap = await getDoc(doc(db, "users", targetUid));
        } catch (err) {
          document.getElementById("pf-name").textContent = "Không thể tải hồ sơ";
          if (!guest || err?.code !== "permission-denied") showToast(friendlyError(err));
          return;
        }
        if (!snap.exists()) {
          document.getElementById("pf-name").textContent = "Không tìm thấy người dùng";
          return;
        }
        const profile = snap.data();

        const renderPresenceLine = (pData) => {
          const el = document.getElementById("pf-presence");
          if (!el) return;
          const pres = getUserPresence(pData);
          if (pres.hidden) {
            el.style.display = "none";
            return;
          }
          el.style.display = "inline-flex";
          el.className = `twin-presence-line ${pres.online ? "online" : ""}`;
          const dotTitle = pres.online ? "Đang trực tuyến" : (pres.agoText ? `Truy cập ${pres.agoText}` : "Ngoại tuyến");
          el.innerHTML = `<span class="twin-status-dot ${pres.online ? "online" : "offline"}" title="${escapeHtml(dotTitle)}" aria-label="${escapeHtml(dotTitle)}"></span>${pres.agoText ? `<span>${escapeHtml(pres.agoText)}</span>` : ""}`;
        };
        renderPresenceLine(profile);
        onSnapshot(doc(db, "users", targetUid), (liveSnap) => {
          if (!liveSnap.exists()) return;
          const liveData = liveSnap.data();
          profile.isOnline = liveData.isOnline;
          profile.lastActiveAt = liveData.lastActiveAt;
          profile.showActivity = liveData.showActivity;
          if (typeof liveData.cover === "string" && liveData.cover !== profile.cover) {
            profile.cover = liveData.cover;
            const c = document.getElementById("pf-cover");
            const rm = document.getElementById("pf-cover-remove-btn");
            if (liveData.cover) {
              if (c) { c.src = liveData.cover; c.style.display = "block"; }
              if (rm && isMe) rm.style.display = "inline-flex";
            } else {
              if (c) { c.removeAttribute("src"); c.style.display = "none"; }
              if (rm) rm.style.display = "none";
            }
          }
          renderPresenceLine(profile);
        }, () => {});
        setInterval(() => renderPresenceLine(profile), 30 * 1000);

        const avatarEl = document.getElementById("pf-avatar");
        avatarEl.src = profile.avatar || DEFAULT_AVATAR;
        if (profile.cover) {
          const c = document.getElementById("pf-cover");
          c.src = profile.cover;
          c.style.display = "block";
        }
        renderProfileDetails(profile, isMe, isUserAdmin(me));

        // Avatar photo lightbox viewer (inside profile page)
        const avatarLightbox = document.getElementById("pf-avatar-lightbox");
        const lightboxImg = document.getElementById("pf-lightbox-img");
        const lightboxTitle = document.getElementById("pf-lightbox-title");
        const lightboxChangeBtn = document.getElementById("pf-lightbox-change");

        const openAvatarViewer = () => {
          lightboxImg.src = profile.avatar || avatarEl.src || DEFAULT_AVATAR;
          lightboxTitle.innerHTML = `<span>${escapeHtml(profile.name || "Ảnh đại diện")}</span>${renderAdminIconHtml(profile)}`;
          lightboxChangeBtn.style.display = isMe ? "inline-flex" : "none";
          avatarLightbox.classList.add("open");
        };
        const closeAvatarViewer = () => avatarLightbox.classList.remove("open");

        document.getElementById("pf-avatar-view-trigger").onclick = openAvatarViewer;
        document.getElementById("pf-lightbox-close").onclick = closeAvatarViewer;
        lightboxChangeBtn.onclick = () => {
          closeAvatarViewer();
          document.getElementById("pf-avatar-input")?.click();
        };
        document.getElementById("pf-avatar-btn").addEventListener("click", (e) => e.stopPropagation());

        const actions = document.getElementById("pf-actions");
        let profileComposer = null;

        if (isMe) {
          profileComposer = mountPostComposer(document.getElementById("pf-composer-slot"), me, {
            isProfilePage: true,
            onAvatarClick: openAvatarViewer
          });

          document.getElementById("pf-cover-btn").style.display = "inline-flex";
          const coverRemoveBtn = document.getElementById("pf-cover-remove-btn");
          coverRemoveBtn.style.display = profile.cover ? "inline-flex" : "none";
          document.getElementById("pf-avatar-btn").style.display = "grid";

          actions.innerHTML = `
            <button type="button" id="pf-open-edit-btn" class="twin-btn twin-btn-secondary twin-btn-sm twin-profile-act-full">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span>Chỉnh sửa hồ sơ</span>
            </button>
          `;

          const editModal = document.getElementById("pf-edit-modal");
          const openEditModal = () => {
            document.getElementById("pf-in-name").value = profile.name || "";
            document.getElementById("pf-in-bio").value = profile.bio || "";
            document.getElementById("pf-in-birthday").value = profile.birthday || "";
            document.getElementById("pf-in-gender").value = profile.gender || "";
            document.getElementById("pf-in-hometown").value = profile.hometown || "";
            document.getElementById("pf-in-location").value = profile.location || "";
            document.getElementById("pf-in-work").value = profile.work || "";
            document.getElementById("pf-in-education").value = profile.education || "";
            document.getElementById("pf-in-relationship").value = profile.relationship || "";
            document.getElementById("pf-in-phone").value = profile.phone || "";
            document.getElementById("pf-in-email").value = profile.email || auth?.currentUser?.email || "";
            document.getElementById("pf-in-website").value = profile.website || "";
            document.getElementById("pf-in-show-email").checked = profile.showEmail !== false;
            editModal.classList.add("open");
          };
          const closeEditModal = () => editModal.classList.remove("open");

          document.getElementById("pf-open-edit-btn").onclick = openEditModal;
          document.getElementById("pf-edit-close").onclick = closeEditModal;
          document.getElementById("pf-edit-cancel").onclick = closeEditModal;

          document.getElementById("pf-edit-form").onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById("pf-edit-save");
            const nextData = {
              name: document.getElementById("pf-in-name").value.trim().slice(0, 60) || profile.name,
              bio: document.getElementById("pf-in-bio").value.trim().slice(0, 300),
              birthday: document.getElementById("pf-in-birthday").value.trim(),
              gender: document.getElementById("pf-in-gender").value.trim(),
              hometown: document.getElementById("pf-in-hometown").value.trim().slice(0, 100),
              location: document.getElementById("pf-in-location").value.trim().slice(0, 100),
              work: document.getElementById("pf-in-work").value.trim().slice(0, 100),
              education: document.getElementById("pf-in-education").value.trim().slice(0, 100),
              relationship: document.getElementById("pf-in-relationship").value.trim(),
              phone: document.getElementById("pf-in-phone").value.trim().slice(0, 25),
              email: document.getElementById("pf-in-email").value.trim().slice(0, 120),
              website: document.getElementById("pf-in-website").value.trim().slice(0, 180),
              showEmail: document.getElementById("pf-in-show-email").checked
            };

            saveBtn.disabled = true;
            saveBtn.textContent = "Đang lưu...";
            try {
              await updateDoc(doc(db, "users", me.uid), nextData);
              if (auth?.currentUser && nextData.name !== profile.name) {
                updateProfile(auth.currentUser, { displayName: nextData.name }).catch(() => {});
              }
              Object.assign(profile, nextData);
              renderProfileDetails(profile, true, isUserAdmin(me));
              closeEditModal();
              showToast("Đã cập nhật thông tin trang cá nhân!");
            } catch (err) {
              showToast(friendlyError(err));
            } finally {
              saveBtn.disabled = false;
              saveBtn.textContent = "Lưu thông tin";
            }
          };

          document.getElementById("pf-avatar-input").onchange = async (e) => {
            const f = e.target.files[0];
            if (!f) return;
            showToast("Đang tải ảnh đại diện...");
            try {
              const url = await uploadToCloudinary(f);
              await updateDoc(doc(db, "users", me.uid), { avatar: url });
              profile.avatar = url;
              me.avatar = url;
              document.getElementById("pf-avatar").src = url;
              profileComposer?.updateAvatar(url);
              showToast("Đã cập nhật ảnh đại diện!");
            } catch (err) {
              showToast(friendlyError(err));
            } finally {
              e.target.value = "";
            }
          };

          document.getElementById("pf-cover-input").onchange = async (e) => {
            const f = e.target.files[0];
            if (!f) return;
            showToast("Đang tải ảnh bìa...");
            try {
              const url = await uploadToCloudinary(f);
              await updateDoc(doc(db, "users", me.uid), { cover: url });
              profile.cover = url;
              const c = document.getElementById("pf-cover");
              c.src = url;
              c.style.display = "block";
              coverRemoveBtn.style.display = "inline-flex";
              showToast("Đã cập nhật ảnh bìa!");
            } catch (err) {
              showToast(friendlyError(err));
            } finally {
              e.target.value = "";
            }
          };

          coverRemoveBtn.onclick = async () => {
            if (!profile.cover) return;
            const ok = await twinConfirm({
              title: "Gỡ ảnh bìa",
              message: "Bạn có chắc muốn gỡ ảnh bìa hiện tại khỏi trang cá nhân?",
              confirmText: "Gỡ ảnh bìa"
            });
            if (!ok) return;
            coverRemoveBtn.disabled = true;
            try {
              await updateDoc(doc(db, "users", me.uid), { cover: "" });
              profile.cover = "";
              const c = document.getElementById("pf-cover");
              c.removeAttribute("src");
              c.style.display = "none";
              coverRemoveBtn.style.display = "none";
              showToast("Đã gỡ ảnh bìa.");
            } catch (err) {
              showToast(friendlyError(err));
            } finally {
              coverRemoveBtn.disabled = false;
            }
          };
        } else if (guest) {
          actions.innerHTML = `
            <a href="./login.html" class="twin-btn twin-btn-primary twin-btn-sm">Đăng nhập để kết bạn &amp; nhắn tin</a>
          `;
        } else {
          let state = (me.friends || []).includes(targetUid)
            ? "friend"
            : (me.friendRequests || []).includes(targetUid)
              ? "incoming"
              : (profile.friendRequests || []).includes(me.uid)
                ? "sent"
                : "none";

          const labels = {
            friend: ["Hủy bạn bè", "twin-btn-secondary twin-btn-unfriend"],
            incoming: ["Chấp nhận lời mời", "twin-btn-primary"],
            sent: ["Hủy lời mời", "twin-btn-secondary"],
            none: ["Thêm bạn bè", "twin-btn-primary"]
          };

          actions.innerHTML = `
            <button id="btn-add-fr" class="twin-btn"></button>
            <a href="./messages.html?uid=${encodeURIComponent(targetUid)}" class="twin-btn twin-btn-secondary">Nhắn tin</a>
          `;
          const frBtn = document.getElementById("btn-add-fr");
          const paintFr = () => {
            frBtn.textContent = labels[state][0];
            frBtn.className = `twin-btn ${labels[state][1]}`;
            frBtn.disabled = false;
          };
          paintFr();

          frBtn.onclick = async () => {
            if (state === "none" && profile.allowFriendRequests === false && !isUserAdmin(me)) {
              showToast("Người dùng này đã tắt nhận lời mời kết bạn.");
              return;
            }
            if (state === "friend") {
              const ok = await twinConfirm({
                title: "Hủy kết bạn",
                message: `Bạn có chắc muốn hủy kết bạn với ${profile.name || "người này"}?`,
                confirmText: "Hủy kết bạn"
              });
              if (!ok) return;
            }
            frBtn.disabled = true;
            try {
              if (state === "none") {
                await updateDoc(doc(db, "users", targetUid), { friendRequests: arrayUnion(me.uid) });
                state = "sent";
                showToast("Đã gửi lời mời kết bạn!");
                pushNotification(targetUid, {
                  fromUid: me.uid,
                  fromName: me.name,
                  fromAvatar: me.avatar || DEFAULT_AVATAR,
                  type: "friend",
                  text: "đã gửi lời mời kết bạn.",
                  link: "./friends.html"
                }).catch((err) => console.warn("Friend notification:", err));
              } else if (state === "sent") {
                await updateDoc(doc(db, "users", targetUid), { friendRequests: arrayRemove(me.uid) });
                state = "none";
                showToast("Đã hủy lời mời.");
              } else if (state === "incoming") {
                await updateDoc(doc(db, "users", me.uid), { friendRequests: arrayRemove(targetUid), friends: arrayUnion(targetUid) });
                await updateDoc(doc(db, "users", targetUid), { friends: arrayUnion(me.uid), friendRequests: arrayRemove(me.uid) });
                state = "friend";
                profile.friends = [...new Set([...(profile.friends || []), me.uid])];
                document.getElementById("pf-friends-count").textContent = String(profile.friends.length);
                showToast(`Bạn và ${profile.name} đã là bạn bè!`);
                pushNotification(targetUid, {
                  fromUid: me.uid,
                  fromName: me.name,
                  fromAvatar: me.avatar || DEFAULT_AVATAR,
                  type: "friend",
                  text: "đã chấp nhận lời mời kết bạn.",
                  link: `./profile.html?uid=${encodeURIComponent(me.uid)}`
                }).catch((err) => console.warn("Accept notification:", err));
              } else if (state === "friend") {
                await unfriendUser(me.uid, targetUid);
                state = "none";
                profile.friends = (profile.friends || []).filter((id) => id !== me.uid);
                me.friends = (me.friends || []).filter((id) => id !== targetUid);
                document.getElementById("pf-friends-count").textContent = String(profile.friends.length);
                showToast(`Đã hủy kết bạn với ${profile.name || "người dùng"}.`);
              }
            } catch (err) {
              showToast(friendlyError(err));
            } finally {
              paintFr();
            }
          };
        }

        let activePfTab = "posts";
        let profilePostsList = [];
        const pfPostsPanel = document.getElementById("pf-tab-posts-panel");
        const pfPhotosPanel = document.getElementById("pf-tab-photos-panel");
        const pfVideosPanel = document.getElementById("pf-tab-videos-panel");

        const switchPfTab = (tab, { scrollToLatest = false } = {}) => {
          activePfTab = tab;
          document.querySelectorAll(".twin-profile-tabs [data-pftab]").forEach((b) => {
            const active = b.dataset.pftab === tab;
            b.classList.toggle("active", active);
            b.setAttribute("aria-selected", active ? "true" : "false");
          });
          pfPostsPanel.style.display = tab === "posts" ? "block" : "none";
          pfPhotosPanel.style.display = tab === "photos" ? "block" : "none";
          pfVideosPanel.style.display = tab === "videos" ? "block" : "none";
          if (tab === "photos") {
            renderMediaGallery(pfPhotosPanel, profilePostsList, {
              type: "photo",
              title: `Album ảnh của ${profile.name || "Thành viên"}`,
              emptyText: "Chưa có ảnh nào trong album."
            });
          } else if (tab === "videos") {
            renderMediaGallery(pfVideosPanel, profilePostsList, {
              type: "video",
              title: `Album video của ${profile.name || "Thành viên"}`,
              emptyText: "Chưa có video nào được đăng."
            });
          }
          if (scrollToLatest && (tab === "photos" || tab === "videos")) {
            const targetPanel = tab === "photos" ? pfPhotosPanel : pfVideosPanel;
            requestAnimationFrame(() => {
              const latestEl = targetPanel.querySelector(".twin-album-tile, .twin-video-gallery-card") || targetPanel;
              latestEl.scrollIntoView({ behavior: "smooth", block: "start" });
              if (latestEl !== targetPanel) {
                latestEl.classList.remove("twin-latest-pulse");
                void latestEl.offsetWidth;
                latestEl.classList.add("twin-latest-pulse");
                setTimeout(() => latestEl.classList.remove("twin-latest-pulse"), 1800);
              }
            });
          }
        };

        document.querySelectorAll(".twin-profile-tabs [data-pftab]").forEach((btn) => {
          btn.onclick = () => switchPfTab(btn.dataset.pftab, { scrollToLatest: btn.dataset.pftab !== "posts" });
        });
        document.getElementById("pf-mini-album-all")?.addEventListener("click", () => switchPfTab("photos", { scrollToLatest: true }));

        const renderMiniAlbum = (posts) => {
          const card = document.getElementById("pf-mini-album-card");
          const grid = document.getElementById("pf-mini-album-grid");
          if (!card || !grid) return;
          const { photos } = extractMediaFromPosts(posts);
          if (!photos.length) {
            card.style.display = "none";
            return;
          }
          card.style.display = "block";
          grid.innerHTML = "";
          photos.slice(0, 6).forEach((item, idx) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "twin-album-tile";
            btn.innerHTML = `<img src="${escapeHtml(item.url)}" alt="Ảnh ${idx + 1}" loading="lazy" />`;
            btn.onclick = () => openMediaLightbox(photos, idx, `Album ảnh của ${profile.name || "Thành viên"}`);
            grid.appendChild(btn);
          });
        };

        const q = query(collection(db, "posts"), where("authorUid", "==", targetUid));
        onSnapshot(q, (snap) => {
          const box = document.getElementById("pf-posts");
          const items = [];
          snap.forEach((d) => {
            const p = { id: d.id, ...d.data() };
            if (canViewPost(p, me)) items.push(p);
          });
          items.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || ((b.pinned && a.pinned) ? ((b.pinnedAt || 0) - (a.pinnedAt || 0)) : 0) || (toMillis(b.createdAt) - toMillis(a.createdAt)));
          profilePostsList = items;

          const { photos, videos } = extractMediaFromPosts(items);
          document.getElementById("pf-posts-count").textContent = String(items.length);
          document.getElementById("pftab-posts-count").textContent = String(items.length);
          document.getElementById("pftab-photos-count").textContent = String(photos.length);
          document.getElementById("pftab-videos-count").textContent = String(videos.length);

          renderMiniAlbum(items);
          renderPostList(
            box,
            items,
            me,
            '<div class="twin-card" style="color:var(--text-3);text-align:center;padding:28px;">Chưa có bài viết nào.</div>'
          );
          if (activePfTab === "photos" || activePfTab === "videos") {
            switchPfTab(activePfTab);
          }
        }, (err) => {
          if (guest && err?.code === "permission-denied") return;
          showToast(friendlyError(err));
        });
      }
    });
  </script>
</body>
</html>
