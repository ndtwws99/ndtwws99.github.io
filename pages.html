<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trang — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội Liquid Glass kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M17 20h30v7.5H36V48h-8V27.5H17z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body class="">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main" style="max-width:1080px;">
    <div class="twin-page-head">
      <div>
        <h1>Trang</h1>
        <p class="twin-post-meta" style="font-size:13.5px;">Tạo Trang, theo dõi và đăng tin trực tiếp từ Trang lên Bảng tin.</p>
      </div>
      <button id="btn-open-create-page" class="twin-btn twin-btn-primary">Tạo Trang mới</button>
    </div>

    <div id="pages-grid" class="twin-cards-grid"></div>

    <section id="page-feed-section" style="display:none;margin-top:24px;">
      <div class="twin-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <img id="pf-page-avatar" class="twin-avatar twin-avatar-lg" alt="" />
            <div>
              <h2 id="pf-page-name" style="font-size:20px;"></h2>
              <p id="pf-page-meta" class="twin-post-meta"></p>
            </div>
          </div>
          <button id="pf-page-close" class="twin-btn twin-btn-secondary twin-btn-sm">Đóng</button>
        </div>

        <div id="pf-page-composer" style="display:none;border-top:1px solid var(--border);padding-top:12px;">
          <textarea id="page-post-content" class="twin-textarea" placeholder="Đăng tin mới từ Trang này..."></textarea>
          <div id="page-post-preview-wrap" style="margin-top:10px;display:none;position:relative;">
            <img id="page-post-preview-img" class="twin-post-image" alt="Xem trước" />
            <button id="page-post-preview-remove" type="button" class="twin-icon-btn" style="position:absolute;top:8px;right:8px;width:30px;height:30px;">✕</button>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap;">
            <label class="twin-btn twin-btn-secondary twin-btn-sm" style="cursor:pointer;">
              <span>Thêm ảnh</span>
              <input id="page-post-file" type="file" accept="image/*" hidden />
            </label>
            <button id="btn-publish-page-post" class="twin-btn twin-btn-primary twin-btn-sm">Đăng tin Trang</button>
          </div>
        </div>
      </div>

      <div id="pf-page-posts"></div>
    </section>
  </main>

  <div class="twin-modal-backdrop" id="page-modal">
    <div class="twin-modal">
      <h2 style="margin-bottom:14px;font-size:19px;">Tạo Trang mới</h2>
      <form id="create-page-form" style="display:flex;flex-direction:column;gap:12px;">
        <input id="cp-name" class="twin-input" placeholder="Tên Trang" required />
        <input id="cp-cat" class="twin-input" placeholder="Danh mục (VD: Công nghệ, Giải trí...)" required />
        <textarea id="cp-desc" class="twin-textarea" placeholder="Mô tả Trang..."></textarea>
        <label class="twin-btn twin-btn-secondary twin-btn-sm" style="cursor:pointer;">
          <span id="cp-cover-label">Ảnh đại diện Trang (tùy chọn)</span>
          <input id="cp-cover" type="file" accept="image/*" hidden />
        </label>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
          <button type="button" id="cp-cancel" class="twin-btn twin-btn-secondary">Hủy</button>
          <button type="submit" class="twin-btn twin-btn-primary">Tạo Trang</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import { renderPostList } from "./assets/js/post-ui.js";
    import {
      db,
      collection,
      doc,
      addDoc,
      updateDoc,
      query,
      where,
      orderBy,
      onSnapshot,
      arrayUnion,
      arrayRemove,
      serverTimestamp,
      uploadToCloudinary,
      DEFAULT_AVATAR,
      escapeHtml,
      toMillis,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    let me = null;
    let activePage = null;
    let unsubPagePosts = null;
    let selectedPageFile = null;
    let initialOpened = false;

    const modal = document.getElementById("page-modal");
    document.getElementById("btn-open-create-page").onclick = () => modal.classList.add("open");
    document.getElementById("cp-cancel").onclick = () => modal.classList.remove("open");
    document.getElementById("cp-cover").onchange = (e) => {
      document.getElementById("cp-cover-label").textContent = e.target.files[0]
        ? "Đã chọn: " + e.target.files[0].name
        : "Ảnh đại diện Trang (tùy chọn)";
    };

    const fileInput = document.getElementById("page-post-file");
    const previewWrap = document.getElementById("page-post-preview-wrap");
    const previewImg = document.getElementById("page-post-preview-img");

    fileInput.onchange = () => {
      selectedPageFile = fileInput.files[0] || null;
      if (selectedPageFile) {
        previewImg.src = URL.createObjectURL(selectedPageFile);
        previewWrap.style.display = "block";
      } else {
        previewWrap.style.display = "none";
      }
    };
    document.getElementById("page-post-preview-remove").onclick = () => {
      selectedPageFile = null;
      fileInput.value = "";
      previewWrap.style.display = "none";
    };

    document.getElementById("pf-page-close").onclick = () => {
      document.getElementById("page-feed-section").style.display = "none";
      if (unsubPagePosts) unsubPagePosts();
      activePage = null;
    };

    function openPageStream(p) {
      activePage = p;
      const isOwner = p.ownerUid === me.uid;
      const sec = document.getElementById("page-feed-section");
      sec.style.display = "block";
      document.getElementById("pf-page-avatar").src = p.coverUrl || DEFAULT_AVATAR;
      document.getElementById("pf-page-name").textContent = p.name;
      document.getElementById("pf-page-meta").textContent = `${p.category} · ${(p.followers || []).length} theo dõi`;
      document.getElementById("pf-page-composer").style.display = isOwner ? "block" : "none";
      sec.scrollIntoView({ behavior: "smooth" });

      if (unsubPagePosts) unsubPagePosts();
      const list = document.getElementById("pf-page-posts");
      const q = query(collection(db, "posts"), where("pageId", "==", p.id));
      unsubPagePosts = onSnapshot(q, (snap) => {
        const items = [];
        snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
        items.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || ((b.pinned && a.pinned) ? ((b.pinnedAt || 0) - (a.pinnedAt || 0)) : 0) || (toMillis(b.createdAt) - toMillis(a.createdAt)));
        renderPostList(
          list,
          items,
          me,
          '<div class="twin-card" style="color:var(--text-3);text-align:center;">Trang chưa có tin đăng nào.</div>'
        );
      }, (err) => showToast(friendlyError(err)));
    }

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;

        const targetId = new URLSearchParams(window.location.search).get("id");

        document.getElementById("create-page-form").onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById("cp-name").value.trim();
          const category = document.getElementById("cp-cat").value.trim();
          const description = document.getElementById("cp-desc").value.trim();
          const coverFile = document.getElementById("cp-cover").files[0];
          const submitBtn = e.target.querySelector('button[type="submit"]');
          if (submitBtn.disabled) return;
          submitBtn.disabled = true;
          try {
            let coverUrl = "";
            if (coverFile) coverUrl = await uploadToCloudinary(coverFile);
            await addDoc(collection(db, "pages"), {
              name,
              category,
              description,
              coverUrl,
              ownerUid: me.uid,
              followers: [me.uid],
              createdAt: serverTimestamp()
            });
            e.target.reset();
            document.getElementById("cp-cover-label").textContent = "Ảnh đại diện Trang (tùy chọn)";
            modal.classList.remove("open");
            showToast("Đã tạo Trang mới!");
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            submitBtn.disabled = false;
          }
        };

        document.getElementById("btn-publish-page-post").onclick = async () => {
          if (!activePage) return;
          const btn = document.getElementById("btn-publish-page-post");
          const content = document.getElementById("page-post-content").value.trim();
          if (!content && !selectedPageFile) return showToast("Nhập nội dung hoặc chọn ảnh để đăng tin.");
          btn.disabled = true;
          btn.textContent = "Đang đăng...";
          try {
            let imageUrl = "";
            if (selectedPageFile) imageUrl = await uploadToCloudinary(selectedPageFile);
            await addDoc(collection(db, "posts"), {
              authorUid: me.uid,
              authorName: me.name,
              authorAvatar: me.avatar || DEFAULT_AVATAR,
              pageId: activePage.id,
              pageName: activePage.name,
              pageAvatar: activePage.coverUrl || DEFAULT_AVATAR,
              content,
              imageUrl,
              pinned: false,
              reactions: {},
              comments: [],
              createdAt: serverTimestamp()
            });
            document.getElementById("page-post-content").value = "";
            selectedPageFile = null;
            fileInput.value = "";
            previewWrap.style.display = "none";
            showToast(`Đã đăng tin từ Trang ${activePage.name}!`);
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            btn.disabled = false;
            btn.textContent = "Đăng tin Trang";
          }
        };

        onSnapshot(query(collection(db, "pages"), orderBy("createdAt", "desc")), (snap) => {
          const grid = document.getElementById("pages-grid");
          grid.innerHTML = "";
          if (snap.empty) {
            grid.innerHTML = '<div class="twin-card" style="color:var(--text-3);">Chưa có Trang nào. Hãy tạo Trang đầu tiên!</div>';
            return;
          }
          const pagesList = [];
          snap.forEach((d) => {
            const p = { id: d.id, ...d.data() };
            pagesList.push(p);
            const following = (p.followers || []).includes(me.uid);
            const isOwner = p.ownerUid === me.uid;
            const card = document.createElement("div");
            card.className = "twin-entity-card";
            card.innerHTML = `
              ${p.coverUrl ? `<img class="twin-entity-cover" src="${escapeHtml(p.coverUrl)}" alt="" />` : `<div class="twin-entity-cover"></div>`}
              <div class="twin-entity-body">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                  <div style="font-weight:700;font-size:15.5px;">${escapeHtml(p.name)}</div>
                  ${isOwner ? '<span class="twin-pill-tag">Quản trị</span>' : ""}
                </div>
                <div class="twin-post-meta">${escapeHtml(p.category)} · ${(p.followers || []).length} theo dõi</div>
                <p style="font-size:13px;color:var(--text-2);flex:1;">${escapeHtml(p.description || "")}</p>
                <div style="display:flex;gap:6px;">
                  <button class="twin-btn ${following ? "twin-btn-secondary" : "twin-btn-primary"} twin-btn-sm btn-follow">
                    ${following ? "Đang theo dõi" : "Theo dõi"}
                  </button>
                  <button class="twin-btn twin-btn-secondary twin-btn-sm btn-open-page" style="flex:1;">
                    ${isOwner ? "Đăng tin" : "Xem tin"}
                  </button>
                </div>
              </div>
            `;
            card.querySelector(".btn-follow").onclick = async () => {
              try {
                await updateDoc(doc(db, "pages", p.id), { followers: following ? arrayRemove(me.uid) : arrayUnion(me.uid) });
              } catch (err) {
                showToast(friendlyError(err));
              }
            };
            card.querySelector(".btn-open-page").onclick = () => openPageStream(p);
            grid.appendChild(card);
          });

          if (!initialOpened && targetId) {
            const found = pagesList.find((item) => item.id === targetId);
            if (found) {
              initialOpened = true;
              openPageStream(found);
            }
          }
        }, (err) => showToast(friendlyError(err)));
      }
    });
  </script>
</body>
</html>
