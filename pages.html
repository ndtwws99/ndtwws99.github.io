<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Trang — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23007aff'/%3E%3Cstop offset='100%25' stop-color='%235856d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Cpath d='M19 21h26v6H35.5v18h-7V27H19z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
  <link rel="modulepreload" href="./assets/js/firebase-service.js" />
  <link rel="modulepreload" href="./assets/js/layout.js" />
  <link rel="modulepreload" href="./assets/js/post-ui.js" />
</head>
<body class="">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main" style="max-width:1080px;">
    <div class="twin-page-head">
      <div>
        <h1>Trang</h1>
        <p class="twin-post-meta" style="font-size:13.5px;">Tạo Trang, theo dõi và đăng tin trực tiếp từ Trang lên Bảng tin.</p>
      </div>
      <button id="btn-open-create-page" class="twin-btn twin-btn-primary">Tạo Trang mới</button>
    </div>

    <div id="pages-grid" class="twin-cards-grid"></div>

    <section id="page-feed-section" style="display:none;margin-top:24px;">
      <div class="twin-card" style="padding:0;overflow:hidden;">
        <div class="twin-entity-hero-cover" id="pf-page-cover-wrap">
          <img id="pf-page-cover" alt="Ảnh bìa Trang" style="display:none;" />
          <div class="twin-entity-hero-actions" id="pf-page-cover-controls" style="display:none;">
            <label class="twin-cover-glass-btn" style="cursor:pointer;">
              <span id="pf-page-cover-btn-text">Thêm / Đổi ảnh bìa</span>
              <input id="pf-page-cover-input" type="file" accept="image/*" hidden />
            </label>
            <button type="button" id="pf-page-cover-remove" class="twin-cover-glass-btn" style="display:none;">Gỡ bìa</button>
          </div>
        </div>
        <div style="padding:16px 18px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:12px;">
              <img id="pf-page-avatar" class="twin-avatar twin-avatar-lg" alt="" />
              <div>
                <h2 id="pf-page-name" style="font-size:20px;"></h2>
                <p id="pf-page-meta" class="twin-post-meta"></p>
              </div>
            </div>
            <button id="pf-page-close" class="twin-btn twin-btn-secondary twin-btn-sm">Đóng</button>
          </div>

          <div id="pf-page-composer" style="display:none;border-top:1px solid var(--border);padding-top:12px;">
            <div class="twin-composer-bar" style="justify-content:flex-end;">
              <button type="button" id="pg-prev-btn" class="twin-btn twin-btn-secondary twin-btn-sm" style="display:none;">Xem trước HTML</button>
            </div>
            <textarea id="page-post-content" class="twin-textarea" placeholder="Đăng tin mới từ Trang này... (Hỗ trợ văn bản &amp; mã HTML)"></textarea>
            <div id="pg-html-preview" class="twin-html-preview" style="display:none;">
              <div class="twin-html-preview-label">Xem trước tin Trang (HTML)</div>
              <div id="pg-html-preview-body" class="twin-post-body twin-post-html" style="margin-bottom:0;"></div>
            </div>
            <div id="page-post-preview-wrap" style="margin-top:10px;display:none;position:relative;">
              <img id="page-post-preview-img" class="twin-post-image" alt="Xem trước" />
              <button id="page-post-preview-remove" type="button" class="twin-icon-btn" style="position:absolute;top:8px;right:8px;width:30px;height:30px;">✕</button>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap;">
              <label class="twin-btn twin-btn-secondary twin-btn-sm" style="cursor:pointer;">
                <span>Thêm ảnh</span>
                <input id="page-post-file" type="file" accept="image/*" hidden />
              </label>
              <button id="btn-publish-page-post" class="twin-btn twin-btn-primary twin-btn-sm">Đăng tin Trang</button>
            </div>
          </div>
        </div>
      </div>

      <div id="pf-page-posts"></div>
    </section>
  </main>

  <div class="twin-modal-backdrop" id="page-modal">
    <div class="twin-modal">
      <h2 style="margin-bottom:14px;font-size:19px;">Tạo Trang mới</h2>
      <form id="create-page-form" style="display:flex;flex-direction:column;gap:12px;">
        <input id="cp-name" class="twin-input" placeholder="Tên Trang" required />
        <input id="cp-cat" class="twin-input" placeholder="Danh mục (VD: Công nghệ, Giải trí...)" required />
        <textarea id="cp-desc" class="twin-textarea" placeholder="Mô tả Trang..."></textarea>
        <label class="twin-btn twin-btn-secondary twin-btn-sm" style="cursor:pointer;">
          <span id="cp-cover-label">Ảnh đại diện Trang (tùy chọn)</span>
          <input id="cp-cover" type="file" accept="image/*" hidden />
        </label>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
          <button type="button" id="cp-cancel" class="twin-btn twin-btn-secondary">Hủy</button>
          <button type="submit" class="twin-btn twin-btn-primary">Tạo Trang</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initTwinPage, getSiteSettings } from "./assets/js/layout.js";
    import { renderPostList } from "./assets/js/post-ui.js";
    import {
      db,
      collection,
      doc,
      addDoc,
      updateDoc,
      query,
      where,
      orderBy,
      onSnapshot,
      arrayUnion,
      arrayRemove,
      serverTimestamp,
      uploadToCloudinary,
      sanitizeHtml,
      containsHtmlMarkup,
      isUserAdmin,
      isGuestUser,
      requireMemberAction,
      twinConfirm,
      DEFAULT_AVATAR,
      escapeHtml,
      toMillis,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    let me = null;
    let activePage = null;
    let unsubPagePosts = null;
    let selectedPageFile = null;
    let initialOpened = false;

    const modal = document.getElementById("page-modal");
    document.getElementById("btn-open-create-page").onclick = () => {
      if (!requireMemberAction(me, "tạo Trang mới")) return;
      modal.classList.add("open");
    };
    document.getElementById("cp-cancel").onclick = () => modal.classList.remove("open");
    document.getElementById("cp-cover").onchange = (e) => {
      document.getElementById("cp-cover-label").textContent = e.target.files[0]
        ? "Đã chọn: " + e.target.files[0].name
        : "Ảnh bìa / đại diện Trang (tùy chọn)";
    };

    const pgContentEl = document.getElementById("page-post-content");
    const pgPrevBtn = document.getElementById("pg-prev-btn");
    const pgPrevBox = document.getElementById("pg-html-preview");
    const pgPrevBody = document.getElementById("pg-html-preview-body");
    const canUseHtml = () => getSiteSettings().allowHtmlPosts || isUserAdmin(me);
    const syncPgHtmlPreview = () => {
      const detected = canUseHtml() && containsHtmlMarkup(pgContentEl.value);
      pgPrevBtn.style.display = detected ? "inline-flex" : "none";
      if (!detected) {
        pgPrevBox.style.display = "none";
      } else if (pgPrevBox.style.display !== "none") {
        pgPrevBody.innerHTML = sanitizeHtml(pgContentEl.value);
      }
    };
    pgPrevBtn.onclick = () => {
      const show = pgPrevBox.style.display === "none";
      pgPrevBox.style.display = show ? "block" : "none";
      if (show) pgPrevBody.innerHTML = sanitizeHtml(pgContentEl.value);
    };
    pgContentEl.addEventListener("input", syncPgHtmlPreview);

    const fileInput = document.getElementById("page-post-file");
    const previewWrap = document.getElementById("page-post-preview-wrap");
    const previewImg = document.getElementById("page-post-preview-img");

    fileInput.onchange = () => {
      selectedPageFile = fileInput.files[0] || null;
      if (selectedPageFile) {
        previewImg.src = URL.createObjectURL(selectedPageFile);
        previewWrap.style.display = "block";
      } else {
        previewWrap.style.display = "none";
      }
    };
    document.getElementById("page-post-preview-remove").onclick = () => {
      selectedPageFile = null;
      fileInput.value = "";
      previewWrap.style.display = "none";
    };

    document.getElementById("pf-page-close").onclick = () => {
      document.getElementById("page-feed-section").style.display = "none";
      if (unsubPagePosts) unsubPagePosts();
      activePage = null;
    };

    function canManagePage(p) {
      return Boolean(me && !isGuestUser(me) && p && (p.ownerUid === me.uid || isUserAdmin(me)));
    }

    function renderActivePageHeader(p) {
      const canManage = canManagePage(p);
      const coverEl = document.getElementById("pf-page-cover");
      const coverControls = document.getElementById("pf-page-cover-controls");
      const coverRemove = document.getElementById("pf-page-cover-remove");
      const coverBtnText = document.getElementById("pf-page-cover-btn-text");
      if (p.coverUrl) {
        coverEl.src = p.coverUrl;
        coverEl.style.display = "block";
        coverBtnText.textContent = "Đổi ảnh bìa";
        coverRemove.style.display = canManage ? "inline-flex" : "none";
      } else {
        coverEl.removeAttribute("src");
        coverEl.style.display = "none";
        coverBtnText.textContent = "Thêm ảnh bìa";
        coverRemove.style.display = "none";
      }
      coverControls.style.display = canManage ? "flex" : "none";

      document.getElementById("pf-page-avatar").src = p.coverUrl || DEFAULT_AVATAR;
      document.getElementById("pf-page-name").textContent = p.name;
      document.getElementById("pf-page-meta").textContent = `${p.category} · ${(p.followers || []).length} theo dõi`;
      document.getElementById("pf-page-composer").style.display = !isGuestUser(me) && p.ownerUid === me.uid ? "block" : "none";
    }

    document.getElementById("pf-page-cover-input").onchange = async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file || !activePage || !canManagePage(activePage)) return;
      showToast("Đang tải ảnh bìa Trang...");
      try {
        const coverUrl = await uploadToCloudinary(file);
        await updateDoc(doc(db, "pages", activePage.id), { coverUrl });
        activePage.coverUrl = coverUrl;
        renderActivePageHeader(activePage);
        showToast("Đã cập nhật ảnh bìa Trang!");
      } catch (err) {
        showToast(friendlyError(err));
      }
    };

    document.getElementById("pf-page-cover-remove").onclick = async () => {
      if (!activePage || !canManagePage(activePage)) return;
      const ok = await twinConfirm({
        title: "Gỡ ảnh bìa Trang",
        message: "Bạn có chắc muốn gỡ ảnh bìa Trang này?",
        confirmText: "Gỡ ảnh bìa"
      });
      if (!ok) return;
      try {
        await updateDoc(doc(db, "pages", activePage.id), { coverUrl: "" });
        activePage.coverUrl = "";
        renderActivePageHeader(activePage);
        showToast("Đã gỡ ảnh bìa Trang.");
      } catch (err) {
        showToast(friendlyError(err));
      }
    };

    function openPageStream(p) {
      activePage = p;
      const guest = isGuestUser(me);
      const sec = document.getElementById("page-feed-section");
      sec.style.display = "block";
      renderActivePageHeader(p);
      sec.scrollIntoView({ behavior: "smooth" });

      if (unsubPagePosts) unsubPagePosts();
      const list = document.getElementById("pf-page-posts");
      const q = query(collection(db, "posts"), where("pageId", "==", p.id));
      unsubPagePosts = onSnapshot(q, (snap) => {
        const items = [];
        snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
        items.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || ((b.pinned && a.pinned) ? ((b.pinnedAt || 0) - (a.pinnedAt || 0)) : 0) || (toMillis(b.createdAt) - toMillis(a.createdAt)));
        renderPostList(
          list,
          items,
          me,
          '<div class="twin-card" style="color:var(--text-3);text-align:center;">Trang chưa có tin đăng nào.</div>'
        );
      }, (err) => {
        if (guest && err?.code === "permission-denied") {
          list.innerHTML = '<div class="twin-card" style="color:var(--text-3);text-align:center;">Đăng nhập để xem bài viết của Trang này.</div>';
          return;
        }
        showToast(friendlyError(err));
      });
    }

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;
        const guest = isGuestUser(me);
        if (guest) {
          document.getElementById("btn-open-create-page").style.display = "none";
        }

        const targetId = new URLSearchParams(window.location.search).get("id");

        document.getElementById("create-page-form").onsubmit = async (e) => {
          e.preventDefault();
          if (!requireMemberAction(me, "tạo Trang mới")) return;
          const name = document.getElementById("cp-name").value.trim();
          const category = document.getElementById("cp-cat").value.trim();
          const description = document.getElementById("cp-desc").value.trim();
          const coverFile = document.getElementById("cp-cover").files[0];
          const submitBtn = e.target.querySelector('button[type="submit"]');
          if (submitBtn.disabled) return;
          submitBtn.disabled = true;
          try {
            let coverUrl = "";
            if (coverFile) coverUrl = await uploadToCloudinary(coverFile);
            await addDoc(collection(db, "pages"), {
              name,
              category,
              description,
              coverUrl,
              ownerUid: me.uid,
              followers: [me.uid],
              createdAt: serverTimestamp()
            });
            e.target.reset();
            document.getElementById("cp-cover-label").textContent = "Ảnh đại diện Trang (tùy chọn)";
            modal.classList.remove("open");
            showToast("Đã tạo Trang mới!");
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            submitBtn.disabled = false;
          }
        };

        document.getElementById("btn-publish-page-post").onclick = async () => {
          if (!activePage) return;
          const btn = document.getElementById("btn-publish-page-post");
          const content = document.getElementById("page-post-content").value.trim();
          if (!content && !selectedPageFile) return showToast("Nhập nội dung hoặc chọn ảnh để đăng tin.");
          btn.disabled = true;
          btn.textContent = "Đang đăng...";
          try {
            let imageUrl = "";
            if (selectedPageFile) imageUrl = await uploadToCloudinary(selectedPageFile);
            const isHtml = canUseHtml() && containsHtmlMarkup(content);
            await addDoc(collection(db, "posts"), {
              authorUid: me.uid,
              authorName: me.name,
              authorAvatar: me.avatar || DEFAULT_AVATAR,
              pageId: activePage.id,
              pageName: activePage.name,
              pageAvatar: activePage.coverUrl || DEFAULT_AVATAR,
              content,
              isHtml,
              imageUrl,
              pinned: false,
              reactions: {},
              comments: [],
              createdAt: serverTimestamp()
            });
            pgContentEl.value = "";
            syncPgHtmlPreview();
            pgPrevBox.style.display = "none";
            selectedPageFile = null;
            fileInput.value = "";
            previewWrap.style.display = "none";
            showToast(`Đã đăng tin từ Trang ${activePage.name}!`);
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            btn.disabled = false;
            btn.textContent = "Đăng tin Trang";
          }
        };

        onSnapshot(query(collection(db, "pages"), orderBy("createdAt", "desc")), (snap) => {
          const grid = document.getElementById("pages-grid");
          grid.innerHTML = "";
          if (snap.empty) {
            grid.innerHTML = '<div class="twin-card" style="color:var(--text-3);">Chưa có Trang nào. Hãy tạo Trang đầu tiên!</div>';
            return;
          }
          const pagesList = [];
          snap.forEach((d) => {
            const p = { id: d.id, ...d.data() };
            pagesList.push(p);
            const following = !guest && (p.followers || []).includes(me.uid);
            const isOwner = !guest && p.ownerUid === me.uid;
            const card = document.createElement("div");
            card.className = "twin-entity-card";
            card.innerHTML = `
              ${p.coverUrl ? `<img class="twin-entity-cover" src="${escapeHtml(p.coverUrl)}" alt="" />` : `<div class="twin-entity-cover"></div>`}
              <div class="twin-entity-body">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                  <div style="font-weight:700;font-size:15.5px;">${escapeHtml(p.name)}</div>
                  ${isOwner ? '<span class="twin-pill-tag">Quản trị</span>' : ""}
                </div>
                <div class="twin-post-meta">${escapeHtml(p.category)} · ${(p.followers || []).length} theo dõi</div>
                <p style="font-size:13px;color:var(--text-2);flex:1;">${escapeHtml(p.description || "")}</p>
                <div style="display:flex;gap:6px;">
                  ${guest ? "" : `<button class="twin-btn ${following ? "twin-btn-secondary" : "twin-btn-primary"} twin-btn-sm btn-follow">${following ? "Đang theo dõi" : "Theo dõi"}</button>`}
                  <button class="twin-btn twin-btn-secondary twin-btn-sm btn-open-page" style="flex:1;">
                    ${isOwner ? "Đăng tin" : "Xem tin"}
                  </button>
                </div>
              </div>
            `;
            card.querySelector(".btn-follow")?.addEventListener("click", async () => {
              if (!requireMemberAction(me, "theo dõi Trang")) return;
              try {
                await updateDoc(doc(db, "pages", p.id), { followers: following ? arrayRemove(me.uid) : arrayUnion(me.uid) });
              } catch (err) {
                showToast(friendlyError(err));
              }
            });
            card.querySelector(".btn-open-page").onclick = () => openPageStream(p);
            grid.appendChild(card);
          });

          if (activePage) {
            const refreshed = pagesList.find((item) => item.id === activePage.id);
            if (refreshed) {
              activePage = refreshed;
              renderActivePageHeader(refreshed);
            }
          }

          if (!initialOpened && targetId) {
            const found = pagesList.find((item) => item.id === targetId);
            if (found) {
              initialOpened = true;
              openPageStream(found);
            }
          }
        }, (err) => {
          if (guest && err?.code === "permission-denied") {
            document.getElementById("pages-grid").innerHTML = '<div class="twin-card" style="color:var(--text-3);">Đăng nhập để xem danh sách Trang.</div>';
            return;
          }
          showToast(friendlyError(err));
        });
      }
    });
  </script>
</body>
</html>
