<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đã lưu | Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M16 20h32v8H36v22h-8V28H16z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body>
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main" style="max-width:740px;">
    <h1 style="margin-bottom:16px;">Bài viết đã lưu</h1>
    <div id="saved-posts-list"></div>
  </main>

  <div id="twin-chat-dock" class="twin-chat-dock"></div>
  <div id="twin-toast-container" class="twin-toast-container"></div>
  <footer id="twin-footer" class="twin-footer"></footer>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import { renderPostCard } from "./assets/js/post-ui.js";
    import { db, doc, collection, onSnapshot } from "./assets/js/firebase-service.js";

    initTwinPage({
      requireAuth: true,
      onReady: (me) => {
        if (!me) return;
        let savedIds = me.savedPosts || [];
        let postsMap = [];

        const draw = () => {
          const box = document.getElementById("saved-posts-list");
          box.innerHTML = "";
          const list = postsMap.filter((p) => savedIds.includes(p.id));
          if (!list.length) {
            box.innerHTML = '<div class="twin-card" style="color:var(--twin-text-muted)">Bạn chưa lưu bài viết nào trên Twin.</div>';
            return;
          }
          list.forEach((p) => box.appendChild(renderPostCard(p, { ...me, savedPosts: savedIds })));
        };

        onSnapshot(doc(db, "users", me.uid), (snap) => {
          if (snap.exists()) {
            savedIds = snap.data().savedPosts || [];
            draw();
          }
        });
        onSnapshot(collection(db, "posts"), (snap) => {
          postsMap = [];
          snap.forEach((d) => postsMap.push({ id: d.id, ...d.data() }));
          draw();
        });
      }
    });
  </script>
</body>
</html>
