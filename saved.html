<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Đã lưu — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23007aff'/%3E%3Cstop offset='100%25' stop-color='%235856d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Cpath d='M19 21h26v6H35.5v18h-7V27H19z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
  <link rel="modulepreload" href="./assets/js/firebase-service.js" />
  <link rel="modulepreload" href="./assets/js/layout.js" />
  <link rel="modulepreload" href="./assets/js/post-ui.js" />
</head>
<body class="">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main" style="max-width:680px;">
    <div class="twin-page-head"><h1>Bài viết đã lưu</h1></div>
    <div id="saved-posts-list"></div>
  </main>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import { renderPostList } from "./assets/js/post-ui.js";
    import { db, doc, collection, onSnapshot, showToast, friendlyError, toMillis } from "./assets/js/firebase-service.js";

    initTwinPage({
      requireAuth: true,
      onReady: (me) => {
        if (!me) return;
        let savedIds = me.savedPosts || [];
        let postsMap = [];
        let userLoaded = false;
        let postsLoaded = false;

        const draw = () => {
          if (!userLoaded || !postsLoaded) return; // chờ cả 2 nguồn dữ liệu, tránh nháy "chưa lưu"
          const box = document.getElementById("saved-posts-list");
          // giữ đúng thứ tự mới lưu gần nhất lên đầu
          const order = new Map(savedIds.map((id, i) => [id, i]));
          const list = postsMap
            .filter((p) => order.has(p.id))
            .sort((a, b) => order.get(b.id) - order.get(a.id));
          renderPostList(
            box,
            list,
            { ...me, savedPosts: savedIds },
            '<div class="twin-card" style="color:var(--text-3);text-align:center;padding:32px;">Bạn chưa lưu bài viết nào.</div>'
          );
        };

        onSnapshot(doc(db, "users", me.uid), (snap) => {
          if (snap.exists()) savedIds = snap.data().savedPosts || [];
          userLoaded = true;
          draw();
        }, (err) => showToast(friendlyError(err)));
        onSnapshot(collection(db, "posts"), (snap) => {
          postsMap = [];
          snap.forEach((d) => postsMap.push({ id: d.id, ...d.data() }));
          postsLoaded = true;
          draw();
        }, (err) => showToast(friendlyError(err)));
      }
    });
  </script>
</body>
</html>
