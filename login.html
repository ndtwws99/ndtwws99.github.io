<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập | Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm và trang." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M16 20h32v8H36v22h-8V28H16z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body>
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-auth-wrap">
    <div class="twin-auth-brand">
      <h1>Twin</h1>
      <p>Twin giúp bạn kết nối, chia sẻ khoảnh khắc, tham gia Nhóm và theo dõi các Trang yêu thích theo thời gian thực.</p>
    </div>

    <div class="twin-card" style="padding:24px;">
      <div style="display:flex;gap:8px;margin-bottom:18px;">
        <button id="tab-login" class="twin-btn twin-btn-primary" style="flex:1;">Đăng nhập</button>
        <button id="tab-register" class="twin-btn twin-btn-secondary" style="flex:1;">Tạo tài khoản</button>
      </div>

      <form id="login-form" style="display:flex;flex-direction:column;gap:12px;">
        <input id="login-email" class="twin-input" type="email" placeholder="Email của bạn" required />
        <input id="login-pass" class="twin-input" type="password" placeholder="Mật khẩu" required />
        <button class="twin-btn twin-btn-primary" type="submit" style="padding:12px;">Đăng nhập vào Twin</button>
      </form>

      <form id="register-form" style="display:none;flex-direction:column;gap:12px;">
        <input id="reg-name" class="twin-input" type="text" placeholder="Họ và tên hiển thị" required />
        <input id="reg-email" class="twin-input" type="email" placeholder="Email" required />
        <input id="reg-pass" class="twin-input" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" minlength="6" required />
        <button class="twin-btn twin-btn-primary" type="submit" style="padding:12px;background:#16a34a;">Đăng ký tài khoản Twin</button>
      </form>
    </div>
  </main>

  <div id="twin-chat-dock" class="twin-chat-dock"></div>
  <div id="twin-toast-container" class="twin-toast-container"></div>
  <footer id="twin-footer" class="twin-footer"></footer>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import {
      auth,
      isFirebaseConfigured,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      ensureUserDoc,
      showToast
    } from "./assets/js/firebase-service.js";

    const tabLogin = document.getElementById("tab-login");
    const tabReg = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const regForm = document.getElementById("register-form");

    tabLogin.onclick = () => {
      loginForm.style.display = "flex";
      regForm.style.display = "none";
      tabLogin.className = "twin-btn twin-btn-primary";
      tabReg.className = "twin-btn twin-btn-secondary";
    };
    tabReg.onclick = () => {
      loginForm.style.display = "none";
      regForm.style.display = "flex";
      tabReg.className = "twin-btn twin-btn-primary";
      tabLogin.className = "twin-btn twin-btn-secondary";
    };

    initTwinPage({
      requireAuth: false,
      onReady: (user) => {
        if (user) window.location.href = "./index.html";
      }
    });

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      if (!isFirebaseConfigured()) return showToast("Vui lòng điền firebaseConfig trong assets/js/config.js trước.");
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("login-email").value.trim(),
          document.getElementById("login-pass").value
        );
        window.location.href = "./index.html";
      } catch (err) {
        showToast("Đăng nhập thất bại: " + err.message);
      }
    };

    regForm.onsubmit = async (e) => {
      e.preventDefault();
      if (!isFirebaseConfigured()) return showToast("Vui lòng điền firebaseConfig trong assets/js/config.js trước.");
      try {
        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const pass = document.getElementById("reg-pass").value;
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        await ensureUserDoc(cred.user, { name });
        window.location.href = "./index.html";
      } catch (err) {
        showToast("Đăng ký thất bại: " + err.message);
      }
    };
  </script>
</body>
</html>
