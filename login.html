<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#edf2f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080b13" media="(prefers-color-scheme: dark)" />
  <title>Đăng nhập — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231877f2'/%3E%3Cstop offset='100%25' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M17 20h30v7.5H36V48h-8V27.5H17z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body class="page-auth">
  <main class="twin-auth-wrap">
    <div class="twin-auth-brand">
      <div class="twin-logo" style="font-size:32px;gap:12px;">
        <span class="twin-logo-circle lg">T</span>
        <span>Twin</span>
      </div>
      <h1>Kết nối thế giới của bạn.</h1>
      <p>Chia sẻ khoảnh khắc, trò chuyện thời gian thực, tham gia cộng đồng và theo dõi mọi điều bạn quan tâm.</p>
    </div>

    <div class="twin-auth-card">
      <div class="twin-auth-tabs">
        <button id="tab-login" class="twin-auth-tab active" type="button">Đăng nhập</button>
        <button id="tab-register" class="twin-auth-tab" type="button">Tạo tài khoản</button>
      </div>

      <form id="login-form" style="display:flex;flex-direction:column;gap:12px;">
        <input id="login-email" class="twin-input" type="email" autocomplete="email" placeholder="Email của bạn" required />
        <input id="login-pass" class="twin-input" type="password" autocomplete="current-password" placeholder="Mật khẩu" required />
        <div style="display:flex;justify-content:flex-end;margin-top:-4px;">
          <button id="btn-forgot-pass" type="button" class="twin-link-btn">Quên mật khẩu?</button>
        </div>
        <button class="twin-btn twin-btn-primary" type="submit" style="padding:11px;margin-top:2px;">Đăng nhập</button>
      </form>

      <form id="register-form" style="display:none;flex-direction:column;gap:12px;">
        <input id="reg-name" class="twin-input" type="text" placeholder="Họ và tên hiển thị" required />
        <input id="reg-email" class="twin-input" type="email" placeholder="Email" required />
        <input id="reg-pass" class="twin-input" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" minlength="6" required />
        <button class="twin-btn twin-btn-primary" type="submit" style="padding:11px;margin-top:4px;background:var(--success);">Tạo tài khoản mới</button>
      </form>

      <div class="twin-divider">hoặc</div>

      <button id="btn-google-login" type="button" class="twin-btn twin-btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        <span>Tiếp tục với Google</span>
      </button>
    </div>
  </main>

  <div class="twin-modal-backdrop" id="forgot-pass-modal">
    <div class="twin-modal" style="max-width:420px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h2 style="font-size:19px;font-weight:800;">Đặt lại mật khẩu</h2>
        <button type="button" id="fp-close-btn" class="twin-icon-btn" style="width:32px;height:32px;">✕</button>
      </div>
      <p class="twin-post-meta" style="font-size:13.5px;margin-bottom:14px;">
        Nhập email đã đăng ký tài khoản Twin. Hệ thống sẽ gửi liên kết đặt lại mật khẩu vào hộp thư của bạn.
      </p>
      <form id="forgot-pass-form" style="display:flex;flex-direction:column;gap:12px;">
        <input id="fp-email" class="twin-input" type="email" autocomplete="email" placeholder="Email của bạn" required />
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
          <button type="button" id="fp-cancel-btn" class="twin-btn twin-btn-secondary">Hủy</button>
          <button type="submit" id="fp-submit-btn" class="twin-btn twin-btn-primary">Gửi liên kết</button>
        </div>
      </form>
    </div>
  </div>

  <div class="twin-auth-foot">Twin © 2026</div>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import {
      auth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithGoogle,
      resetUserPassword,
      updateProfile,
      ensureUserDoc,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    const tabLogin = document.getElementById("tab-login");
    const tabReg = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const regForm = document.getElementById("register-form");

    tabLogin.onclick = () => {
      loginForm.style.display = "flex";
      regForm.style.display = "none";
      tabLogin.classList.add("active");
      tabReg.classList.remove("active");
    };
    tabReg.onclick = () => {
      loginForm.style.display = "none";
      regForm.style.display = "flex";
      tabReg.classList.add("active");
      tabLogin.classList.remove("active");
    };

    // `busy` ngăn trang tự chuyển hướng giữa chừng khi đang đăng ký / đăng nhập,
    // tránh việc hồ sơ bị tạo trước khi kịp lưu tên hiển thị.
    let busy = false;

    initTwinPage({
      requireAuth: false,
      chrome: false,
      ensureProfile: false,
      onReady: (user) => {
        if (user && !busy) window.location.href = "./index.html";
      }
    });

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      const submitBtn = loginForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("login-email").value.trim(),
          document.getElementById("login-pass").value
        );
        window.location.href = "./index.html";
      } catch (err) {
        showToast("Đăng nhập thất bại: " + friendlyError(err));
        busy = false;
        submitBtn.disabled = false;
      }
    };

    regForm.onsubmit = async (e) => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      const submitBtn = regForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const pass = document.getElementById("reg-pass").value;
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        try {
          await updateProfile(cred.user, { displayName: name });
          await ensureUserDoc(cred.user, { name });
        } catch (err) {
          // Tài khoản đã tạo xong; trang chủ sẽ tự tạo lại hồ sơ nếu bước này lỗi
          console.error(err);
        }
        window.location.href = "./index.html";
      } catch (err) {
        showToast("Đăng ký thất bại: " + friendlyError(err));
        busy = false;
        submitBtn.disabled = false;
      }
    };

    const fpModal = document.getElementById("forgot-pass-modal");
    const fpEmail = document.getElementById("fp-email");
    const closeFp = () => fpModal.classList.remove("open");

    document.getElementById("btn-forgot-pass").onclick = () => {
      fpEmail.value = document.getElementById("login-email").value.trim();
      fpModal.classList.add("open");
      setTimeout(() => fpEmail.focus(), 60);
    };
    document.getElementById("fp-close-btn").onclick = closeFp;
    document.getElementById("fp-cancel-btn").onclick = closeFp;
    fpModal.addEventListener("click", (e) => { if (e.target === fpModal) closeFp(); });

    document.getElementById("forgot-pass-form").onsubmit = async (e) => {
      e.preventDefault();
      const email = fpEmail.value.trim();
      if (!email) return showToast("Vui lòng nhập email.");
      const btn = document.getElementById("fp-submit-btn");
      btn.disabled = true;
      btn.textContent = "Đang gửi...";
      try {
        await resetUserPassword(email);
        closeFp();
        showToast("Đã gửi link đặt lại mật khẩu! Kiểm tra cả hộp thư Spam.", { duration: 5000 });
      } catch (err) {
        showToast("Không gửi được email: " + friendlyError(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Gửi liên kết";
      }
    };

    document.getElementById("btn-google-login").onclick = async () => {
      if (busy) return;
      busy = true;
      const btn = document.getElementById("btn-google-login");
      btn.disabled = true;
      try {
        await signInWithGoogle();
        window.location.href = "./index.html";
      } catch (err) {
        showToast("Đăng nhập Google thất bại: " + friendlyError(err));
        busy = false;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
