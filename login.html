<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Đăng nhập — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231877f2'/%3E%3Cstop offset='100%25' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M17 20h30v7.5H36V48h-8V27.5H17z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body class="page-auth">
  <main class="twin-auth-wrap">
    <div class="twin-auth-brand">
      <div class="twin-logo" style="font-size:32px;gap:12px;">
        <span class="twin-logo-circle lg">T</span>
        <span>Twin</span>
      </div>
      <h1>Kết nối thế giới của bạn.</h1>
      <p>Chia sẻ khoảnh khắc, trò chuyện thời gian thực, tham gia cộng đồng và theo dõi mọi điều bạn quan tâm.</p>
    </div>

    <div class="twin-auth-card">
      <div class="twin-auth-tabs">
        <button id="tab-login" class="twin-auth-tab active" type="button">Đăng nhập</button>
        <button id="tab-register" class="twin-auth-tab" type="button">Tạo tài khoản</button>
      </div>

      <form id="login-form" style="display:flex;flex-direction:column;gap:12px;">
        <input id="login-email" class="twin-input" type="email" placeholder="Email của bạn" required />
        <input id="login-pass" class="twin-input" type="password" placeholder="Mật khẩu" required />
        <button class="twin-btn twin-btn-primary" type="submit" style="padding:11px;margin-top:4px;">Đăng nhập</button>
      </form>

      <form id="register-form" style="display:none;flex-direction:column;gap:12px;">
        <input id="reg-name" class="twin-input" type="text" placeholder="Họ và tên hiển thị" required />
        <input id="reg-email" class="twin-input" type="email" placeholder="Email" required />
        <input id="reg-pass" class="twin-input" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" minlength="6" required />
        <button class="twin-btn twin-btn-primary" type="submit" style="padding:11px;margin-top:4px;background:var(--success);">Tạo tài khoản mới</button>
      </form>

      <div class="twin-divider">hoặc</div>

      <button id="btn-google-login" type="button" class="twin-btn twin-btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        <span>Tiếp tục với Google</span>
      </button>
    </div>
  </main>

  <div class="twin-auth-foot">Twin © 2026</div>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import {
      auth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithGoogle,
      updateProfile,
      ensureUserDoc,
      showToast
    } from "./assets/js/firebase-service.js";

    const tabLogin = document.getElementById("tab-login");
    const tabReg = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const regForm = document.getElementById("register-form");

    tabLogin.onclick = () => {
      loginForm.style.display = "flex";
      regForm.style.display = "none";
      tabLogin.classList.add("active");
      tabReg.classList.remove("active");
    };
    tabReg.onclick = () => {
      loginForm.style.display = "none";
      regForm.style.display = "flex";
      tabReg.classList.add("active");
      tabLogin.classList.remove("active");
    };

    initTwinPage({
      requireAuth: false,
      chrome: false,
      onReady: (user) => {
        if (user) window.location.href = "./index.html";
      }
    });

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("login-email").value.trim(),
          document.getElementById("login-pass").value
        );
        window.location.href = "./index.html";
      } catch (err) {
        showToast("Đăng nhập thất bại: " + err.message);
      }
    };

    regForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const pass = document.getElementById("reg-pass").value;
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        await ensureUserDoc(cred.user, { name });
        window.location.href = "./index.html";
      } catch (err) {
        showToast("Đăng ký thất bại: " + err.message);
      }
    };

    document.getElementById("btn-google-login").onclick = async () => {
      const btn = document.getElementById("btn-google-login");
      btn.disabled = true;
      try {
        await signInWithGoogle();
        window.location.href = "./index.html";
      } catch (err) {
        showToast("Đăng nhập Google thất bại: " + err.message);
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
