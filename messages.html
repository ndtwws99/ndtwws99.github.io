<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Tin nhắn — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23007aff'/%3E%3Cstop offset='100%25' stop-color='%235856d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Cpath d='M19 21h26v6H35.5v18h-7V27H19z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
  <link rel="modulepreload" href="./assets/js/firebase-service.js" />
  <link rel="modulepreload" href="./assets/js/layout.js" />
</head>
<body class="page-messages">
  <header id="twin-header" class="twin-header"></header>

  <div id="messenger-shell" class="twin-messenger-wrap">
    <aside class="twin-messenger-sidebar">
      <div class="twin-messenger-sidebar-head">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;">
          <h2 style="font-size:20px;font-weight:800;margin:0;">Tin nhắn</h2>
          <button type="button" id="msg-open-create-group" class="twin-btn twin-btn-primary twin-btn-sm" title="Tạo nhóm chat mới">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Nhóm chat</span>
          </button>
        </div>
        <input id="msg-search-user" class="twin-input" type="search" placeholder="Tìm người hoặc nhóm chat..." />
      </div>
      <div id="msg-conv-list" class="twin-messenger-list"></div>
    </aside>

    <section class="twin-messenger-main">
      <div id="msg-topbar" class="twin-messenger-topbar" style="display:none;">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <button id="msg-back-btn" class="twin-icon-btn twin-back-btn" style="width:36px;height:36px;" aria-label="Quay lại danh sách">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <a id="msg-peer-avatar-link" href="./profile.html" class="twin-avatar-link twin-presence-wrap" title="Xem trang cá nhân">
            <img id="msg-peer-avatar" class="twin-avatar" src="" alt="" />
            <span id="msg-peer-presence-badge"></span>
          </a>
          <div style="min-width:0;">
            <div id="msg-peer-name" class="twin-name-with-badge" style="font-weight:700;font-size:15px;"></div>
            <div id="msg-group-sub" class="twin-post-meta" style="display:none;font-size:12px;"></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <button type="button" id="msg-media-btn" class="twin-icon-btn twin-msg-top-act" title="Kho ảnh & video" aria-label="Kho ảnh & video">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-4.5-4.5a2 2 0 0 0-2.8 0L5 19"/></svg>
          </button>
          <button type="button" id="msg-bg-btn" class="twin-icon-btn twin-msg-top-act" title="Đổi nền khung chat" aria-label="Đổi nền khung chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".8" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".8" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".8" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".8" fill="currentColor"/><path d="M12 2a10 10 0 0 0 0 20c1.4 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.3-.3-.3-.5-.7-.5-1.2 0-1 .8-1.7 1.8-1.7H17a5 5 0 0 0 5-5c0-5-4.5-9-10-9Z"/></svg>
          </button>
          <a id="msg-peer-profile" href="./profile.html" class="twin-btn twin-btn-secondary twin-btn-sm">Trang cá nhân</a>
        </div>
      </div>

      <div id="msg-feed" class="twin-messenger-feed">
        <div class="twin-messenger-empty">
          <div style="width:62px;height:62px;border-radius:50%;background:var(--primary-soft);border:1px solid var(--border);color:var(--primary);display:grid;place-items:center;margin:0 auto 12px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-4.8A8.5 8.5 0 1 1 21 11.5Z"/></svg>
          </div>
          <h3 style="color:var(--text);">Chọn một cuộc trò chuyện</h3>
          <p style="margin-top:4px;font-size:14px;">Nhắn tin 1-1, tạo nhóm chat, đổi nền khung chat và gửi ảnh, video, tệp, liên kết.</p>
        </div>
      </div>

      <div id="msg-pending-bar" class="twin-chat-pending" style="display:none;"></div>

      <div id="msg-link-bar" class="twin-chat-link-bar" style="display:none;">
        <input id="msg-link-url" class="twin-input" type="url" placeholder="Dán đường dẫn liên kết (https://...)" />
        <input id="msg-link-title" class="twin-input" type="text" maxlength="100" placeholder="Tiêu đề liên kết (tùy chọn)" />
        <div class="twin-chat-link-bar-actions">
          <button type="button" id="msg-link-cancel" class="twin-btn twin-btn-secondary twin-btn-sm">Hủy</button>
          <button type="button" id="msg-link-apply" class="twin-btn twin-btn-primary twin-btn-sm">Đính kèm link</button>
        </div>
      </div>

      <form id="msg-send-form" class="twin-chat-form twin-chat-form-rich" style="display:none;">
        <div class="twin-chat-tools">
          <label class="twin-chat-tool-btn" title="Gửi ảnh" aria-label="Gửi ảnh">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-4.5-4.5a2 2 0 0 0-2.8 0L5 19"/></svg>
            <input id="msg-image-input" type="file" accept="image/*" hidden />
          </label>
          <label class="twin-chat-tool-btn" title="Gửi video" aria-label="Gửi video">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="14" height="13" rx="2.5"/><path d="m16.5 10 5-3v10l-5-3"/></svg>
            <input id="msg-video-input" type="file" accept="video/*" hidden />
          </label>
          <label class="twin-chat-tool-btn" title="Gửi tệp đính kèm" aria-label="Gửi tệp đính kèm">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            <input id="msg-file-input" type="file" hidden />
          </label>
          <button type="button" id="msg-link-toggle" class="twin-chat-tool-btn" title="Gửi liên kết" aria-label="Gửi liên kết">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
        </div>
        <div class="twin-chat-input-row">
          <input id="msg-text-input" class="twin-input" type="text" placeholder="Nhập tin nhắn hoặc dán liên kết..." />
          <button id="msg-send-btn" class="twin-btn twin-btn-primary" type="submit" style="padding:9px 18px;">Gửi</button>
        </div>
      </form>
    </section>
  </div>

  <!-- Modal Kho Ảnh & Video cuộc trò chuyện -->
  <div class="twin-modal-backdrop" id="chat-media-modal">
    <div class="twin-modal" style="max-width:560px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="font-size:18px;font-weight:800;">Kho ảnh &amp; video</h2>
        <button type="button" id="cmm-close" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>
      <div class="twin-seg-tabs" style="width:100%;display:grid;grid-template-columns:1fr 1fr;margin-bottom:12px;">
        <button type="button" id="cmm-tab-photos" class="twin-seg-tab active">Ảnh (<span id="cmm-photos-count">0</span>)</button>
        <button type="button" id="cmm-tab-videos" class="twin-seg-tab">Video (<span id="cmm-videos-count">0</span>)</button>
      </div>
      <div id="cmm-body" style="max-height:58dvh;overflow-y:auto;"></div>
    </div>
  </div>

  <!-- Modal Đổi Nền Khung Chat -->
  <div class="twin-modal-backdrop" id="chat-bg-modal">
    <div class="twin-modal" style="max-width:440px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="font-size:18px;font-weight:800;">Đổi nền khung chat</h2>
        <button type="button" id="cbg-close" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>
      <div id="cbg-presets" class="twin-chat-bg-grid"></div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;">
        <label class="twin-btn twin-btn-secondary twin-btn-sm" style="cursor:pointer;width:100%;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span id="cbg-upload-label">Chọn ảnh nền từ thiết bị</span>
          <input id="cbg-upload-input" type="file" accept="image/*" hidden />
        </label>
        <button type="button" id="cbg-reset" class="twin-btn twin-btn-ghost twin-btn-sm" style="width:100%;">Khôi phục nền mặc định</button>
      </div>
    </div>
  </div>

  <!-- Modal Tạo Nhóm Chat -->
  <div class="twin-modal-backdrop" id="create-chat-group-modal">
    <div class="twin-modal" style="max-width:480px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="font-size:18px;font-weight:800;">Tạo nhóm chat mới</h2>
        <button type="button" id="ccg-close" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>
      <form id="ccg-form" style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <label class="twin-field-label" for="ccg-name">Tên nhóm chat</label>
          <input id="ccg-name" class="twin-input" type="text" maxlength="60" placeholder="VD: Nhóm đi phượt, Team dự án..." required />
        </div>
        <div>
          <label class="twin-field-label" for="ccg-search">Chọn thành viên (<span id="ccg-selected-count">0</span> đã chọn)</label>
          <input id="ccg-search" class="twin-input" type="search" placeholder="Tìm thành viên để thêm..." style="margin-bottom:8px;" />
          <div id="ccg-member-list" class="twin-member-list"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
          <button type="button" id="ccg-cancel" class="twin-btn twin-btn-secondary">Hủy</button>
          <button type="submit" id="ccg-submit" class="twin-btn twin-btn-primary">Tạo nhóm chat</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initTwinPage, setActiveChatPeer, onUnreadChatCountsChange } from "./assets/js/layout.js";
    import { openMediaLightbox } from "./assets/js/post-ui.js";
    import {
      db,
      doc,
      collection,
      addDoc,
      deleteDoc,
      twinConfirm,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      uploadToCloudinary,
      uploadChatAttachmentToCloudinary,
      normalizeSafeHttpUrl,
      formatFileSize,
      formatChatMessagePreview,
      createChatMessageElement,
      pushNotification,
      isUserAdmin,
      isGuestUser,
      renderAdminIconHtml,
      getUserPresence,
      renderPresenceBadgeHtml,
      getChatId,
      DEFAULT_AVATAR,
      escapeHtml,
      formatTime,
      toMillis,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    const GROUP_AVATAR_SVG =
      "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%230095f6'/%3E%3Cstop offset='100%25' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='80' height='80' rx='40' fill='url(%23g)'/%3E%3Ccircle cx='31' cy='31' r='9' fill='%23fff'/%3E%3Ccircle cx='51' cy='33' r='7.5' fill='%23fff' opacity='.9'/%3E%3Cpath d='M16 60c1.5-11 8-15 15-15s13.5 4 15 15' fill='%23fff'/%3E%3Cpath d='M43 59c1-8 5-11 10-11 5.5 0 9.5 3 10.5 11' fill='%23fff' opacity='.88'/%3E%3C/svg%3E";

    const CHAT_BG_STORAGE_KEY = "twin_chat_bg_map_v1";
    const CHAT_BG_PRESETS = [
      { id: "default", label: "Mặc định", value: "" },
      { id: "ocean", label: "Đại dương", value: "linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)" },
      { id: "sky", label: "Mây xanh", value: "linear-gradient(135deg, #e0f2fe 0%, #dbeafe 50%, #ede9fe 100%)" },
      { id: "sunset", label: "Hoàng hôn", value: "linear-gradient(135deg, #3b1d4a 0%, #8e3b63 52%, #e07a5f 100%)" },
      { id: "forest", label: "Rừng đêm", value: "linear-gradient(135deg, #0b1f1a 0%, #134e4a 55%, #0f2922 100%)" },
      { id: "sakura", label: "Hồng phấn", value: "linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fae8ff 100%)" },
      { id: "midnight", label: "Đêm tím", value: "linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%)" },
      { id: "warm", label: "Kem ấm", value: "linear-gradient(135deg, #fefce8 0%, #ffedd5 55%, #fef3c7 100%)" }
    ];

    let me = null;
    let allUsers = [];
    let usersById = new Map();
    let chatGroups = [];
    let activeConv = null; // { type: 'dm', peer, chatId } | { type: 'group', group, chatId }
    let currentChatMessages = [];
    let unsubChat = null;
    let unreadByPeer = new Map();
    const lastMessages = new Map();
    const lastMsgUnsubs = new Map();

    const shell = document.getElementById("messenger-shell");
    const convList = document.getElementById("msg-conv-list");
    const feedEl = document.getElementById("msg-feed");
    const topbar = document.getElementById("msg-topbar");
    const sendForm = document.getElementById("msg-send-form");
    const textInput = document.getElementById("msg-text-input");
    const sendBtn = document.getElementById("msg-send-btn");
    const imgInput = document.getElementById("msg-image-input");
    const vidInput = document.getElementById("msg-video-input");
    const fileInput = document.getElementById("msg-file-input");
    const pendingBar = document.getElementById("msg-pending-bar");
    const linkBar = document.getElementById("msg-link-bar");
    const linkUrlInput = document.getElementById("msg-link-url");
    const linkTitleInput = document.getElementById("msg-link-title");

    let pendingFile = null;
    let pendingLink = null;
    let sending = false;

    // ---- Chat Background Persistence ----
    function loadChatBgMap() {
      try {
        return JSON.parse(localStorage.getItem(CHAT_BG_STORAGE_KEY) || "{}") || {};
      } catch {
        return {};
      }
    }
    function saveChatBg(chatId, bgObj) {
      const map = loadChatBgMap();
      if (!bgObj || !bgObj.value) {
        delete map[chatId];
      } else {
        map[chatId] = bgObj;
      }
      try {
        localStorage.setItem(CHAT_BG_STORAGE_KEY, JSON.stringify(map));
      } catch {}
    }
    function applyChatBackground(chatId) {
      const map = loadChatBgMap();
      const entry = chatId ? map[chatId] : null;
      if (!entry || !entry.value) {
        feedEl.style.background = "";
        feedEl.style.backgroundImage = "";
        feedEl.classList.remove("has-custom-bg");
        return;
      }
      feedEl.classList.add("has-custom-bg");
      if (entry.type === "image") {
        feedEl.style.background = `url("${entry.value}") center/cover no-repeat`;
      } else {
        feedEl.style.background = entry.value;
      }
    }

    const bgModal = document.getElementById("chat-bg-modal");
    const bgPresetsWrap = document.getElementById("cbg-presets");
    function renderBgPresets() {
      if (!activeConv) return;
      const current = loadChatBgMap()[activeConv.chatId];
      bgPresetsWrap.innerHTML = "";
      CHAT_BG_PRESETS.forEach((p) => {
        const btn = document.createElement("button");
        btn.type = "button";
        const isActive = (!current && p.id === "default") || (current && current.id === p.id);
        btn.className = `twin-chat-bg-swatch ${isActive ? "active" : ""}`;
        btn.innerHTML = `
          <span class="twin-chat-bg-preview" style="background:${p.value || "var(--bg)"};"></span>
          <span class="twin-chat-bg-label">${escapeHtml(p.label)}</span>
        `;
        btn.onclick = () => {
          saveChatBg(activeConv.chatId, p.value ? { id: p.id, type: "gradient", value: p.value } : null);
          applyChatBackground(activeConv.chatId);
          renderBgPresets();
          showToast(`Đã đổi nền chat: ${p.label}`);
        };
        bgPresetsWrap.appendChild(btn);
      });
    }

    // ---- Chat Media Album Modal (Ảnh & Video đã gửi) ----
    const chatMediaModal = document.getElementById("chat-media-modal");
    const cmmTabPhotos = document.getElementById("cmm-tab-photos");
    const cmmTabVideos = document.getElementById("cmm-tab-videos");
    const cmmPhotosCount = document.getElementById("cmm-photos-count");
    const cmmVideosCount = document.getElementById("cmm-videos-count");
    const cmmBody = document.getElementById("cmm-body");
    let cmmActiveTab = "photos";

    function renderChatMediaModal() {
      const photos = currentChatMessages
        .filter((m) => m.imageUrl)
        .map((m) => ({ type: "image", url: m.imageUrl, caption: m.text || m.fileName || "" }))
        .reverse();
      const videos = currentChatMessages
        .filter((m) => m.videoUrl)
        .map((m) => ({ type: "video", url: m.videoUrl, poster: m.videoPoster || "", caption: m.text || m.fileName || "" }))
        .reverse();

      cmmPhotosCount.textContent = String(photos.length);
      cmmVideosCount.textContent = String(videos.length);
      cmmTabPhotos.classList.toggle("active", cmmActiveTab === "photos");
      cmmTabVideos.classList.toggle("active", cmmActiveTab === "videos");

      if (cmmActiveTab === "photos") {
        if (!photos.length) {
          cmmBody.innerHTML = '<div class="twin-gallery-empty">Chưa có ảnh nào được gửi trong cuộc trò chuyện này.</div>';
          return;
        }
        cmmBody.innerHTML = '<div class="twin-album-grid"></div>';
        const grid = cmmBody.querySelector(".twin-album-grid");
        photos.forEach((item, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "twin-album-tile";
          btn.innerHTML = `<img src="${escapeHtml(item.url)}" alt="Ảnh ${idx + 1}" loading="lazy" />`;
          btn.onclick = () => openMediaLightbox(photos, idx, "Ảnh trong cuộc trò chuyện");
          grid.appendChild(btn);
        });
      } else {
        if (!videos.length) {
          cmmBody.innerHTML = '<div class="twin-gallery-empty">Chưa có video nào được gửi trong cuộc trò chuyện này.</div>';
          return;
        }
        cmmBody.innerHTML = '<div class="twin-video-gallery-grid"></div>';
        const grid = cmmBody.querySelector(".twin-video-gallery-grid");

    function renderGroupMemberPicker(filter = "") {
      const q = filter.trim().toLowerCase();
      const candidates = allUsers.filter((u) => !q || (u.name || "").toLowerCase().includes(q));
      ccgSelectedCount.textContent = String(selectedGroupMembers.size);
      ccgMemberList.innerHTML = "";
      if (!candidates.length) {
        ccgMemberList.innerHTML = '<div class="twin-post-meta" style="padding:8px;">Không tìm thấy thành viên nào.</div>';
        return;
      }
      candidates.forEach((u) => {
        const checked = selectedGroupMembers.has(u.uid);
        const label = document.createElement("label");
        label.className = "twin-member-row";
        label.style.cursor = "pointer";
        label.innerHTML = `
          <input type="checkbox" ${checked ? "checked" : ""} style="width:17px;height:17px;accent-color:var(--primary);flex-shrink:0;" />
          <img class="twin-avatar twin-avatar-sm" src="${escapeHtml(u.avatar || DEFAULT_AVATAR)}" alt="" />
          <span class="twin-name-with-badge" style="font-weight:600;font-size:13.5px;flex:1;min-width:0;"><span>${escapeHtml(u.name)}</span>${renderAdminIconHtml(u)}</span>

          if (ev.target.checked) selectedGroupMembers.add(u.uid);
          else selectedGroupMembers.delete(u.uid);
          ccgSelectedCount.textContent = String(selectedGroupMembers.size);
        };
        ccgMemberList.appendChild(label);
      });

    onUnreadChatCountsChange((counts) => {

      if (me && !isGuestUser(me)) renderConversations(document.getElementById("msg-search-user").value);
    });

    function syncLastMessageListeners() {
      if (!me) return;
      const desiredIds = new Set();
      allUsers.forEach((u) => desiredIds.add(getChatId(me.uid, u.uid)));
      chatGroups.forEach((g) => { if (g.chatId) desiredIds.add(g.chatId); });

      for (const [cid, unsub] of lastMsgUnsubs.entries()) {
        if (!desiredIds.has(cid)) {
          unsub();
          lastMsgUnsubs.delete(cid);
          lastMessages.delete(cid);
        }
      }
      desiredIds.forEach((chatId) => {
        if (lastMsgUnsubs.has(chatId)) return;
        const q = query(collection(db, "messages", chatId, "items"), orderBy("createdAt", "desc"), limit(1));
        const unsub = onSnapshot(q, (snap) => {
          if (snap.empty) {
            lastMessages.delete(chatId);
          } else {
            const m = snap.docs[0].data();
            lastMessages.set(chatId, { ...m, timeMs: toMillis(m.createdAt) || Date.now() });
          }
          renderConversations(document.getElementById("msg-search-user").value);
        }, () => {});
        lastMsgUnsubs.set(chatId, unsub);
      });
    }

    function renderActiveTopbar() {
      if (!activeConv) return;
      const avatarLink = document.getElementById("msg-peer-avatar-link");
      const avatarImg = document.getElementById("msg-peer-avatar");
      const badgeWrap = document.getElementById("msg-peer-presence-badge");
      const nameEl = document.getElementById("msg-peer-name");
      const groupSub = document.getElementById("msg-group-sub");
      const profileBtn = document.getElementById("msg-peer-profile");

      if (activeConv.type === "group") {
        const g = activeConv.group;
        avatarImg.src = g.coverUrl || GROUP_AVATAR_SVG;
        avatarLink.removeAttribute("href");
        avatarLink.style.cursor = "default";
        badgeWrap.innerHTML = "";
        nameEl.innerHTML = `<span>${escapeHtml(g.name)}</span>`;
        groupSub.textContent = `${(g.members || []).length} thành viên`;
        groupSub.style.display = "block";
        profileBtn.style.display = "none";
      } else {
        const peer = activeConv.peer;
        avatarImg.src = peer.avatar || DEFAULT_AVATAR;
        avatarLink.href = `./profile.html?uid=${encodeURIComponent(peer.uid)}`;
        avatarLink.style.cursor = "pointer";
        badgeWrap.innerHTML = renderPresenceBadgeHtml(peer);
        nameEl.innerHTML = `<span>${escapeHtml(peer.name)}</span>${renderAdminIconHtml(peer)}`;
        groupSub.style.display = "none";
        profileBtn.href = `./profile.html?uid=${encodeURIComponent(peer.uid)}`;
        profileBtn.style.display = "inline-flex";
      }
    }

    function renderConversations(filter = "") {
      convList.innerHTML = "";
      const q = filter.trim().toLowerCase();

      const items = [];
      chatGroups.forEach((g) => {
        if (!q || (g.name || "").toLowerCase().includes(q)) {
          items.push({
            type: "group",
            group: g,
            chatId: g.chatId,
            sortTime: lastMessages.get(g.chatId)?.timeMs || toMillis(g.createdAt) || 0,
            online: false,
            lastActiveMs: 0
          });
        }
      });
      allUsers.forEach((u) => {
        if (!q || (u.name || "").toLowerCase().includes(q)) {
          const cid = getChatId(me.uid, u.uid);
          const p = getUserPresence(u);
          items.push({
            type: "dm",
            peer: u,
            chatId: cid,
            sortTime: lastMessages.get(cid)?.timeMs || 0,
            online: p.online,
            lastActiveMs: p.lastActiveMs || 0
          });
        }
      });

      items.sort((a, b) => {
        if (b.sortTime !== a.sortTime) return b.sortTime - a.sortTime;
        if (b.online !== a.online) return b.online ? 1 : -1;
        return b.lastActiveMs - a.lastActiveMs;
      });

      if (!items.length) {
        convList.innerHTML = '<p class="twin-post-meta" style="padding:14px;">Chưa có cuộc trò chuyện nào.</p>';
        return;
      }

      items.forEach((it) => {
        const last = lastMessages.get(it.chatId);
        const timeLabel = last ? formatTime(last.createdAt) : "";
        const isActive = Boolean(activeConv && activeConv.chatId === it.chatId);
        const btn = document.createElement("button");

        if (it.type === "group") {
          const g = it.group;
          const preview = last
            ? `${last.senderUid === me.uid ? "Bạn" : (last.senderName || usersById.get(last.senderUid)?.name || "Thành viên")}: ${formatChatMessagePreview(last, "")}`
            : `Nhóm chat · ${(g.members || []).length} thành viên`;
          btn.className = `twin-conv-item ${isActive ? "active" : ""}`;
          btn.innerHTML = `
            <div class="twin-conv-avatar-wrap twin-presence-wrap">
              <img class="twin-avatar twin-avatar-md" src="${escapeHtml(g.coverUrl || GROUP_AVATAR_SVG)}" alt="" />
            </div>
            <div style="min-width:0;flex:1;">
              <div class="twin-conv-top">
                <div class="twin-conv-name twin-name-with-badge"><span>${escapeHtml(g.name)}</span></div>
                ${timeLabel ? `<span class="twin-conv-time">${escapeHtml(timeLabel)}</span>` : ""}
              </div>
              <div class="twin-conv-bottom">
                <div class="twin-conv-preview">${escapeHtml(preview)}</div>
              </div>
            </div>
          `;
          btn.onclick = () => selectGroupChat(g);
        } else {
          const u = it.peer;
          const preview = last ? formatChatMessagePreview(last, me?.uid) : "Chưa có tin nhắn";
          const unread = unreadByPeer.get(u.uid) || 0;
          btn.className = `twin-conv-item ${isActive ? "active" : ""} ${unread > 0 ? "unread" : ""}`;
          btn.innerHTML = `
            <div class="twin-conv-avatar-wrap twin-presence-wrap">
              <img class="twin-avatar twin-avatar-md twin-conv-avatar-go" src="${escapeHtml(u.avatar || DEFAULT_AVATAR)}" alt="" title="Xem trang cá nhân" />
              ${renderPresenceBadgeHtml(u)}
              ${unread > 0 ? '<span class="twin-conv-dot" aria-hidden="true"></span>' : ""}
            </div>
            <div style="min-width:0;flex:1;">
              <div class="twin-conv-top">
                <div class="twin-conv-name twin-name-with-badge"><span>${escapeHtml(u.name)}</span>${renderAdminIconHtml(u)}</div>
                ${timeLabel ? `<span class="twin-conv-time">${escapeHtml(timeLabel)}</span>` : ""}
              </div>
              <div class="twin-conv-bottom">
                <div class="twin-conv-preview">${escapeHtml(preview)}</div>
                ${unread > 0 ? `<span class="twin-conv-badge">${unread > 9 ? "9+" : unread}</span>` : ""}
              </div>
            </div>
          `;
          btn.querySelector(".twin-conv-avatar-go").addEventListener("click", (e) => {
            e.stopPropagation();
            window.location.href = `./profile.html?uid=${encodeURIComponent(u.uid)}`;
          });
          btn.onclick = () => selectPeer(u);
        }
        convList.appendChild(btn);
      });
    }

    function subscribeActiveChatStream() {
      if (unsubChat) unsubChat();
      if (!activeConv) return;
      const chatId = activeConv.chatId;
      const isGroup = activeConv.type === "group";
      const q = query(collection(db, "messages", chatId, "items"), orderBy("createdAt", "asc"));
      unsubChat = onSnapshot(q, (snap) => {
        feedEl.innerHTML = "";
        currentChatMessages = [];
        if (snap.empty) {
          const title = isGroup ? activeConv.group.name : activeConv.peer.name;
          feedEl.innerHTML = `<div class="twin-messenger-empty">Gửi lời chào tới <strong>${escapeHtml(title)}</strong>!</div>`;
          return;
        }
        snap.forEach((d) => {
          const m = d.data();
          currentChatMessages.push(m);
          const isMine = m.senderUid === me.uid;
          const canDel = isMine || isUserAdmin(me);
          const el = createChatMessageElement(m, isMine, {
            canDelete: canDel,
            onDelete: async (btnEl) => {
              const ok = await twinConfirm({
                title: "Xóa tin nhắn",
                message: "Bạn có chắc muốn xóa tin nhắn này?",
                confirmText: "Xóa"
              });
              if (!ok) return;
              if (btnEl) btnEl.disabled = true;
              try {
                await deleteDoc(doc(db, "messages", chatId, "items", d.id));
                showToast("Đã xóa tin nhắn.");
              } catch (err) {
                if (btnEl) btnEl.disabled = false;
                showToast(friendlyError(err));
              }
            }
          });
          if (isGroup && !isMine) {
            const senderName = m.senderName || usersById.get(m.senderUid)?.name || "Thành viên";
            const nameTag = document.createElement("div");
            nameTag.className = "twin-msg-sender-name";
            nameTag.textContent = senderName;
            el.prepend(nameTag);
          }
          feedEl.appendChild(el);
        });
        feedEl.scrollTop = feedEl.scrollHeight;
      }, (err) => {
        feedEl.innerHTML = "";
        const box = document.createElement("div");
        box.className = "twin-messenger-empty";
        box.textContent = friendlyError(err);
        feedEl.appendChild(box);
      });
    }

    function selectPeer(peer) {
      const chatId = getChatId(me.uid, peer.uid);
      const same = activeConv && activeConv.chatId === chatId;
      activeConv = { type: "dm", peer, chatId };
      shell.classList.add("chat-open");
      document.body.classList.add("mobile-chat-active");
      setActiveChatPeer(peer.uid);
      topbar.style.display = "flex";
      sendForm.style.display = "flex";
      renderActiveTopbar();
      applyChatBackground(chatId);
      renderConversations(document.getElementById("msg-search-user").value);
      if (!same) subscribeActiveChatStream();
    }

    function selectGroupChat(group) {
      if (!group || !group.chatId) return;
      const same = activeConv && activeConv.chatId === group.chatId;
      activeConv = { type: "group", group, chatId: group.chatId };
      shell.classList.add("chat-open");
      document.body.classList.add("mobile-chat-active");
      setActiveChatPeer(null);
      topbar.style.display = "flex";
      sendForm.style.display = "flex";
      renderActiveTopbar();
      applyChatBackground(group.chatId);
      renderConversations(document.getElementById("msg-search-user").value);
      if (!same) subscribeActiveChatStream();
    }

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;

        if (isGuestUser(me)) {
          shell.className = "twin-main";
          shell.style.maxWidth = "640px";
          shell.innerHTML = `
            <section class="twin-card twin-guest-gate">
              <div class="twin-guest-gate-icon" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-4.8A8.5 8.5 0 1 1 21 11.5Z"/></svg>
              </div>
              <h2>Chế độ Khách không thể nhắn tin</h2>
              <p class="twin-post-meta">Đăng nhập tài khoản Twin để gửi tin nhắn, hình ảnh, video, tệp và liên kết trực tiếp với bạn bè.</p>
              <a href="./login.html" class="twin-btn twin-btn-primary">Đăng nhập ngay</a>
            </section>
          `;
          return;
        }

        document.getElementById("msg-search-user").addEventListener("input", (e) => renderConversations(e.target.value));
        const preselectUid = new URLSearchParams(window.location.search).get("uid");
        const preselectGroupId = new URLSearchParams(window.location.search).get("group");

        onSnapshot(collection(db, "users"), (snap) => {
          allUsers = [];
          usersById.clear();
          snap.forEach((d) => {
            const u = d.data();
            usersById.set(u.uid, u);
            if (u.uid !== me.uid) allUsers.push(u);
          });
          if (activeConv?.type === "dm") {
            const refreshed = allUsers.find((u) => u.uid === activeConv.peer.uid);
            if (refreshed) {
              activeConv.peer = refreshed;
              renderActiveTopbar();
            }
          }
          syncLastMessageListeners();
          renderConversations(document.getElementById("msg-search-user").value);
          if (preselectUid && !activeConv) {
            const found = allUsers.find((u) => u.uid === preselectUid);
            if (found) selectPeer(found);
          }
        }, (err) => showToast(friendlyError(err)));

        onSnapshot(collection(db, "groups"), (snap) => {
          chatGroups = [];
          snap.forEach((d) => {
            const g = { id: d.id, ...d.data() };
            if (g.isChatGroup && g.chatId && Array.isArray(g.members) && g.members.includes(me.uid)) {
              chatGroups.push(g);
            }
          });
          if (activeConv?.type === "group") {
            const refreshed = chatGroups.find((g) => g.id === activeConv.group.id);
            if (refreshed) {
              activeConv.group = refreshed;
              renderActiveTopbar();
            }
          }
          syncLastMessageListeners();
          renderConversations(document.getElementById("msg-search-user").value);
          if (preselectGroupId && !activeConv) {
            const found = chatGroups.find((g) => g.id === preselectGroupId);
            if (found) selectGroupChat(found);
          }
        }, () => {});

        setInterval(() => {
          if (allUsers.length) renderConversations(document.getElementById("msg-search-user").value);
          if (activeConv?.type === "dm") renderActiveTopbar();
        }, 30 * 1000);

        function canMessagePeer(peer) {
          if (!peer || !me) return false;
          if (peer.allowMessagesFrom !== "friends") return true;
          if (isUserAdmin(me)) return true;
          return (me.friends || []).includes(peer.uid);
        }

        const stageFile = (f) => {
          if (!f) return;
          pendingFile = f;
          pendingLink = null;
          linkBar.style.display = "none";
          renderPending();
          textInput.focus();
        };

        imgInput.onchange = () => stageFile(imgInput.files[0]);
        vidInput.onchange = () => stageFile(vidInput.files[0]);
        fileInput.onchange = () => stageFile(fileInput.files[0]);

        document.getElementById("msg-link-toggle").onclick = () => {
          const opening = linkBar.style.display === "none";
          linkBar.style.display = opening ? "flex" : "none";
          if (opening) {
            linkUrlInput.value = pendingLink?.url || "";
            linkTitleInput.value = pendingLink?.title || "";
            linkUrlInput.focus();
          }
        };
        document.getElementById("msg-link-cancel").onclick = () => {
          linkBar.style.display = "none";
        };
        document.getElementById("msg-link-apply").onclick = () => {
          const safeUrl = normalizeSafeHttpUrl(linkUrlInput.value);
          if (!safeUrl) return showToast("Vui lòng nhập đường dẫn hợp lệ (ví dụ: https://...).");
          pendingLink = { url: safeUrl, title: linkTitleInput.value.trim().slice(0, 100) };
          pendingFile = null;
          imgInput.value = "";
          vidInput.value = "";
          fileInput.value = "";
          linkBar.style.display = "none";
          renderPending();
          textInput.focus();
        };

        sendForm.onsubmit = async (e) => {
          e.preventDefault();
          if (!activeConv || sending) return;
          if (activeConv.type === "dm" && !canMessagePeer(activeConv.peer)) {
            showToast("Người này chỉ nhận tin nhắn từ bạn bè.");
            return;
          }
          const text = textInput.value.trim();
          if (!text && !pendingFile && !pendingLink) return;

          sending = true;
          sendBtn.disabled = true;
          const fileToSend = pendingFile;
          const linkToSend = pendingLink;
          const chatId = activeConv.chatId;

          try {
            const payload = {
              senderUid: me.uid,
              senderName: me.name || "Thành viên",
              text,
              createdAt: serverTimestamp()
            };
            let notifText = text ? `đã nhắn: "${text.slice(0, 45)}"` : "đã gửi một tin nhắn";

            if (fileToSend) {
              sendBtn.textContent = "0%";
              const uploaded = await uploadChatAttachmentToCloudinary(fileToSend, (pct) => {
                sendBtn.textContent = `${pct}%`;
              });
              if (uploaded.kind === "image") {
                payload.imageUrl = uploaded.url;
                payload.fileName = uploaded.name;
                notifText = text ? `đã gửi ảnh: "${text.slice(0, 40)}"` : "đã gửi một hình ảnh";
              } else if (uploaded.kind === "video") {
                payload.videoUrl = uploaded.url;
                payload.videoPoster = uploaded.poster || "";
                payload.fileName = uploaded.name;
                notifText = text ? `đã gửi video: "${text.slice(0, 40)}"` : "đã gửi một video";
              } else {
                payload.fileUrl = uploaded.url;
                payload.fileName = uploaded.name;
                payload.fileSize = uploaded.size;
                payload.fileMime = uploaded.mime;
                notifText = `đã gửi tệp: ${uploaded.name}`;
              }
            } else if (linkToSend) {
              payload.linkUrl = linkToSend.url;
              if (linkToSend.title) payload.linkTitle = linkToSend.title;
              notifText = `đã gửi liên kết: ${(linkToSend.title || linkToSend.url).slice(0, 45)}`;
            }

            await addDoc(collection(db, "messages", chatId, "items"), payload);
            textInput.value = "";
            clearPending();

            if (activeConv.type === "dm") {
              pushNotification(activeConv.peer.uid, {
                fromUid: me.uid,
                fromName: me.name,
                fromAvatar: me.avatar || DEFAULT_AVATAR,
                type: "message",
                text: notifText,
                link: `./messages.html?uid=${encodeURIComponent(me.uid)}`
              }).catch(() => {});
            } else {
              const g = activeConv.group;
              (g.members || []).filter((uid) => uid !== me.uid).slice(0, 15).forEach((uid) => {
                pushNotification(uid, {
                  fromUid: me.uid,
                  fromName: me.name,
                  fromAvatar: me.avatar || DEFAULT_AVATAR,
                  type: "message",
                  text: `trong nhóm "${g.name}" ${notifText}`,
                  link: `./messages.html?group=${encodeURIComponent(g.id)}`
                }).catch(() => {});
              });
            }
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            sending = false;
            sendBtn.disabled = false;
            sendBtn.textContent = "Gửi";
          }
        };
      }
    });
  </script>
</body>
</html>
