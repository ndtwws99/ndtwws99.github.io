<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#edf2f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080b13" media="(prefers-color-scheme: dark)" />
  <title>Tin nhắn — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231877f2'/%3E%3Cstop offset='100%25' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M17 20h30v7.5H36V48h-8V27.5H17z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body class="page-messages">
  <header id="twin-header" class="twin-header"></header>

  <div id="messenger-shell" class="twin-messenger-wrap">
    <aside class="twin-messenger-sidebar">
      <div class="twin-messenger-sidebar-head">
        <h2 style="font-size:20px;font-weight:800;margin-bottom:10px;">Tin nhắn</h2>
        <input id="msg-search-user" class="twin-input" type="search" placeholder="Tìm người trò chuyện..." style="border-radius:999px;" />
      </div>
      <div id="msg-conv-list" class="twin-messenger-list"></div>
    </aside>

    <section class="twin-messenger-main">
      <div id="msg-topbar" class="twin-messenger-topbar" style="display:none;">
        <div style="display:flex;align-items:center;gap:10px;">
          <button id="msg-back-btn" class="twin-btn twin-btn-secondary twin-btn-sm twin-back-btn">←</button>
          <img id="msg-peer-avatar" class="twin-avatar" src="" alt="" />
          <div>
            <div id="msg-peer-name" style="font-weight:700;font-size:15px;"></div>
            <div class="twin-post-meta">Twin Chat</div>
          </div>
        </div>
        <a id="msg-peer-profile" href="./profile.html" class="twin-btn twin-btn-secondary twin-btn-sm">Trang cá nhân</a>
      </div>

      <div id="msg-feed" class="twin-messenger-feed">
        <div class="twin-messenger-empty">
          <div style="width:60px;height:60px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 12px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </div>
          <h3 style="color:var(--text);">Chọn một cuộc trò chuyện</h3>
          <p style="margin-top:4px;font-size:14px;">Gửi tin nhắn và hình ảnh thời gian thực trên Twin.</p>
        </div>
      </div>

      <form id="msg-send-form" class="twin-chat-form" style="display:none;">
        <label class="twin-icon-btn" title="Gửi ảnh" style="cursor:pointer;flex-shrink:0;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <input id="msg-image-input" type="file" accept="image/*" hidden />
        </label>
        <input id="msg-text-input" class="twin-input" type="text" placeholder="Nhập tin nhắn..." style="border-radius:999px;" />
        <button class="twin-btn twin-btn-primary" type="submit" style="border-radius:999px;padding:9px 18px;">Gửi</button>
      </form>
    </section>
  </div>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import {
      db,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      uploadToCloudinary,
      pushNotification,
      getChatId,
      DEFAULT_AVATAR,
      escapeHtml,
      formatTime,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    let me = null;
    let allUsers = [];
    let activePeer = null;
    let unsubChat = null;

    const shell = document.getElementById("messenger-shell");
    const convList = document.getElementById("msg-conv-list");
    const feedEl = document.getElementById("msg-feed");
    const topbar = document.getElementById("msg-topbar");
    const sendForm = document.getElementById("msg-send-form");
    const textInput = document.getElementById("msg-text-input");
    const imgInput = document.getElementById("msg-image-input");

    document.getElementById("msg-back-btn").onclick = () => {
      shell.classList.remove("chat-open");
      document.body.classList.remove("mobile-chat-open");
    };

    function renderUsers(filter = "") {
      convList.innerHTML = "";
      const q = filter.trim().toLowerCase();
      const list = allUsers.filter((u) => !q || (u.name || "").toLowerCase().includes(q));
      if (!list.length) {
        convList.innerHTML = '<p class="twin-post-meta" style="padding:14px;">Chưa có người dùng khác.</p>';
        return;
      }
      list.forEach((u) => {
        const btn = document.createElement("button");
        btn.className = `twin-conv-item ${activePeer && activePeer.uid === u.uid ? "active" : ""}`;
        btn.innerHTML = `
          <img class="twin-avatar twin-avatar-md" src="${escapeHtml(u.avatar || DEFAULT_AVATAR)}" alt="" />
          <div style="min-width:0;flex:1;">
            <div style="font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(u.name)}</div>
            <div class="twin-post-meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(u.bio || "Nhấn để trò chuyện")}</div>
          </div>
        `;
        btn.onclick = () => selectPeer(u);
        convList.appendChild(btn);
      });
    }

    function selectPeer(peer) {
      const same = activePeer && activePeer.uid === peer.uid;
      activePeer = peer;
      shell.classList.add("chat-open");
      document.body.classList.add("mobile-chat-open");
      topbar.style.display = "flex";
      sendForm.style.display = "flex";
      document.getElementById("msg-peer-avatar").src = peer.avatar || DEFAULT_AVATAR;
      document.getElementById("msg-peer-name").textContent = peer.name;
      document.getElementById("msg-peer-profile").href = `./profile.html?uid=${encodeURIComponent(peer.uid)}`;
      renderUsers(document.getElementById("msg-search-user").value);

      if (same && unsubChat) return; // đã đang mở đúng cuộc trò chuyện này
      if (unsubChat) unsubChat();
      const chatId = getChatId(me.uid, peer.uid);
      const q = query(collection(db, "messages", chatId, "items"), orderBy("createdAt", "asc"));
      unsubChat = onSnapshot(q, (snap) => {
        feedEl.innerHTML = "";
        if (snap.empty) {
          feedEl.innerHTML = `<div class="twin-messenger-empty">Gửi lời chào tới <strong>${escapeHtml(peer.name)}</strong>!</div>`;
          return;
        }
        snap.forEach((d) => {
          const m = d.data();
          const div = document.createElement("div");
          div.className = `twin-msg ${m.senderUid === me.uid ? "me" : "them"}`;
          if (m.text) {
            const p = document.createElement("div");
            p.textContent = m.text;
            div.appendChild(p);
          }
          if (m.imageUrl) {
            const img = document.createElement("img");
            img.src = m.imageUrl;
            img.alt = "Ảnh";
            div.appendChild(img);
          }
          const timeEl = document.createElement("div");
          timeEl.style.fontSize = "11px";
          timeEl.style.opacity = "0.7";
          timeEl.style.marginTop = "4px";
          timeEl.textContent = formatTime(m.createdAt);
          div.appendChild(timeEl);
          feedEl.appendChild(div);
        });
        feedEl.scrollTop = feedEl.scrollHeight;
      }, (err) => {
        feedEl.innerHTML = "";
        const box = document.createElement("div");
        box.className = "twin-messenger-empty";
        box.textContent = friendlyError(err);
        feedEl.appendChild(box);
      });
    }

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;

        document.getElementById("msg-search-user").addEventListener("input", (e) => renderUsers(e.target.value));
        const preselectUid = new URLSearchParams(window.location.search).get("uid");

        onSnapshot(collection(db, "users"), (snap) => {
          allUsers = [];
          snap.forEach((d) => {
            const u = d.data();
            if (u.uid !== me.uid) allUsers.push(u);
          });
          renderUsers(document.getElementById("msg-search-user").value);
          if (preselectUid && !activePeer) {
            const found = allUsers.find((u) => u.uid === preselectUid);
            if (found) selectPeer(found);
          }
        }, (err) => showToast(friendlyError(err)));

        sendForm.onsubmit = async (e) => {
          e.preventDefault();
          if (!activePeer) return;
          const text = textInput.value.trim();
          if (!text) return;
          textInput.value = "";
          const chatId = getChatId(me.uid, activePeer.uid);
          try {
            await addDoc(collection(db, "messages", chatId, "items"), {
              senderUid: me.uid,
              text,
              createdAt: serverTimestamp()
            });
            const snippet = text.length > 50 ? `${text.slice(0, 50)}…` : text;
            pushNotification(activePeer.uid, {
              fromUid: me.uid,
              fromName: me.name,
              fromAvatar: me.avatar,
              type: "message",
              text: `đã nhắn tin: "${snippet}"`,
              link: `./messages.html?uid=${encodeURIComponent(me.uid)}`
            });
          } catch (err) {
            textInput.value = text; // không mất tin nhắn khi gửi lỗi
            showToast(friendlyError(err));
          }
        };

        imgInput.onchange = async () => {
          const f = imgInput.files[0];
          if (!f || !activePeer) return;
          showToast("Đang tải ảnh lên...");
          try {
            const imageUrl = await uploadToCloudinary(f);
            const chatId = getChatId(me.uid, activePeer.uid);
            await addDoc(collection(db, "messages", chatId, "items"), {
              senderUid: me.uid,
              text: "",
              imageUrl,
              createdAt: serverTimestamp()
            });
            pushNotification(activePeer.uid, {
              fromUid: me.uid,
              fromName: me.name,
              fromAvatar: me.avatar,
              type: "message",
              text: "đã gửi một hình ảnh.",
              link: `./messages.html?uid=${encodeURIComponent(me.uid)}`
            });
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            imgInput.value = "";
          }
        };
      }
    });
  </script>
</body>
</html>
