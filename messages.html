<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Tin nhắn — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23007aff'/%3E%3Cstop offset='100%25' stop-color='%235856d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Cpath d='M19 21h26v6H35.5v18h-7V27H19z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
  <link rel="modulepreload" href="./assets/js/firebase-service.js" />
  <link rel="modulepreload" href="./assets/js/layout.js" />
</head>
<body class="page-messages">
  <header id="twin-header" class="twin-header"></header>

  <div id="messenger-shell" class="twin-messenger-wrap">
    <aside class="twin-messenger-sidebar">
      <div class="twin-messenger-sidebar-head">
        <h2 style="font-size:20px;font-weight:800;margin-bottom:10px;">Tin nhắn</h2>
        <input id="msg-search-user" class="twin-input" type="search" placeholder="Tìm người trò chuyện..." />
      </div>
      <div id="msg-conv-list" class="twin-messenger-list"></div>
    </aside>

    <section class="twin-messenger-main">
      <div id="msg-topbar" class="twin-messenger-topbar" style="display:none;">
        <div style="display:flex;align-items:center;gap:10px;">
          <button id="msg-back-btn" class="twin-icon-btn twin-back-btn" style="width:36px;height:36px;" aria-label="Quay lại danh sách">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <a id="msg-peer-avatar-link" href="./profile.html" class="twin-avatar-link" title="Xem trang cá nhân">
            <img id="msg-peer-avatar" class="twin-avatar" src="" alt="" />
          </a>
          <div>
            <div id="msg-peer-name" class="twin-name-with-badge" style="font-weight:700;font-size:15px;"></div>
            <div class="twin-post-meta">Twin Chat</div>
          </div>
        </div>
        <a id="msg-peer-profile" href="./profile.html" class="twin-btn twin-btn-secondary twin-btn-sm">Trang cá nhân</a>
      </div>

      <div id="msg-feed" class="twin-messenger-feed">
        <div class="twin-messenger-empty">
          <div style="width:62px;height:62px;border-radius:50%;background:var(--primary-soft);border:1px solid var(--border);box-shadow:var(--specular-top);color:var(--primary);display:grid;place-items:center;margin:0 auto 12px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-4.8A8.5 8.5 0 1 1 21 11.5Z"/></svg>
          </div>
          <h3 style="color:var(--text);">Chọn một cuộc trò chuyện</h3>
          <p style="margin-top:4px;font-size:14px;">Gửi tin nhắn và hình ảnh thời gian thực trên Twin.</p>
        </div>
      </div>

      <form id="msg-send-form" class="twin-chat-form" style="display:none;">
        <label class="twin-icon-btn" title="Gửi ảnh" aria-label="Gửi ảnh" style="cursor:pointer;flex-shrink:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-4.5-4.5a2 2 0 0 0-2.8 0L5 19"/></svg>
          <input id="msg-image-input" type="file" accept="image/*" hidden />
        </label>
        <input id="msg-text-input" class="twin-input" type="text" placeholder="Nhập tin nhắn..." />
        <button class="twin-btn twin-btn-primary" type="submit" style="padding:9px 18px;">Gửi</button>
      </form>
    </section>
  </div>

  <script type="module">
    import { initTwinPage, setActiveChatPeer, onUnreadChatCountsChange } from "./assets/js/layout.js";
    import {
      db,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      uploadToCloudinary,
      pushNotification,
      isUserAdmin,
      renderAdminIconHtml,
      getChatId,
      DEFAULT_AVATAR,
      escapeHtml,
      formatTime,
      toMillis,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    let me = null;
    let allUsers = [];
    let activePeer = null;
    let unsubChat = null;
    let unreadByPeer = new Map();
    const lastMessages = new Map();
    const lastMsgUnsubs = new Map();

    const shell = document.getElementById("messenger-shell");
    const convList = document.getElementById("msg-conv-list");
    const feedEl = document.getElementById("msg-feed");
    const topbar = document.getElementById("msg-topbar");
    const sendForm = document.getElementById("msg-send-form");
    const textInput = document.getElementById("msg-text-input");
    const imgInput = document.getElementById("msg-image-input");

    document.getElementById("msg-back-btn").onclick = () => {
      shell.classList.remove("chat-open");
      document.body.classList.remove("mobile-chat-active");
      setActiveChatPeer(null);
      renderUsers(document.getElementById("msg-search-user").value);
    };

    onUnreadChatCountsChange((counts) => {
      unreadByPeer = counts;
      if (me) renderUsers(document.getElementById("msg-search-user").value);
    });

    function formatLastMessagePreview(last) {
      if (!last) return "Chưa có tin nhắn";
      const prefix = me && last.senderUid === me.uid ? "Bạn: " : "";
      if (last.text) return `${prefix}${last.text}`;
      if (last.imageUrl) return `${prefix}Đã gửi một hình ảnh`;
      return "Chưa có tin nhắn";
    }

    function syncLastMessageListeners() {
      if (!me) return;
      const activeUids = new Set(allUsers.map((u) => u.uid));
      for (const [uid, unsub] of lastMsgUnsubs.entries()) {
        if (!activeUids.has(uid)) {
          unsub();
          lastMsgUnsubs.delete(uid);
          lastMessages.delete(uid);
        }
      }
      allUsers.forEach((u) => {
        if (lastMsgUnsubs.has(u.uid)) return;
        const chatId = getChatId(me.uid, u.uid);
        const q = query(collection(db, "messages", chatId, "items"), orderBy("createdAt", "desc"), limit(1));
        const unsub = onSnapshot(q, (snap) => {
          if (snap.empty) {
            lastMessages.delete(u.uid);
          } else {
            const m = snap.docs[0].data();
            lastMessages.set(u.uid, {
              text: m.text || "",
              imageUrl: m.imageUrl || "",
              senderUid: m.senderUid || "",
              createdAt: m.createdAt || null,
              timeMs: toMillis(m.createdAt) || Date.now()
            });
          }
          renderUsers(document.getElementById("msg-search-user").value);
        }, () => {});
        lastMsgUnsubs.set(u.uid, unsub);
      });
    }

    function renderUsers(filter = "") {
      convList.innerHTML = "";
      const q = filter.trim().toLowerCase();
      const list = allUsers
        .filter((u) => !q || (u.name || "").toLowerCase().includes(q))
        .sort((a, b) => (lastMessages.get(b.uid)?.timeMs || 0) - (lastMessages.get(a.uid)?.timeMs || 0));
      if (!list.length) {
        convList.innerHTML = '<p class="twin-post-meta" style="padding:14px;">Chưa có người dùng khác.</p>';
        return;
      }
      list.forEach((u) => {
        const last = lastMessages.get(u.uid);
        const preview = formatLastMessagePreview(last);
        const timeLabel = last ? formatTime(last.createdAt) : "";
        const unread = unreadByPeer.get(u.uid) || 0;
        const isActive = Boolean(activePeer && activePeer.uid === u.uid);
        const btn = document.createElement("button");
        btn.className = `twin-conv-item ${isActive ? "active" : ""} ${unread > 0 ? "unread" : ""}`;
        btn.innerHTML = `
          <div class="twin-conv-avatar-wrap">
            <img class="twin-avatar twin-avatar-md twin-conv-avatar-go" src="${escapeHtml(u.avatar || DEFAULT_AVATAR)}" alt="" title="Xem trang cá nhân" />
            ${unread > 0 ? '<span class="twin-conv-dot" aria-hidden="true"></span>' : ""}
          </div>
          <div style="min-width:0;flex:1;">
            <div class="twin-conv-top">
              <div class="twin-conv-name twin-name-with-badge"><span>${escapeHtml(u.name)}</span>${renderAdminIconHtml(u)}</div>
              ${timeLabel ? `<span class="twin-conv-time">${escapeHtml(timeLabel)}</span>` : ""}
            </div>
            <div class="twin-conv-bottom">
              <div class="twin-conv-preview">${escapeHtml(preview)}</div>
              ${unread > 0 ? `<span class="twin-conv-badge">${unread > 9 ? "9+" : unread}</span>` : ""}
            </div>
          </div>
        `;
        btn.querySelector(".twin-conv-avatar-go").addEventListener("click", (e) => {
          e.stopPropagation();
          window.location.href = `./profile.html?uid=${encodeURIComponent(u.uid)}`;
        });
        btn.onclick = () => selectPeer(u);
        convList.appendChild(btn);
      });
    }

    function selectPeer(peer) {
      const same = activePeer && activePeer.uid === peer.uid;
      activePeer = peer;
      shell.classList.add("chat-open");
      document.body.classList.add("mobile-chat-active");
      setActiveChatPeer(peer.uid);
      topbar.style.display = "flex";
      sendForm.style.display = "flex";
      document.getElementById("msg-peer-avatar").src = peer.avatar || DEFAULT_AVATAR;
      document.getElementById("msg-peer-avatar-link").href = `./profile.html?uid=${encodeURIComponent(peer.uid)}`;
      document.getElementById("msg-peer-name").innerHTML = `<span>${escapeHtml(peer.name)}</span>${renderAdminIconHtml(peer)}`;
      document.getElementById("msg-peer-profile").href = `./profile.html?uid=${encodeURIComponent(peer.uid)}`;
      renderUsers(document.getElementById("msg-search-user").value);

      if (same && unsubChat) return; // đã đang mở đúng cuộc trò chuyện này
      if (unsubChat) unsubChat();
      const chatId = getChatId(me.uid, peer.uid);
      const q = query(collection(db, "messages", chatId, "items"), orderBy("createdAt", "asc"));
      unsubChat = onSnapshot(q, (snap) => {
        feedEl.innerHTML = "";
        if (snap.empty) {
          feedEl.innerHTML = `<div class="twin-messenger-empty">Gửi lời chào tới <strong>${escapeHtml(peer.name)}</strong>!</div>`;
          return;
        }
        snap.forEach((d) => {
          const m = d.data();
          const div = document.createElement("div");
          div.className = `twin-msg ${m.senderUid === me.uid ? "me" : "them"}`;
          if (m.text) {
            const p = document.createElement("div");
            p.textContent = m.text;
            div.appendChild(p);
          }
          if (m.imageUrl) {
            const img = document.createElement("img");
            img.src = m.imageUrl;
            img.alt = "Ảnh";
            div.appendChild(img);
          }
          const timeEl = document.createElement("div");
          timeEl.style.fontSize = "11px";
          timeEl.style.opacity = "0.7";
          timeEl.style.marginTop = "4px";
          timeEl.textContent = formatTime(m.createdAt);
          div.appendChild(timeEl);
          feedEl.appendChild(div);
        });
        feedEl.scrollTop = feedEl.scrollHeight;
      }, (err) => {
        feedEl.innerHTML = "";
        const box = document.createElement("div");
        box.className = "twin-messenger-empty";
        box.textContent = friendlyError(err);
        feedEl.appendChild(box);
      });
    }

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;

        document.getElementById("msg-search-user").addEventListener("input", (e) => renderUsers(e.target.value));
        const preselectUid = new URLSearchParams(window.location.search).get("uid");

        onSnapshot(collection(db, "users"), (snap) => {
          allUsers = [];
          snap.forEach((d) => {
            const u = d.data();
            if (u.uid !== me.uid) allUsers.push(u);
          });
          syncLastMessageListeners();
          renderUsers(document.getElementById("msg-search-user").value);
          if (preselectUid && !activePeer) {
            const found = allUsers.find((u) => u.uid === preselectUid);
            if (found) selectPeer(found);
          }
        }, (err) => showToast(friendlyError(err)));

        function canMessagePeer(peer) {
          if (!peer || !me) return false;
          if (peer.allowMessagesFrom !== "friends") return true;
          if (isUserAdmin(me)) return true;
          return (me.friends || []).includes(peer.uid);
        }

        sendForm.onsubmit = async (e) => {
          e.preventDefault();
          if (!activePeer) return;
          if (!canMessagePeer(activePeer)) {
            showToast("Người này chỉ nhận tin nhắn từ bạn bè.");
            return;
          }
          const text = textInput.value.trim();
          if (!text) return;
          textInput.value = "";
          const chatId = getChatId(me.uid, activePeer.uid);
          try {
            await addDoc(collection(db, "messages", chatId, "items"), {
              senderUid: me.uid,
              text,
              createdAt: serverTimestamp()
            });
            pushNotification(activePeer.uid, {
              fromUid: me.uid,
              fromName: me.name,
              fromAvatar: me.avatar || DEFAULT_AVATAR,
              type: "message",
              text: `đã nhắn: "${text.slice(0, 45)}"`,
              link: `./messages.html?uid=${encodeURIComponent(me.uid)}`
            }).catch((err) => console.warn("Message notification:", err));
          } catch (err) {
            textInput.value = text; // không mất tin nhắn khi gửi lỗi
            showToast(friendlyError(err));
          }
        };

        imgInput.onchange = async () => {
          const f = imgInput.files[0];
          if (!f || !activePeer) return;
          if (!canMessagePeer(activePeer)) {
            showToast("Người này chỉ nhận tin nhắn từ bạn bè.");
            imgInput.value = "";
            return;
          }
          showToast("Đang tải ảnh lên...");
          try {
            const imageUrl = await uploadToCloudinary(f);
            const chatId = getChatId(me.uid, activePeer.uid);
            await addDoc(collection(db, "messages", chatId, "items"), {
              senderUid: me.uid,
              text: "",
              imageUrl,
              createdAt: serverTimestamp()
            });
            pushNotification(activePeer.uid, {
              fromUid: me.uid,
              fromName: me.name,
              fromAvatar: me.avatar || DEFAULT_AVATAR,
              type: "message",
              text: "đã gửi một hình ảnh cho bạn",
              link: `./messages.html?uid=${encodeURIComponent(me.uid)}`
            }).catch((err) => console.warn("Image message notification:", err));
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            imgInput.value = "";
          }
        };
      }
    });
  </script>
</body>
</html>
