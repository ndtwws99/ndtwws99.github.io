<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edf2f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080b13" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Bạn bè — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231877f2'/%3E%3Cstop offset='100%25' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M17 20h30v7.5H36V48h-8V27.5H17z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body class="">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main" style="max-width:1080px;">
    <div class="twin-page-head"><h1>Bạn bè</h1></div>

    <section class="twin-card">
      <h2 style="font-size:17px;margin-bottom:14px;">Lời mời kết bạn</h2>
      <div id="friend-requests-grid" class="twin-cards-grid"></div>
    </section>

    <section class="twin-card">
      <h2 style="font-size:17px;margin-bottom:14px;">Bạn bè của bạn</h2>
      <div id="my-friends-grid" class="twin-cards-grid"></div>
    </section>

    <section class="twin-card">
      <h2 style="font-size:17px;margin-bottom:14px;">Gợi ý kết bạn</h2>
      <div id="suggest-friends-grid" class="twin-cards-grid"></div>
    </section>
  </main>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import {
      db,
      doc,
      collection,
      onSnapshot,
      updateDoc,
      arrayUnion,
      arrayRemove,
      pushNotification,
      DEFAULT_AVATAR,
      escapeHtml,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    async function run(fn) {
      try {
        await fn();
      } catch (err) {
        console.error(err);
        showToast(friendlyError(err));
      }
    }

    initTwinPage({
      requireAuth: true,
      onReady: (me) => {
        if (!me) return;
        onSnapshot(collection(db, "users"), (snap) => {
          const all = [];
          let latestMe = me;
          snap.forEach((d) => {
            const u = d.data();
            if (u.uid === me.uid) latestMe = u;
            else all.push(u);
          });

          const reqIds = latestMe.friendRequests || [];
          const friendIds = latestMe.friends || [];

          const reqGrid = document.getElementById("friend-requests-grid");
          const frGrid = document.getElementById("my-friends-grid");
          const sugGrid = document.getElementById("suggest-friends-grid");
          reqGrid.innerHTML = "";
          frGrid.innerHTML = "";
          sugGrid.innerHTML = "";

          const reqUsers = all.filter((u) => reqIds.includes(u.uid));
          const frUsers = all.filter((u) => friendIds.includes(u.uid));
          const sugUsers = all.filter((u) => !reqIds.includes(u.uid) && !friendIds.includes(u.uid));

          if (!reqUsers.length) reqGrid.innerHTML = '<p class="twin-post-meta">Không có lời mời nào.</p>';
          reqUsers.forEach((u) => {
            const card = document.createElement("div");
            card.className = "twin-entity-card";
            card.innerHTML = `
              <img class="twin-entity-cover" src="${escapeHtml(u.avatar || DEFAULT_AVATAR)}" alt="" />
              <div class="twin-entity-body">
                <a href="./profile.html?uid=${encodeURIComponent(u.uid)}" style="font-weight:700;">${escapeHtml(u.name)}</a>
                <button class="twin-btn twin-btn-primary twin-btn-sm btn-accept">Xác nhận</button>
                <button class="twin-btn twin-btn-secondary twin-btn-sm btn-decline">Xóa</button>
              </div>
            `;
            card.querySelector(".btn-accept").onclick = () => run(async () => {
              await updateDoc(doc(db, "users", me.uid), { friendRequests: arrayRemove(u.uid), friends: arrayUnion(u.uid) });
              // dọn luôn lời mời chiều ngược lại (nếu 2 người cùng gửi cho nhau)
              await updateDoc(doc(db, "users", u.uid), { friends: arrayUnion(me.uid), friendRequests: arrayRemove(me.uid) });
              showToast(`Bạn và ${u.name} đã là bạn bè!`);
              pushNotification(u.uid, {
                fromUid: me.uid,
                fromName: latestMe.name,
                fromAvatar: latestMe.avatar,
                text: "đã chấp nhận lời mời kết bạn.",
                link: `./profile.html?uid=${encodeURIComponent(me.uid)}`
              }).catch(() => {});
            });
            card.querySelector(".btn-decline").onclick = () => run(() =>
              updateDoc(doc(db, "users", me.uid), { friendRequests: arrayRemove(u.uid) })
            );
            reqGrid.appendChild(card);
          });

          if (!frUsers.length) frGrid.innerHTML = '<p class="twin-post-meta">Chưa có bạn bè.</p>';
          frUsers.forEach((u) => {
            const card = document.createElement("div");
            card.className = "twin-entity-card";
            card.innerHTML = `
              <img class="twin-entity-cover" src="${escapeHtml(u.avatar || DEFAULT_AVATAR)}" alt="" />
              <div class="twin-entity-body">
                <a href="./profile.html?uid=${encodeURIComponent(u.uid)}" style="font-weight:700;">${escapeHtml(u.name)}</a>
                <a href="./messages.html?uid=${encodeURIComponent(u.uid)}" class="twin-btn twin-btn-primary twin-btn-sm">Nhắn tin</a>
              </div>
            `;
            frGrid.appendChild(card);
          });

          if (!sugUsers.length) sugGrid.innerHTML = '<p class="twin-post-meta">Không còn gợi ý mới.</p>';
          sugUsers.forEach((u) => {
            const sent = (u.friendRequests || []).includes(me.uid);
            const card = document.createElement("div");
            card.className = "twin-entity-card";
            card.innerHTML = `
              <img class="twin-entity-cover" src="${escapeHtml(u.avatar || DEFAULT_AVATAR)}" alt="" />
              <div class="twin-entity-body">
                <a href="./profile.html?uid=${encodeURIComponent(u.uid)}" style="font-weight:700;">${escapeHtml(u.name)}</a>
                <button class="twin-btn ${sent ? "twin-btn-ghost" : "twin-btn-secondary"} twin-btn-sm btn-add">${sent ? "Hủy lời mời" : "Thêm bạn bè"}</button>
              </div>
            `;
            card.querySelector(".btn-add").onclick = () => run(async () => {
              if (sent) {
                await updateDoc(doc(db, "users", u.uid), { friendRequests: arrayRemove(me.uid) });
                showToast("Đã hủy lời mời.");
                return;
              }
              await updateDoc(doc(db, "users", u.uid), { friendRequests: arrayUnion(me.uid) });
              showToast(`Đã gửi lời mời tới ${u.name}!`);
              pushNotification(u.uid, {
                fromUid: me.uid,
                fromName: latestMe.name,
                fromAvatar: latestMe.avatar,
                text: "đã gửi lời mời kết bạn.",
                link: "./friends.html"
              }).catch(() => {});
            });
            sugGrid.appendChild(card);
          });
        }, (err) => showToast(friendlyError(err)));
      }
    });
  </script>
</body>
</html>
