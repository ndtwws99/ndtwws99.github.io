<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151a24" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Chợ Twin — Mua bán hàng</title>
  <meta name="description" content="Chợ Twin — Mua bán hàng hóa, đăng tin rao vặt, giỏ hàng và nhắn tin trực tiếp với người bán trên Twin." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='ig' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23feda75'/%3E%3Cstop offset='25%25' stop-color='%23fa7e1e'/%3E%3Cstop offset='52%25' stop-color='%23d62976'/%3E%3Cstop offset='78%25' stop-color='%23962fbf'/%3E%3Cstop offset='100%25' stop-color='%234f5bd5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23ig)'/%3E%3Cellipse cx='25' cy='15' rx='15' ry='7' fill='%23ffffff' opacity='.22'/%3E%3Cpath d='M18.5 21.5h27v6.6h-9.7v19.4h-7.6V28.1h-9.7z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
  <link rel="modulepreload" href="./assets/js/firebase-service.js" />
  <link rel="modulepreload" href="./assets/js/layout.js" />
</head>
<body class="page-market">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main twin-market-main">
    <section class="twin-market-hero">
      <div>
        <h1>Chợ Twin</h1>
        <p class="twin-post-meta" style="margin-top:3px;">Đăng bán nhanh, tìm kiếm theo danh mục và đặt mua trực tiếp với cộng đồng Twin.</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button type="button" id="mk-open-cart" class="twin-btn twin-btn-secondary twin-btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.2 11.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6l1.3-7.2H6.2"/></svg>
          <span>Giỏ hàng (<span id="mk-cart-count">0</span>)</span>
        </button>
        <button type="button" id="mk-open-sell" class="twin-btn twin-btn-primary twin-btn-sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Đăng bán sản phẩm</span>
        </button>
      </div>
    </section>

    <div class="twin-market-toolbar">
      <div class="twin-market-search-wrap">
        <input id="mk-search" class="twin-input" type="search" placeholder="Tìm sản phẩm, địa điểm, người bán..." />
      </div>
      <select id="mk-view-filter" class="twin-select" style="width:auto;min-width:142px;" aria-label="Bộ lọc tin">
        <option value="all">Tất cả tin</option>
        <option value="available">Đang bán</option>
        <option value="mine">Tin của tôi</option>
        <option value="saved">Đã lưu</option>
      </select>
      <select id="mk-sort" class="twin-select" style="width:auto;min-width:152px;" aria-label="Sắp xếp">
        <option value="newest">Mới nhất</option>
        <option value="price-asc">Giá thấp → cao</option>
        <option value="price-desc">Giá cao → thấp</option>
      </select>
    </div>

    <div id="mk-cats" class="twin-market-cats" role="tablist" aria-label="Danh mục sản phẩm">
      <button type="button" class="twin-market-cat-btn active" data-cat="all">Tất cả</button>
      <button type="button" class="twin-market-cat-btn" data-cat="Điện tử">Điện tử</button>
      <button type="button" class="twin-market-cat-btn" data-cat="Thời trang">Thời trang</button>
      <button type="button" class="twin-market-cat-btn" data-cat="Gia dụng">Gia dụng</button>
      <button type="button" class="twin-market-cat-btn" data-cat="Sách & Học tập">Sách &amp; Học tập</button>
      <button type="button" class="twin-market-cat-btn" data-cat="Xe cộ">Xe cộ</button>
      <button type="button" class="twin-market-cat-btn" data-cat="Khác">Khác</button>
    </div>

    <div id="mk-grid" class="twin-market-grid"></div>
  </main>

  <!-- Modal Đăng bán sản phẩm -->
  <div class="twin-modal-backdrop" id="mk-sell-modal">
    <div class="twin-modal" style="max-width:540px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2>Đăng bán sản phẩm</h2>
        <button type="button" id="mk-sell-close" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>
      <form id="mk-sell-form" style="display:flex;flex-direction:column;gap:11px;">
        <div>
          <label class="twin-field-label" for="mk-title">Tên sản phẩm *</label>
          <input id="mk-title" class="twin-input" type="text" required maxlength="100" placeholder="Ví dụ: Tai nghe Bluetooth Sony WH-1000XM5..." />
        </div>
        <div class="twin-form-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="twin-field-label" for="mk-price">Giá bán (VNĐ) *</label>
            <input id="mk-price" class="twin-input" type="number" min="0" step="1000" required placeholder="500000 (nhập 0 nếu tặng)" />
          </div>
          <div>
            <label class="twin-field-label" for="mk-cat">Danh mục</label>
            <select id="mk-cat" class="twin-select">
              <option value="Điện tử">Điện tử</option>
              <option value="Thời trang">Thời trang</option>
              <option value="Gia dụng">Gia dụng</option>
              <option value="Sách & Học tập">Sách &amp; Học tập</option>
              <option value="Xe cộ">Xe cộ</option>
              <option value="Khác">Khác</option>
            </select>
          </div>
        </div>
        <div class="twin-form-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div>
            <label class="twin-field-label" for="mk-cond">Tình trạng</label>
            <select id="mk-cond" class="twin-select">
              <option value="Mới 100%">Mới 100%</option>
              <option value="Như mới (99%)">Như mới (99%)</option>
              <option value="Đã qua sử dụng">Đã qua sử dụng</option>
            </select>
          </div>
          <div>
            <label class="twin-field-label" for="mk-loc">Khu vực / Địa chỉ</label>
            <input id="mk-loc" class="twin-input" type="text" maxlength="60" placeholder="VD: Hà Nội, TP.HCM..." />
          </div>
        </div>
        <div>
          <label class="twin-field-label" for="mk-desc">Mô tả chi tiết *</label>
          <textarea id="mk-desc" class="twin-textarea" required maxlength="1200" placeholder="Mô tả tình trạng, bảo hành, phụ kiện kèm theo, cách giao nhận..."></textarea>
        </div>
        <div>
          <label class="twin-btn twin-btn-secondary twin-btn-sm" style="width:100%;cursor:pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-4.5-4.5-6.5 6.5"/></svg>
            <span id="mk-img-label">Chọn ảnh sản phẩm (tối đa 4 ảnh)</span>
            <input id="mk-img-input" type="file" accept="image/*" multiple hidden />
          </label>
          <div id="mk-img-preview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"></div>
        </div>
        <button type="submit" id="mk-sell-submit" class="twin-btn twin-btn-primary" style="width:100%;margin-top:4px;">Đăng bán ngay</button>
      </form>
    </div>
  </div>

  <!-- Modal Chi tiết sản phẩm -->
  <div class="twin-modal-backdrop" id="mk-detail-modal">
    <div class="twin-modal" style="max-width:600px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 id="mk-detail-heading">Chi tiết sản phẩm</h2>
        <button type="button" id="mk-detail-close" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>
      <div id="mk-detail-body"></div>
    </div>
  </div>

  <!-- Modal Đặt mua nhanh -->
  <div class="twin-modal-backdrop" id="mk-order-modal">
    <div class="twin-modal" style="max-width:460px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2>Gửi yêu cầu đặt mua</h2>
        <button type="button" id="mk-order-close" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>
      <div id="mk-order-summary" class="twin-card" style="padding:12px;margin-bottom:12px;"></div>
      <form id="mk-order-form" style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:grid;grid-template-columns:100px 1fr;gap:10px;">
          <div>
            <label class="twin-field-label" for="mk-order-qty">Số lượng</label>
            <input id="mk-order-qty" class="twin-input" type="number" min="1" max="99" value="1" required />
          </div>
          <div>
            <label class="twin-field-label" for="mk-order-phone">Số điện thoại liên hệ *</label>
            <input id="mk-order-phone" class="twin-input" type="tel" required maxlength="25" placeholder="09xx xxx xxx" />
          </div>
        </div>
        <div>
          <label class="twin-field-label" for="mk-order-addr">Địa chỉ nhận hàng / Ghi chú *</label>
          <textarea id="mk-order-addr" class="twin-textarea" style="min-height:70px;" required maxlength="300" placeholder="Nhập địa chỉ giao hàng hoặc đề nghị thương lượng giá..."></textarea>
        </div>
        <button type="submit" id="mk-order-submit" class="twin-btn twin-btn-primary" style="width:100%;">Xác nhận gửi đơn cho người bán</button>
      </form>
    </div>
  </div>

  <!-- Modal Giỏ hàng -->
  <div class="twin-modal-backdrop" id="mk-cart-modal">
    <div class="twin-modal" style="max-width:500px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2>Giỏ hàng của bạn</h2>
        <button type="button" id="mk-cart-close" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>
      <div id="mk-cart-body"></div>
    </div>
  </div>

  <script type="module">
    import {
      db,
      collection,
      doc,
      query,
      orderBy,
      limit,
      onSnapshot,
      addDoc,
      updateDoc,
      deleteDoc,
      arrayUnion,
      arrayRemove,
      serverTimestamp,
      uploadToCloudinary,
      getChatId,
      pushNotification,
      isGuestUser,
      isUserAdmin,
      requireMemberAction,
      twinConfirm,
      renderAdminIconHtml,
      DEFAULT_AVATAR,
      escapeHtml,
      formatTime,
      toMillis,
      friendlyError,
      showToast
    } from "./assets/js/firebase-service.js";
    import { initTwinPage } from "./assets/js/layout.js";

    const CART_KEY_PREFIX = "twin_market_cart_v1_";
    let me = null;
    let allItems = [];
    let activeCat = "all";
    let activeView = "all";
    let activeSort = "newest";
    let searchTerm = "";
    let selectedFiles = [];
    let currentDetailId = null;
    let pendingOrderItems = [];

    function getCartKey() {
      return CART_KEY_PREFIX + (me?.uid || "guest");
    }
    function loadCart() {
      try {
        const raw = JSON.parse(localStorage.getItem(getCartKey()) || "[]");
        return Array.isArray(raw) ? raw : [];
      } catch {
        return [];
      }
    }
    function saveCart(cart) {
      try {
        localStorage.setItem(getCartKey(), JSON.stringify(cart));
      } catch {}
      updateCartBadge();
    }
    function updateCartBadge() {
      const cart = loadCart();
      const count = cart.reduce((acc, i) => acc + Math.max(1, Number(i.qty) || 1), 0);
      const el = document.getElementById("mk-cart-count");
      if (el) el.textContent = String(count);
    }

    function formatPrice(val) {
      const n = Number(val);
      if (!Number.isFinite(n) || n <= 0) return "Thỏa thuận / Tặng";
      return `${n.toLocaleString("vi-VN")} ₫`;
    }

    function getProductImages(item) {
      if (Array.isArray(item.images) && item.images.length) return item.images.filter(Boolean);
      if (item.imageUrl) return [item.imageUrl];
      return [];
    }

    function renderGrid() {
      const grid = document.getElementById("mk-grid");
      const q = searchTerm.trim().toLowerCase();
      let list = allItems.filter((it) => {
        if (activeCat !== "all" && (it.marketCategory || "Khác") !== activeCat) return false;
        if (activeView === "available" && it.marketStatus === "sold") return false;
        if (activeView === "mine" && (!me || it.authorUid !== me.uid)) return false;
        if (activeView === "saved" && (!me || !(it.savedBy || []).includes(me.uid))) return false;
        if (q) {
          const hay = `${it.marketTitle || ""} ${it.content || ""} ${it.marketLocation || ""} ${it.authorName || ""} ${it.marketCategory || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (activeSort === "price-asc") {
        list.sort((a, b) => (Number(a.marketPrice) || 0) - (Number(b.marketPrice) || 0));
      } else if (activeSort === "price-desc") {
        list.sort((a, b) => (Number(b.marketPrice) || 0) - (Number(a.marketPrice) || 0));
      } else {
        list.sort((a, b) => toMillis(b.createdAt) - toMillis(a.createdAt));
      }

      if (!list.length) {
        grid.innerHTML = `
          <div class="twin-card" style="grid-column:1/-1;text-align:center;padding:38px 18px;">
            <div style="font-size:17px;font-weight:800;margin-bottom:6px;">Chưa có sản phẩm phù hợp</div>
            <p class="twin-post-meta" style="margin-bottom:14px;">Hãy thử đổi danh mục tìm kiếm hoặc đăng bán sản phẩm đầu tiên của bạn trên Chợ Twin.</p>
            <button type="button" class="twin-btn twin-btn-primary twin-btn-sm" id="mk-empty-sell-btn">+ Đăng bán ngay</button>
          </div>`;
        document.getElementById("mk-empty-sell-btn")?.addEventListener("click", openSellModal);
        return;
      }

      grid.innerHTML = list.map((it) => {
        const imgs = getProductImages(it);
        const isSold = it.marketStatus === "sold";
        const isSaved = Boolean(me && !isGuestUser(me) && (it.savedBy || []).includes(me.uid));
        return `
          <article class="twin-product-card" data-id="${escapeHtml(it.id)}">
            <div class="twin-product-media">
              ${imgs[0]
                ? `<img src="${escapeHtml(imgs[0])}" alt="${escapeHtml(it.marketTitle || "Sản phẩm")}" loading="lazy" />`
                : `<div class="twin-product-placeholder"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5 4.8 4h14.4L21 9.5"/><path d="M5 12.5V20h14v-7.5"/></svg></div>`}
              <span class="twin-product-cond">${escapeHtml(it.marketCondition || "Mới 100%")}</span>
              <button type="button" class="twin-product-save-btn ${isSaved ? "saved" : ""}" data-save-id="${escapeHtml(it.id)}" title="${isSaved ? "Bỏ lưu" : "Lưu sản phẩm"}" aria-label="Lưu sản phẩm">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="${isSaved ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
              </button>
              ${isSold ? `<div class="twin-product-sold-mask"><span class="twin-product-sold-tag">ĐÃ BÁN</span></div>` : ""}
            </div>
            <div class="twin-product-body">
              <div class="twin-product-price">${escapeHtml(formatPrice(it.marketPrice))}</div>
              <div class="twin-product-title">${escapeHtml(it.marketTitle || "Sản phẩm Twin")}</div>
              <div class="twin-post-meta">${escapeHtml(it.marketCategory || "Khác")}${it.marketLocation ? ` · ${escapeHtml(it.marketLocation)}` : ""}</div>
              <div class="twin-product-meta">
                <span class="twin-product-seller">
                  <img class="twin-avatar" style="width:20px;height:20px;" src="${escapeHtml(it.authorAvatar || DEFAULT_AVATAR)}" alt="" />
                  <span>${escapeHtml(it.authorName || "Thành viên")}</span>
                </span>
                <span>${escapeHtml(formatTime(it.createdAt))}</span>
              </div>
            </div>
          </article>`;
      }).join("");

      grid.querySelectorAll(".twin-product-card").forEach((card) => {
        card.addEventListener("click", () => openDetailModal(card.dataset.id));
      });
      grid.querySelectorAll("[data-save-id]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleSaveProduct(btn.dataset.saveId);
        });
      });
    }

    async function toggleSaveProduct(id) {
      if (!requireMemberAction(me, "lưu sản phẩm")) return;
      const item = allItems.find((x) => x.id === id);
      if (!item) return;
      const saved = (item.savedBy || []).includes(me.uid);
      try {
        await updateDoc(doc(db, "posts", id), {
          savedBy: saved ? arrayRemove(me.uid) : arrayUnion(me.uid)
        });
        showToast(saved ? "Đã bỏ lưu sản phẩm" : "Đã lưu sản phẩm yêu thích");
      } catch (err) {
        showToast(friendlyError(err));
      }
    }

    function addToCart(item) {
      if (!item || item.marketStatus === "sold") {
        showToast("Sản phẩm này đã được bán.");
        return;
      }
      if (me && item.authorUid === me.uid) {
        showToast("Bạn là người đăng bán sản phẩm này.");
        return;
      }
      const cart = loadCart();
      const idx = cart.findIndex((c) => c.id === item.id);
      if (idx >= 0) {
        cart[idx].qty = Math.min(99, (Number(cart[idx].qty) || 1) + 1);
      } else {
        cart.push({
          id: item.id,
          title: item.marketTitle || "Sản phẩm",
          price: Number(item.marketPrice) || 0,
          image: getProductImages(item)[0] || "",
          sellerUid: item.authorUid,
          sellerName: item.authorName || "Người bán",
          qty: 1
        });
      }
      saveCart(cart);
      showToast("Đã thêm vào giỏ hàng!");
    }

    function openDetailModal(id) {
      const item = allItems.find((x) => x.id === id);
      if (!item) return;
      currentDetailId = id;
      const imgs = getProductImages(item);
      const isSold = item.marketStatus === "sold";
      const isOwner = Boolean(me && !isGuestUser(me) && me.uid === item.authorUid);
      const canManage = isOwner || (me && !isGuestUser(me) && isUserAdmin(me));
      const isSaved = Boolean(me && !isGuestUser(me) && (item.savedBy || []).includes(me.uid));
      const comments = Array.isArray(item.comments) ? item.comments : [];

      document.getElementById("mk-detail-heading").textContent = item.marketTitle || "Chi tiết sản phẩm";
      const body = document.getElementById("mk-detail-body");
      body.innerHTML = `
        ${imgs.length ? `
          <img id="mk-detail-main-img" class="twin-product-detail-img" src="${escapeHtml(imgs[0])}" alt="" />
          ${imgs.length > 1 ? `<div style="display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;">
            ${imgs.map((u, idx) => `<img data-thumb="${idx}" src="${escapeHtml(u)}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid ${idx === 0 ? "var(--primary)" : "var(--border)"};" alt="" />`).join("")}
          </div>` : ""}
        ` : ""}

        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
          <div style="font-size:22px;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums;">${escapeHtml(formatPrice(item.marketPrice))}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <span class="twin-pill-tag">${escapeHtml(item.marketCategory || "Khác")}</span>
            <span class="twin-post-meta">· ${escapeHtml(item.marketCondition || "Mới 100%")}</span>
            ${isSold ? `<span class="twin-pill-tag" style="color:var(--danger);">ĐÃ BÁN</span>` : ""}
          </div>
        </div>

        <div class="twin-post-meta" style="margin-bottom:12px;">
          ${item.marketLocation ? `📍 ${escapeHtml(item.marketLocation)} · ` : ""}Đăng ${escapeHtml(formatTime(item.createdAt))}
        </div>

        <div class="twin-card" style="padding:12px 14px;margin-bottom:12px;white-space:pre-wrap;font-size:14px;color:var(--text-2);">${escapeHtml(item.content || "")}</div>

        <div class="twin-card" style="padding:11px 13px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <a href="./profile.html?uid=${encodeURIComponent(item.authorUid)}" style="display:flex;align-items:center;gap:10px;min-width:0;">
            <img class="twin-avatar" src="${escapeHtml(item.authorAvatar || DEFAULT_AVATAR)}" alt="" />
            <div style="min-width:0;">
              <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px;"><span>${escapeHtml(item.authorName || "Thành viên")}</span>${renderAdminIconHtml(item.authorUid)}</div>
              <div class="twin-post-meta">Xem trang cá nhân người bán</div>
            </div>
          </a>
          ${!isOwner ? `<a href="./messages.html?uid=${encodeURIComponent(item.authorUid)}" class="twin-btn twin-btn-secondary twin-btn-sm">Nhắn tin</a>` : ""}
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
          ${!isOwner && !isSold ? `
            <button type="button" id="mk-btn-buy-now" class="twin-btn twin-btn-primary" style="flex:1;">Đặt mua ngay</button>
            <button type="button" id="mk-btn-add-cart" class="twin-btn twin-btn-secondary">+ Giỏ hàng</button>
          ` : ""}
          <button type="button" id="mk-btn-save-detail" class="twin-btn twin-btn-secondary">${isSaved ? "Đã lưu ♥" : "Lưu tin"}</button>
          ${canManage ? `
            <button type="button" id="mk-btn-toggle-sold" class="twin-btn twin-btn-secondary">${isSold ? "Mở bán lại" : "Đánh dấu Đã bán"}</button>
            <button type="button" id="mk-btn-delete" class="twin-btn twin-btn-danger">Xóa tin</button>
          ` : ""}
        </div>

        <div style="border-top:1px solid var(--border);padding-top:12px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:8px;">Hỏi đáp về sản phẩm (${comments.length})</div>
          <div id="mk-qa-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:200px;overflow-y:auto;">
            ${comments.length
              ? comments.map((c) => `
                  <div style="display:flex;gap:8px;align-items:flex-start;">
                    <img class="twin-avatar twin-avatar-sm" src="${escapeHtml(c.authorAvatar || DEFAULT_AVATAR)}" alt="" />
                    <div class="twin-comment-bubble" style="flex:1;">
                      <div style="font-weight:700;font-size:12.5px;">${escapeHtml(c.authorName || "Thành viên")}</div>
                      <div style="font-size:13.5px;">${escapeHtml(c.text || "")}</div>
                    </div>
                  </div>`).join("")
              : `<p class="twin-post-meta">Chưa có câu hỏi nào. Hãy hỏi người bán về sản phẩm!</p>`}
          </div>
          <form id="mk-qa-form" style="display:flex;gap:8px;">
            <input id="mk-qa-input" class="twin-input" type="text" maxlength="300" placeholder="Hỏi người bán về tình trạng, giá, giao hàng..." />
            <button type="submit" class="twin-btn twin-btn-primary twin-btn-sm">Gửi</button>
          </form>
        </div>
      `;

      body.querySelectorAll("[data-thumb]").forEach((thumb) => {
        thumb.addEventListener("click", () => {
          const mainImg = document.getElementById("mk-detail-main-img");
          if (mainImg) mainImg.src = thumb.src;
          body.querySelectorAll("[data-thumb]").forEach((t) => (t.style.borderColor = "var(--border)"));
          thumb.style.borderColor = "var(--primary)";
        });
      });

      document.getElementById("mk-btn-buy-now")?.addEventListener("click", () => {
        if (!requireMemberAction(me, "đặt mua sản phẩm")) return;
        openOrderModal([{
          id: item.id,
          title: item.marketTitle || "Sản phẩm",
          price: Number(item.marketPrice) || 0,
          sellerUid: item.authorUid,
          sellerName: item.authorName || "Người bán",
          qty: 1
        }]);
      });

      document.getElementById("mk-btn-add-cart")?.addEventListener("click", () => addToCart(item));
      document.getElementById("mk-btn-save-detail")?.addEventListener("click", async () => {
        await toggleSaveProduct(item.id);
      });

      document.getElementById("mk-btn-toggle-sold")?.addEventListener("click", async () => {
        try {
          const next = isSold ? "available" : "sold";
          await updateDoc(doc(db, "posts", item.id), { marketStatus: next });
          showToast(next === "sold" ? "Đã đánh dấu sản phẩm là Đã bán." : "Đã mở bán lại sản phẩm.");
        } catch (err) {
          showToast(friendlyError(err));
        }
      });

      document.getElementById("mk-btn-delete")?.addEventListener("click", async () => {
        const ok = await twinConfirm({
          title: "Xóa tin bán hàng",
          message: "Bạn có chắc muốn xóa sản phẩm này khỏi Chợ Twin?",
          confirmText: "Xóa tin",
          danger: true
        });
        if (!ok) return;
        try {
          await deleteDoc(doc(db, "posts", item.id));
          document.getElementById("mk-detail-modal").classList.remove("open");
          currentDetailId = null;
          showToast("Đã xóa tin đăng bán.");
        } catch (err) {
          showToast(friendlyError(err));
        }
      });

      document.getElementById("mk-qa-form")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!requireMemberAction(me, "hỏi đáp về sản phẩm")) return;
        const inp = document.getElementById("mk-qa-input");
        const text = inp.value.trim();
        if (!text) return;
        inp.value = "";
        const nextCmt = {
          id: `c_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          authorUid: me.uid,
          authorName: me.name || "Thành viên",
          authorAvatar: me.avatar || DEFAULT_AVATAR,
          text,
          createdAtMs: Date.now()
        };
        try {
          await updateDoc(doc(db, "posts", item.id), { comments: arrayUnion(nextCmt) });
          if (item.authorUid && item.authorUid !== me.uid) {
            pushNotification(item.authorUid, {
              fromUid: me.uid,
              fromName: me.name,
              fromAvatar: me.avatar || DEFAULT_AVATAR,
              type: "comment",
              text: `đã đặt câu hỏi về sản phẩm "${item.marketTitle || "Chợ Twin"}".`,
              link: `./market.html?id=${encodeURIComponent(item.id)}`
            }).catch(() => {});
          }
        } catch (err) {
          showToast(friendlyError(err));
        }
      });

      document.getElementById("mk-detail-modal").classList.add("open");
    }

    function openOrderModal(items) {
      pendingOrderItems = items;
      const total = items.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 1), 0);
      const qtyInput = document.getElementById("mk-order-qty");
      if (items.length === 1) {
        qtyInput.disabled = false;
        qtyInput.value = String(items[0].qty || 1);
      } else {
        qtyInput.disabled = true;
        qtyInput.value = String(items.reduce((s, i) => s + (Number(i.qty) || 1), 0));
      }
      document.getElementById("mk-order-summary").innerHTML = `
        <div style="font-weight:700;font-size:14px;margin-bottom:4px;">${items.length === 1 ? escapeHtml(items[0].title) : `${items.length} sản phẩm trong giỏ hàng`}</div>
        <div class="twin-post-meta">Tạm tính: <strong style="color:var(--danger);">${escapeHtml(formatPrice(total))}</strong></div>
      `;
      document.getElementById("mk-order-modal").classList.add("open");
    }

    function renderCartModal() {
      const cart = loadCart();
      const body = document.getElementById("mk-cart-body");
      if (!cart.length) {
        body.innerHTML = `<p class="twin-post-meta" style="text-align:center;padding:24px 8px;">Giỏ hàng đang trống. Hãy chọn sản phẩm bạn thích trên Chợ Twin!</p>`;
        return;
      }
      const total = cart.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 1), 0);
      body.innerHTML = `
        <div style="max-height:52dvh;overflow-y:auto;">
          ${cart.map((it, idx) => `
            <div class="twin-cart-item">
              ${it.image
                ? `<img class="twin-cart-thumb" src="${escapeHtml(it.image)}" alt="" />`
                : `<div class="twin-cart-thumb" style="display:grid;place-items:center;color:var(--text-3);">🛍</div>`}
              <div style="min-width:0;flex:1;">
                <div style="font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(it.title)}</div>
                <div style="font-size:13px;font-weight:800;color:var(--danger);">${escapeHtml(formatPrice(it.price))}</div>
                <div class="twin-post-meta">Người bán: ${escapeHtml(it.sellerName || "Thành viên")}</div>
              </div>
              <div style="display:flex;align-items:center;gap:4px;">
                <button type="button" class="twin-icon-btn" style="width:28px;height:28px;background:var(--surface-2);" data-cart-dec="${idx}">-</button>
                <span style="min-width:22px;text-align:center;font-weight:700;font-size:13px;">${it.qty || 1}</span>
                <button type="button" class="twin-icon-btn" style="width:28px;height:28px;background:var(--surface-2);" data-cart-inc="${idx}">+</button>
                <button type="button" class="twin-icon-btn" style="width:28px;height:28px;color:var(--danger);" data-cart-del="${idx}" title="Xóa">✕</button>
              </div>
            </div>
          `).join("")}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-top:1px solid var(--border);margin-top:8px;">
          <span style="font-weight:700;">Tổng cộng:</span>
          <strong style="font-size:18px;color:var(--danger);">${escapeHtml(formatPrice(total))}</strong>
        </div>
        <button type="button" id="mk-cart-checkout" class="twin-btn twin-btn-primary" style="width:100%;">Đặt mua tất cả sản phẩm</button>
      `;

      body.querySelectorAll("[data-cart-inc]").forEach((b) => {
        b.onclick = () => {
          const c = loadCart();
          const i = Number(b.dataset.cartInc);
          if (c[i]) { c[i].qty = Math.min(99, (c[i].qty || 1) + 1); saveCart(c); renderCartModal(); }
        };
      });
      body.querySelectorAll("[data-cart-dec]").forEach((b) => {
        b.onclick = () => {
          const c = loadCart();
          const i = Number(b.dataset.cartDec);
          if (c[i]) {
            if ((c[i].qty || 1) <= 1) c.splice(i, 1);
            else c[i].qty -= 1;
            saveCart(c);
            renderCartModal();
          }
        };
      });
      body.querySelectorAll("[data-cart-del]").forEach((b) => {
        b.onclick = () => {
          const c = loadCart();
          c.splice(Number(b.dataset.cartDel), 1);
          saveCart(c);
          renderCartModal();
        };
      });
      document.getElementById("mk-cart-checkout")?.addEventListener("click", () => {
        if (!requireMemberAction(me, "đặt mua hàng")) return;
        document.getElementById("mk-cart-modal").classList.remove("open");
        openOrderModal(loadCart());
      });
    }

    function openSellModal() {
      if (!requireMemberAction(me, "đăng bán sản phẩm")) return;
      document.getElementById("mk-sell-modal").classList.add("open");
      setTimeout(() => document.getElementById("mk-title")?.focus(), 40);
    }

    // Bind UI events
    document.getElementById("mk-open-sell").onclick = openSellModal;
    document.getElementById("mk-sell-close").onclick = () => document.getElementById("mk-sell-modal").classList.remove("open");
    document.getElementById("mk-detail-close").onclick = () => {
      document.getElementById("mk-detail-modal").classList.remove("open");
      currentDetailId = null;
    };
    document.getElementById("mk-order-close").onclick = () => document.getElementById("mk-order-modal").classList.remove("open");
    document.getElementById("mk-open-cart").onclick = () => {
      renderCartModal();
      document.getElementById("mk-cart-modal").classList.add("open");
    };
    document.getElementById("mk-cart-close").onclick = () => document.getElementById("mk-cart-modal").classList.remove("open");

    document.getElementById("mk-search").addEventListener("input", (e) => {
      searchTerm = e.target.value;
      renderGrid();
    });
    document.getElementById("mk-view-filter").addEventListener("change", (e) => {
      activeView = e.target.value;
      renderGrid();
    });
    document.getElementById("mk-sort").addEventListener("change", (e) => {
      activeSort = e.target.value;
      renderGrid();
    });
    document.querySelectorAll(".twin-market-cat-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".twin-market-cat-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeCat = btn.dataset.cat;
        renderGrid();
      });
    });

    document.getElementById("mk-img-input").addEventListener("change", (e) => {
      selectedFiles = Array.from(e.target.files || []).slice(0, 4);
      const wrap = document.getElementById("mk-img-preview");
      wrap.innerHTML = "";
      document.getElementById("mk-img-label").textContent = selectedFiles.length
        ? `Đã chọn ${selectedFiles.length} ảnh`
        : "Chọn ảnh sản phẩm (tối đa 4 ảnh)";
      selectedFiles.forEach((file) => {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.style.cssText = "width:68px;height:68px;object-fit:cover;border-radius:10px;border:1px solid var(--border);";
        wrap.appendChild(img);
      });
    });

    document.getElementById("mk-sell-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!requireMemberAction(me, "đăng bán sản phẩm")) return;
      const btn = document.getElementById("mk-sell-submit");
      const title = document.getElementById("mk-title").value.trim();
      const price = Math.max(0, Number(document.getElementById("mk-price").value) || 0);
      const category = document.getElementById("mk-cat").value;
      const condition = document.getElementById("mk-cond").value;
      const location = document.getElementById("mk-loc").value.trim();
      const desc = document.getElementById("mk-desc").value.trim();
      if (!title || !desc) return;

      btn.disabled = true;
      btn.textContent = "Đang đăng sản phẩm...";
      try {
        const uploadedUrls = [];
        for (const f of selectedFiles) {
          const url = await uploadToCloudinary(f);
          if (url) uploadedUrls.push(url);
        }
        await addDoc(collection(db, "posts"), {
          postType: "market",
          marketTitle: title,
          marketPrice: price,
          marketCategory: category,
          marketCondition: condition,
          marketLocation: location,
          marketStatus: "available",
          content: desc,
          imageUrl: uploadedUrls[0] || "",
          images: uploadedUrls,
          authorUid: me.uid,
          authorName: me.name || "Thành viên Twin",
          authorAvatar: me.avatar || DEFAULT_AVATAR,
          privacy: "public",
          reactions: {},
          comments: [],
          savedBy: [],
          createdAt: serverTimestamp()
        });
        document.getElementById("mk-sell-form").reset();
        selectedFiles = [];
        document.getElementById("mk-img-preview").innerHTML = "";
        document.getElementById("mk-img-label").textContent = "Chọn ảnh sản phẩm (tối đa 4 ảnh)";
        document.getElementById("mk-sell-modal").classList.remove("open");
        showToast("Đã đăng bán sản phẩm thành công!");
      } catch (err) {
        showToast(friendlyError(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Đăng bán ngay";
      }
    });

    document.getElementById("mk-order-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!requireMemberAction(me, "gửi yêu cầu đặt mua")) return;
      if (!pendingOrderItems.length) return;
      const btn = document.getElementById("mk-order-submit");
      const phone = document.getElementById("mk-order-phone").value.trim();
      const addr = document.getElementById("mk-order-addr").value.trim();
      const singleQty = Math.max(1, Number(document.getElementById("mk-order-qty").value) || 1);

      btn.disabled = true;
      btn.textContent = "Đang gửi đơn...";
      try {
        const bySeller = new Map();
        pendingOrderItems.forEach((it) => {
          const qty = pendingOrderItems.length === 1 ? singleQty : (Number(it.qty) || 1);
          const arr = bySeller.get(it.sellerUid) || [];
          arr.push({ ...it, qty });
          bySeller.set(it.sellerUid, arr);
        });

        let firstSellerUid = null;
        for (const [sellerUid, list] of bySeller.entries()) {
          if (!sellerUid || sellerUid === me.uid) continue;
          if (!firstSellerUid) firstSellerUid = sellerUid;
          const subTotal = list.reduce((s, x) => s + (Number(x.price) || 0) * x.qty, 0);
          const lines = list.map((x) => `• ${x.title} (SL: ${x.qty}) — ${formatPrice(x.price * x.qty)}`).join("\n");
          const msgText = `🛒 ĐƠN ĐẶT MUA TỪ CHỢ TWIN\n${lines}\n💰 Tổng: ${formatPrice(subTotal)}\n📞 SĐT: ${phone}\n📍 Địa chỉ/Ghi chú: ${addr}`;
          const chatId = getChatId(me.uid, sellerUid);
          await addDoc(collection(db, "messages", chatId, "items"), {
            senderUid: me.uid,
            senderName: me.name || "Thành viên",
            text: msgText,
            createdAt: serverTimestamp()
          });
          pushNotification(sellerUid, {
            fromUid: me.uid,
            fromName: me.name,
            fromAvatar: me.avatar || DEFAULT_AVATAR,
            type: "message",
            text: `đã gửi đơn đặt mua ${list[0].title}${list.length > 1 ? ` (+${list.length - 1} món)` : ""}.`,
            link: `./messages.html?uid=${encodeURIComponent(me.uid)}`
          }).catch(() => {});
        }

        if (pendingOrderItems.length > 1 || loadCart().some((c) => pendingOrderItems.some((p) => p.id === c.id))) {
          const orderedIds = new Set(pendingOrderItems.map((p) => p.id));
          saveCart(loadCart().filter((c) => !orderedIds.has(c.id)));
        }

        document.getElementById("mk-order-form").reset();
        document.getElementById("mk-order-modal").classList.remove("open");
        document.getElementById("mk-detail-modal").classList.remove("open");
        showToast("Đã gửi đơn đặt mua tới tin nhắn của người bán!");
        if (firstSellerUid) {
          setTimeout(() => {
            window.location.href = `./messages.html?uid=${encodeURIComponent(firstSellerUid)}`;
          }, 900);
        }
      } catch (err) {
        showToast(friendlyError(err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Xác nhận gửi đơn cho người bán";
      }
    });

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        updateCartBadge();
        const urlId = new URLSearchParams(window.location.search).get("id");
        let openedFromUrl = false;
        onSnapshot(
          query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(160)),
          (snap) => {
            const list = [];
            snap.forEach((d) => {
              const data = { id: d.id, ...d.data() };
              if (data.postType === "market") list.push(data);
            });
            allItems = list;
            renderGrid();
            if (currentDetailId && document.getElementById("mk-detail-modal").classList.contains("open")) {
              openDetailModal(currentDetailId);
            } else if (urlId && !openedFromUrl) {
              openedFromUrl = true;
              if (allItems.some((x) => x.id === urlId)) openDetailModal(urlId);
            }
          },
          (err) => showToast(friendlyError(err))
        );
      }
    });
  </script>
</body>
</html>
