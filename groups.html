<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nhóm — Twin</title>
  <meta name="description" content="Twin — Mạng xã hội Liquid Glass kết nối bạn bè, chia sẻ khoảnh khắc, nhóm, trang và nhắn tin thời gian thực." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M17 20h30v7.5H36V48h-8V27.5H17z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body class="">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main" style="max-width:1080px;">
    <div class="twin-page-head">
      <div>
        <h1>Nhóm</h1>
        <p class="twin-post-meta" style="font-size:13.5px;">Yêu cầu tham gia cần được người tạo nhóm phê duyệt.</p>
      </div>
      <button id="btn-open-create-group" class="twin-btn twin-btn-primary">Tạo nhóm mới</button>
    </div>

    <section id="group-approvals-card" class="twin-card" style="display:none;">
      <h2 style="font-size:17px;margin-bottom:12px;">Yêu cầu chờ phê duyệt (Bạn là người tạo nhóm)</h2>
      <div id="group-approvals-list"></div>
    </section>

    <div id="groups-grid" class="twin-cards-grid"></div>

    <section id="group-detail-section" style="display:none;margin-top:24px;">
      <div class="twin-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <h2 id="gd-name" style="font-size:20px;"></h2>
            <p id="gd-desc" class="twin-post-meta"></p>
          </div>
          <button id="gd-close" class="twin-btn twin-btn-secondary twin-btn-sm">Đóng</button>
        </div>
        <div id="gd-composer" style="margin-top:14px;display:flex;gap:8px;">
          <input id="gd-post-input" class="twin-input" placeholder="Viết bài thảo luận trong nhóm..." />
          <button id="gd-post-btn" class="twin-btn twin-btn-primary">Đăng</button>
        </div>
      </div>
      <div id="gd-posts"></div>
    </section>
  </main>

  <div class="twin-modal-backdrop" id="group-modal">
    <div class="twin-modal">
      <h2 style="margin-bottom:14px;font-size:19px;">Tạo nhóm mới</h2>
      <form id="create-group-form" style="display:flex;flex-direction:column;gap:12px;">
        <input id="cg-name" class="twin-input" placeholder="Tên nhóm" required />
        <textarea id="cg-desc" class="twin-textarea" placeholder="Mô tả ngắn về nhóm..."></textarea>
        <label class="twin-btn twin-btn-secondary twin-btn-sm" style="cursor:pointer;">
          <span id="cg-cover-label">Chọn ảnh bìa nhóm (tùy chọn)</span>
          <input id="cg-cover" type="file" accept="image/*" hidden />
        </label>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
          <button type="button" id="cg-cancel" class="twin-btn twin-btn-secondary">Hủy</button>
          <button type="submit" class="twin-btn twin-btn-primary">Tạo nhóm</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import { renderPostList } from "./assets/js/post-ui.js";
    import {
      db,
      collection,
      doc,
      addDoc,
      updateDoc,
      query,
      where,
      orderBy,
      onSnapshot,
      arrayUnion,
      arrayRemove,
      serverTimestamp,
      uploadToCloudinary,
      pushNotification,
      DEFAULT_AVATAR,
      escapeHtml,
      toMillis,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    let me = null;
    let usersMap = new Map();
    let groupsList = [];
    let activeGroup = null;
    let unsubGroupPosts = null;
    let initialOpened = false;

    const modal = document.getElementById("group-modal");
    document.getElementById("btn-open-create-group").onclick = () => modal.classList.add("open");
    document.getElementById("cg-cancel").onclick = () => modal.classList.remove("open");
    document.getElementById("cg-cover").onchange = (e) => {
      document.getElementById("cg-cover-label").textContent = e.target.files[0]
        ? "Đã chọn: " + e.target.files[0].name
        : "Chọn ảnh bìa nhóm (tùy chọn)";
    };
    document.getElementById("gd-close").onclick = () => {
      document.getElementById("group-detail-section").style.display = "none";
      if (unsubGroupPosts) unsubGroupPosts();
      activeGroup = null;
    };

    function renderApprovals() {
      const card = document.getElementById("group-approvals-card");
      const listEl = document.getElementById("group-approvals-list");
      if (!me) return;

      const rows = [];
      groupsList.forEach((g) => {
        if (g.ownerUid === me.uid && Array.isArray(g.pendingMembers) && g.pendingMembers.length) {
          g.pendingMembers.forEach((reqUid) => {
            const u = usersMap.get(reqUid) || { uid: reqUid, name: "Thành viên", avatar: DEFAULT_AVATAR };
            rows.push({ group: g, user: u });
          });
        }
      });

      if (!rows.length) {
        card.style.display = "none";
        return;
      }
      card.style.display = "block";
      listEl.innerHTML = "";

      rows.forEach(({ group, user }) => {
        const div = document.createElement("div");
        div.className = "twin-request-row";
        div.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">
            <img class="twin-avatar twin-avatar-sm" src="${escapeHtml(user.avatar || DEFAULT_AVATAR)}" alt="" />
            <div>
              <div style="font-weight:700;font-size:14px;">${escapeHtml(user.name)}</div>
              <div class="twin-post-meta">Xin tham gia nhóm <strong>${escapeHtml(group.name)}</strong></div>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="twin-btn twin-btn-primary twin-btn-sm btn-approve">Duyệt</button>
            <button class="twin-btn twin-btn-secondary twin-btn-sm btn-reject">Từ chối</button>
          </div>
        `;
        div.querySelector(".btn-approve").onclick = async () => {
          try {
            await updateDoc(doc(db, "groups", group.id), {
              pendingMembers: arrayRemove(user.uid),
              members: arrayUnion(user.uid)
            });
            await pushNotification(user.uid, {
              fromUid: me.uid,
              fromName: me.name,
              fromAvatar: me.avatar,
              text: `đã duyệt bạn vào nhóm "${group.name}".`,
              link: `./groups.html?id=${encodeURIComponent(group.id)}`
            });
            showToast(`Đã duyệt ${user.name} vào nhóm ${group.name}!`);
          } catch (err) {
            showToast(friendlyError(err));
          }
        };
        div.querySelector(".btn-reject").onclick = async () => {
          try {
            await updateDoc(doc(db, "groups", group.id), {
              pendingMembers: arrayRemove(user.uid)
            });
            showToast("Đã từ chối yêu cầu tham gia.");
          } catch (err) {
            showToast(friendlyError(err));
          }
        };
        listEl.appendChild(div);
      });
    }

    function openGroupDetail(g) {
      activeGroup = g;
      const isMember = (g.members || []).includes(me.uid) || g.ownerUid === me.uid;
      const sec = document.getElementById("group-detail-section");
      sec.style.display = "block";
      document.getElementById("gd-name").textContent = g.name;
      document.getElementById("gd-desc").textContent = `${(g.members || []).length} thành viên${g.description ? " · " + g.description : ""}`;
      document.getElementById("gd-composer").style.display = isMember ? "flex" : "none";
      sec.scrollIntoView({ behavior: "smooth" });

      if (unsubGroupPosts) unsubGroupPosts();
      const list = document.getElementById("gd-posts");
      const q = query(collection(db, "posts"), where("groupId", "==", g.id));
      unsubGroupPosts = onSnapshot(q, (snap) => {
        const items = [];
        snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
        items.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || ((b.pinned && a.pinned) ? ((b.pinnedAt || 0) - (a.pinnedAt || 0)) : 0) || (toMillis(b.createdAt) - toMillis(a.createdAt)));
        const empty = isMember
          ? '<div class="twin-card" style="color:var(--text-3);text-align:center;">Chưa có bài viết nào trong nhóm này.</div>'
          : '<div class="twin-card" style="color:var(--text-3);text-align:center;">Bạn cần được người tạo nhóm duyệt tham gia để đăng bài trong nhóm.</div>';
        renderPostList(list, items, me, empty);
      }, (err) => showToast(friendlyError(err)));
    }

    function renderGroupsGrid() {
      const grid = document.getElementById("groups-grid");
      grid.innerHTML = "";
      if (!groupsList.length) {
        grid.innerHTML = '<div class="twin-card" style="color:var(--text-3);">Chưa có nhóm nào. Hãy tạo nhóm đầu tiên!</div>';
        return;
      }

      groupsList.forEach((g) => {
        const members = g.members || [];
        const pending = g.pendingMembers || [];
        const isOwner = g.ownerUid === me.uid;
        const isMember = members.includes(me.uid);
        const isPending = pending.includes(me.uid);

        let actionHtml = "";
        if (isOwner) {
          actionHtml = `<button class="twin-btn twin-btn-secondary twin-btn-sm btn-view" style="flex:1;">Quản lý &amp; Xem (${pending.length} chờ)</button>`;
        } else if (isMember) {
          actionHtml = `
            <button class="twin-btn twin-btn-secondary twin-btn-sm btn-leave">Rời nhóm</button>
            <button class="twin-btn twin-btn-primary twin-btn-sm btn-view" style="flex:1;">Mở nhóm</button>
          `;
        } else if (isPending) {
          actionHtml = `
            <button class="twin-btn twin-btn-secondary twin-btn-sm btn-cancel-req" style="flex:1;">Đang chờ duyệt (Hủy)</button>
          `;
        } else {
          actionHtml = `
            <button class="twin-btn twin-btn-primary twin-btn-sm btn-request" style="flex:1;">Xin tham gia</button>
            <button class="twin-btn twin-btn-secondary twin-btn-sm btn-view">Xem</button>
          `;
        }

        const card = document.createElement("div");
        card.className = "twin-entity-card";
        card.innerHTML = `
          ${g.coverUrl ? `<img class="twin-entity-cover" src="${escapeHtml(g.coverUrl)}" alt="" />` : `<div class="twin-entity-cover"></div>`}
          <div class="twin-entity-body">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
              <div style="font-weight:700;font-size:15.5px;">${escapeHtml(g.name)}</div>
              ${isOwner ? '<span class="twin-pill-tag">Chủ nhóm</span>' : isPending ? '<span class="twin-pill-tag twin-pill-warn">Chờ duyệt</span>' : ""}
            </div>
            <div class="twin-post-meta">${members.length} thành viên · Cần duyệt</div>
            <p style="font-size:13px;color:var(--text-2);flex:1;">${escapeHtml(g.description || "")}</p>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">${actionHtml}</div>
          </div>
        `;

        card.querySelector(".btn-request")?.addEventListener("click", async () => {
          try {
            await updateDoc(doc(db, "groups", g.id), { pendingMembers: arrayUnion(me.uid) });
            await pushNotification(g.ownerUid, {
              fromUid: me.uid,
              fromName: me.name,
              fromAvatar: me.avatar,
              text: `xin tham gia nhóm "${g.name}".`,
              link: `./groups.html?id=${encodeURIComponent(g.id)}`
            });
            showToast("Đã gửi yêu cầu tham gia! Chờ người tạo nhóm phê duyệt.");
          } catch (err) {
            showToast(friendlyError(err));
          }
        });

        card.querySelector(".btn-cancel-req")?.addEventListener("click", async () => {
          try {
            await updateDoc(doc(db, "groups", g.id), { pendingMembers: arrayRemove(me.uid) });
            showToast("Đã hủy yêu cầu tham gia nhóm.");
          } catch (err) {
            showToast(friendlyError(err));
          }
        });

        card.querySelector(".btn-leave")?.addEventListener("click", async () => {
          try {
            await updateDoc(doc(db, "groups", g.id), { members: arrayRemove(me.uid) });
            showToast("Đã rời nhóm.");
          } catch (err) {
            showToast(friendlyError(err));
          }
        });

        card.querySelector(".btn-view")?.addEventListener("click", () => openGroupDetail(g));
        grid.appendChild(card);
      });
    }

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;

        const targetId = new URLSearchParams(window.location.search).get("id");

        onSnapshot(collection(db, "users"), (snap) => {
          usersMap.clear();
          snap.forEach((d) => usersMap.set(d.id, d.data()));
          renderApprovals();
        }, () => {});

        document.getElementById("create-group-form").onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById("cg-name").value.trim();
          const description = document.getElementById("cg-desc").value.trim();
          const coverFile = document.getElementById("cg-cover").files[0];
          const submitBtn = e.target.querySelector('button[type="submit"]');
          if (submitBtn.disabled) return;
          submitBtn.disabled = true;
          try {
            let coverUrl = "";
            if (coverFile) coverUrl = await uploadToCloudinary(coverFile);
            await addDoc(collection(db, "groups"), {
              name,
              description,
              coverUrl,
              ownerUid: me.uid,
              members: [me.uid],
              pendingMembers: [],
              createdAt: serverTimestamp()
            });
            e.target.reset();
            document.getElementById("cg-cover-label").textContent = "Chọn ảnh bìa nhóm (tùy chọn)";
            modal.classList.remove("open");
            showToast("Đã tạo nhóm mới!");
          } catch (err) {
            showToast(friendlyError(err));
          } finally {
            submitBtn.disabled = false;
          }
        };

        const publishGroupPost = async () => {
          if (!activeGroup) return;
          const input = document.getElementById("gd-post-input");
          const content = input.value.trim();
          if (!content) return;
          input.value = "";
          try {
            await addDoc(collection(db, "posts"), {
              authorUid: me.uid,
              authorName: me.name,
              authorAvatar: me.avatar || DEFAULT_AVATAR,
              groupId: activeGroup.id,
              groupName: activeGroup.name,
              content,
              pinned: false,
              reactions: {},
              comments: [],
              createdAt: serverTimestamp()
            });
            showToast("Đã đăng bài trong nhóm!");
          } catch (err) {
            input.value = content;
            showToast(friendlyError(err));
          }
        };
        document.getElementById("gd-post-btn").onclick = publishGroupPost;
        document.getElementById("gd-post-input").addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.isComposing) {
            e.preventDefault();
            publishGroupPost();
          }
        });

        onSnapshot(query(collection(db, "groups"), orderBy("createdAt", "desc")), (snap) => {
          groupsList = [];
          snap.forEach((d) => groupsList.push({ id: d.id, ...d.data() }));
          renderGroupsGrid();
          renderApprovals();
          if (activeGroup) {
            const refreshed = groupsList.find((item) => item.id === activeGroup.id);
            if (refreshed) activeGroup = refreshed;
          }
          if (!initialOpened && targetId) {
            const found = groupsList.find((item) => item.id === targetId);
            if (found) {
              initialOpened = true;
              openGroupDetail(found);
            }
          }
        }, (err) => showToast(friendlyError(err)));
      }
    });
  </script>
</body>
</html>
