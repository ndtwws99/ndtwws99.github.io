<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Twin</title>
  <meta name="description" content="Xem và đăng tải video ngắn (Tin) và video bài đăng trên mạng xã hội Twin." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='ig' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23feda75'/%3E%3Cstop offset='25%25' stop-color='%23fa7e1e'/%3E%3Cstop offset='52%25' stop-color='%23d62976'/%3E%3Cstop offset='78%25' stop-color='%23962fbf'/%3E%3Cstop offset='100%25' stop-color='%234f5bd5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23ig)'/%3E%3Cellipse cx='25' cy='15' rx='15' ry='7' fill='%23ffffff' opacity='.22'/%3E%3Cpath d='M18.5 21.5h27v6.6h-9.7v19.4h-7.6V28.1h-9.7z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
  <link rel="modulepreload" href="./assets/js/firebase-service.js" />
  <link rel="modulepreload" href="./assets/js/layout.js" />
  <link rel="modulepreload" href="./assets/js/post-ui.js" />
</head>
<body class="page-reels">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main twin-reels-main">
    <div class="twin-reels-toolbar">
      <div class="twin-seg-tabs" role="tablist" aria-label="Loại video">
        <button type="button" id="reels-tab-short" class="twin-seg-tab active" role="tab" aria-selected="true">Video ngắn</button>
        <button type="button" id="reels-tab-video" class="twin-seg-tab" role="tab" aria-selected="false">Video bài đăng</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button type="button" id="reels-autoscroll-btn" class="twin-btn twin-btn-secondary twin-btn-sm" title="Tự động chuyển sang video tiếp theo khi phát xong">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/><path d="M5 20h14"/></svg>
          <span>Tự chuyển</span>
        </button>
        <button type="button" id="reels-open-upload" class="twin-btn twin-btn-primary twin-btn-sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Đăng video</span>
        </button>
      </div>
    </div>

    <!-- Tab 1: Video ngắn từ mục Tin (Stories video) -->
    <section id="reels-short-panel" class="twin-reels-stage-wrap">
      <div id="reels-scroller" class="twin-reels-scroller"></div>
      <div class="twin-reels-nav-arrows" id="reels-nav-arrows" style="display:none;">
        <button type="button" id="reels-prev-btn" class="twin-icon-btn" title="Video ngắn trước" aria-label="Video ngắn trước">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        </button>
        <button type="button" id="reels-next-btn" class="twin-icon-btn" title="Video ngắn tiếp theo" aria-label="Video ngắn tiếp theo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </section>

    <!-- Tab 2: Danh sách Video bài đăng -->
    <section id="reels-video-panel" class="twin-videos-feed" style="display:none;">
      <div id="reels-video-list"></div>
    </section>
  </main>

  <!-- Modal Đăng Video ngắn (Tin) / Video thường (Bài đăng) -->
  <div class="twin-modal-backdrop" id="upload-video-modal">
    <div class="twin-modal" style="max-width:480px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="font-size:19px;font-weight:800;">Đăng video mới</h2>
        <button type="button" id="uv-close-btn" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>

      <form id="uv-form" style="display:flex;flex-direction:column;gap:12px;">
        <div class="twin-seg-tabs" style="width:100%;display:grid;grid-template-columns:1fr 1fr;">
          <button type="button" id="uv-type-short" class="twin-seg-tab active">Video ngắn</button>
          <button type="button" id="uv-type-video" class="twin-seg-tab">Video bài đăng</button>
        </div>

        <p id="uv-policy-hint" class="twin-post-meta" style="margin:0;padding:8px 11px;border-radius:10px;background:var(--surface-subtle);border:1px solid var(--border-subtle);line-height:1.45;"></p>

        <div id="uv-preview-box" class="twin-composer-video-preview is-short" style="display:none;position:relative;">
          <video id="uv-preview-video" class="twin-post-video" controls playsinline muted></video>
          <button type="button" id="uv-remove-file" class="twin-icon-btn" style="position:absolute;top:8px;right:8px;width:30px;height:30px;background:rgba(0,0,0,0.65);color:#fff;" title="Bỏ chọn video">✕</button>
        </div>

        <label class="twin-btn twin-btn-secondary" style="width:100%;cursor:pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="14" height="13" rx="2.5"/><path d="m16.5 10 5-3v10l-5-3"/></svg>
          <span id="uv-file-label">Chọn video từ thiết bị</span>
          <input id="uv-file-input" type="file" accept="video/*" hidden />
        </label>

        <div id="uv-meta-row" class="twin-post-meta" style="display:none;font-weight:600;"></div>

        <div id="uv-privacy-wrap" class="twin-inline-privacy-row">
          <span class="twin-field-label" style="margin:0;">Quyền xem</span>
          <div class="twin-feeling-pill twin-privacy-pill" title="Quyền xem video">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5a14.5 14.5 0 0 1 0 19 14.5 14.5 0 0 1 0-19Z"/></svg>
            <select id="uv-privacy" class="twin-feeling-select" aria-label="Quyền xem video">
              <option value="public">Công khai</option>
              <option value="friends">Bạn bè</option>
              <option value="private">Riêng tư</option>
            </select>
          </div>
        </div>

        <div>
          <label class="twin-field-label" for="uv-caption">Mô tả / Chú thích</label>
          <textarea id="uv-caption" class="twin-textarea" rows="3" maxlength="1000" placeholder="Viết mô tả cho video của bạn..."></textarea>
        </div>

        <div id="uv-progress" class="twin-upload-progress" style="display:none;">
          <div class="twin-upload-progress-track">
            <div id="uv-progress-fill" class="twin-upload-progress-fill" style="width:0%"></div>
          </div>
          <span id="uv-progress-text" class="twin-post-meta">Đang tải lên 0%...</span>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
          <button type="button" id="uv-cancel-btn" class="twin-btn twin-btn-secondary">Hủy</button>
          <button type="submit" id="uv-submit-btn" class="twin-btn twin-btn-primary">Đăng ngay</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Trả lời Tin Video Ngắn -->
  <div class="twin-modal-backdrop" id="reel-reply-modal">
    <div class="twin-modal" style="max-width:440px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 id="rr-title" style="font-size:18px;font-weight:800;">Phản hồi tin ngắn</h2>
        <button type="button" id="rr-close" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>
      <div id="rr-list" class="twin-reel-cmt-list" style="margin-bottom:12px;"></div>
      <form id="rr-form" style="display:flex;gap:8px;">
        <input id="rr-input" class="twin-input" type="text" maxlength="400" placeholder="Nhập phản hồi cho tin ngắn này..." required />
        <button type="submit" id="rr-send" class="twin-btn twin-btn-primary twin-btn-sm">Gửi</button>
      </form>
      <div id="rr-guest-hint" class="twin-guest-inline-note" style="display:none;">
        Chế độ Khách chỉ xem phản hồi. <a href="./login.html">Đăng nhập</a> để trả lời tin ngắn.
      </div>
    </div>
  </div>

  <script type="module">
    import { initTwinPage, getSiteSettings } from "./assets/js/layout.js";
    import { renderPostList } from "./assets/js/post-ui.js";
    import {
      db,
      collection,
      doc,
      getDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      arrayUnion,
      arrayRemove,
      increment,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      uploadVideoToCloudinary,
      readVideoMetadata,
      getVideoPosterUrl,
      formatDuration,
      pushNotification,
      isUserAdmin,
      isGuestUser,
      requireMemberAction,
      renderAdminIconHtml,
      getChatId,
      getStoryPrivacyMeta,
      canViewStory,
      DEFAULT_AVATAR,
      escapeHtml,
      formatTime,
      toMillis,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    const ICON = {
      heart: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
      heartFilled: `<svg width="24" height="24" viewBox="0 0 24 24" fill="#ff3040" stroke="#ff3040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
      reply: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-4.8A8.5 8.5 0 1 1 21 11.5Z"/></svg>`,
      bookmark: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h11A1.5 1.5 0 0 1 19 5.5v15l-7-4-7 4v-15A1.5 1.5 0 0 1 6.5 4Z"/></svg>`,
      bookmarkFilled: `<svg width="22" height="22" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h11A1.5 1.5 0 0 1 19 5.5v15l-7-4-7 4v-15A1.5 1.5 0 0 1 6.5 4Z"/></svg>`,
      share: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 13.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4.5"/></svg>`,
      trash: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M18.5 6.5 17.6 19a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8L5.5 6.5"/><path d="M9 6.5v-2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
      muted: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>`,
      sound: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5.5a9.5 9.5 0 0 1 0 13"/></svg>`,
      play: `<svg width="34" height="34" viewBox="0 0 24 24" fill="#ffffff"><polygon points="6 4 20 12 6 20 6 4"/></svg>`
    };

    let me = null;
    let rawVideoStories = [];
    let activeVideoStories = [];
    let allVideoPosts = [];
    let activeTab = new URLSearchParams(window.location.search).get("tab") === "video" ? "video" : "short";
    let targetReelId = new URLSearchParams(window.location.search).get("id") || "";
    let globalMuted = true;
    let globalSpeed = 1;
    let autoScrollNext = false;
    let cleanMode = false;
    let reelObserver = null;

    const tabShortBtn = document.getElementById("reels-tab-short");
    const tabVideoBtn = document.getElementById("reels-tab-video");
    const shortPanel = document.getElementById("reels-short-panel");
    const videoPanel = document.getElementById("reels-video-panel");
    const scroller = document.getElementById("reels-scroller");
    const navArrows = document.getElementById("reels-nav-arrows");
    const videoListEl = document.getElementById("reels-video-list");

    function pauseAllReelVideos() {
      scroller.querySelectorAll("video").forEach((v) => {
        try { v.pause(); } catch {}
      });
    }

    function setTab(next) {
      activeTab = next === "video" ? "video" : "short";
      tabShortBtn.classList.toggle("active", activeTab === "short");
      tabShortBtn.setAttribute("aria-selected", activeTab === "short" ? "true" : "false");
      tabVideoBtn.classList.toggle("active", activeTab === "video");
      tabVideoBtn.setAttribute("aria-selected", activeTab === "video" ? "true" : "false");
      shortPanel.style.display = activeTab === "short" ? "flex" : "none";
      videoPanel.style.display = activeTab === "video" ? "block" : "none";
      if (activeTab === "video") {
        pauseAllReelVideos();
      } else {
        setupReelAutoPlay();
      }
    }

    tabShortBtn.onclick = () => setTab("short");
    tabVideoBtn.onclick = () => setTab("video");

    const autoScrollBtn = document.getElementById("reels-autoscroll-btn");
    const syncAutoScrollUi = () => {
      if (!autoScrollBtn) return;
      autoScrollBtn.classList.toggle("twin-btn-primary", autoScrollNext);
      autoScrollBtn.classList.toggle("twin-btn-secondary", !autoScrollNext);
      scroller.querySelectorAll("video.twin-reel-video").forEach((v) => {
        v.loop = !autoScrollNext;
      });
    };
    if (autoScrollBtn) {
      autoScrollBtn.onclick = () => {
        autoScrollNext = !autoScrollNext;
        syncAutoScrollUi();
        showToast(autoScrollNext ? "Đã bật Tự động chuyển video (Auto-scroll)." : "Đã tắt Tự động chuyển video.");
      };
    }

    function syncAllSpeedButtons() {
      scroller.querySelectorAll(".btn-reel-speed").forEach((b) => {
        b.textContent = `${globalSpeed}x`;
      });
      scroller.querySelectorAll("video.twin-reel-video").forEach((v) => {
        if (!v.dataset.holding2x) v.playbackRate = globalSpeed;
      });
    }

    function syncCleanModeUi() {
      scroller.querySelectorAll(".twin-reel-frame").forEach((f) => {
        f.classList.toggle("clean-mode", cleanMode);
      });
    }

    function getActiveReelCard() {
      const cards = [...scroller.querySelectorAll(".twin-reel-card")];
      if (!cards.length) return null;
      const top = scroller.scrollTop;
      const h = scroller.clientHeight || 1;
      const idx = Math.max(0, Math.min(cards.length - 1, Math.round(top / h)));
      return cards[idx];
    }

    document.addEventListener("keydown", (e) => {
      if (activeTab !== "short") return;
      if (document.querySelector(".twin-modal-backdrop.open")) return;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
      const card = getActiveReelCard();
      if (!card) return;
      const v = card.querySelector("video.twin-reel-video");
      if (e.key === "ArrowDown") {
        e.preventDefault();
        scroller.scrollBy({ top: scroller.clientHeight, behavior: "smooth" });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        scroller.scrollBy({ top: -scroller.clientHeight, behavior: "smooth" });
      } else if (e.key === " " && v) {
        e.preventDefault();
        if (v.paused) v.play().catch(() => {});
        else v.pause();
      } else if (e.key.toLowerCase() === "m") {
        globalMuted = !globalMuted;
        syncAllMuteButtons();
      } else if (e.key.toLowerCase() === "l") {
        card.querySelector(".btn-reel-like")?.click();
      }
    });

    // ---- Upload Video Modal ----
    const uploadModal = document.getElementById("upload-video-modal");
    const uvTypeShort = document.getElementById("uv-type-short");
    const uvTypeVideo = document.getElementById("uv-type-video");
    const uvPolicyHint = document.getElementById("uv-policy-hint");
    const uvFileInput = document.getElementById("uv-file-input");
    const uvFileLabel = document.getElementById("uv-file-label");
    const uvPreviewBox = document.getElementById("uv-preview-box");
    const uvPreviewVideo = document.getElementById("uv-preview-video");
    const uvMetaRow = document.getElementById("uv-meta-row");
    const uvPrivacyWrap = document.getElementById("uv-privacy-wrap");
    const uvPrivacySelect = document.getElementById("uv-privacy");
    const uvCaption = document.getElementById("uv-caption");
    const uvProgress = document.getElementById("uv-progress");
    const uvProgressFill = document.getElementById("uv-progress-fill");
    const uvProgressText = document.getElementById("uv-progress-text");
    const uvSubmitBtn = document.getElementById("uv-submit-btn");

    const replyModal = document.getElementById("reel-reply-modal");
    const rrTitle = document.getElementById("rr-title");
    const rrList = document.getElementById("rr-list");
    const rrForm = document.getElementById("rr-form");
    const rrInput = document.getElementById("rr-input");
    const rrSendBtn = document.getElementById("rr-send");
    const rrGuestHint = document.getElementById("rr-guest-hint");
    let replyingStoryId = null;

    document.getElementById("rr-close").onclick = () => {
      replyModal.classList.remove("open");
      replyingStoryId = null;
    };

    let uvMode = "short";
    let uvFile = null;
    let uvDuration = 0;
    let uvObjUrl = "";

    function updateUploadPolicyUi() {
      const cfg = getSiteSettings();
      const admin = isUserAdmin(me);
      const maxSizeMb = cfg.maxVideoSizeMb || 100;
      const maxShortSec = cfg.maxShortVideoSec || 60;
      const storyHours = cfg.storyDurationHours || 24;

      if (!uvFile) {
        uvFileLabel.textContent = `Chọn video từ thiết bị (tối đa ${maxSizeMb}MB)`;
      }

      if (cfg.readOnlyMode && !admin) {
        uvPolicyHint.textContent = "Quản trị viên đang bật chế độ chỉ đọc. Hiện chỉ Quản trị viên mới có thể đăng nội dung mới.";
        uvSubmitBtn.disabled = true;
        return;
      }

      if (uvMode === "short") {
        if (!cfg.allowStories && !admin) {
          uvPolicyHint.textContent = "Quản trị viên hiện đã tạm tắt tính năng đăng Tin video ngắn.";
          uvSubmitBtn.disabled = true;
        } else {
          uvPolicyHint.textContent = `Video ngắn sẽ đăng vào mục Tin · thời lượng tối đa ${maxShortSec} giây · hiển thị trong ${storyHours} giờ · tối đa ${maxSizeMb}MB.`;
          uvSubmitBtn.disabled = false;
        }
      } else {
        if (!cfg.allowVideoPosts && !admin) {
          uvPolicyHint.textContent = "Quản trị viên hiện đã tạm tắt tính năng đăng bài viết video.";
          uvSubmitBtn.disabled = true;
        } else {
          uvPolicyHint.textContent = `Video sẽ đăng lên Bảng tin & mục Video · dung lượng tối đa ${maxSizeMb}MB.`;
          uvSubmitBtn.disabled = false;
        }
      }
    }

    function setUploadMode(mode) {
      uvMode = mode === "video" ? "video" : "short";
      uvTypeShort.classList.toggle("active", uvMode === "short");
      uvTypeVideo.classList.toggle("active", uvMode === "video");
      uvPreviewBox.classList.toggle("is-short", uvMode === "short");
      if (uvPrivacyWrap) uvPrivacyWrap.style.display = "flex";
      updateUploadPolicyUi();

      if (uvFile && uvMode === "short" && uvDuration > 0) {
        const maxSec = getSiteSettings().maxShortVideoSec || 60;
        if (uvDuration > maxSec + 0.5) {
          showToast(`Video này dài ${formatDuration(uvDuration)}, vượt giới hạn ${maxSec} giây của Tin video ngắn.`);
        }
      }
    }
    uvTypeShort.onclick = () => setUploadMode("short");
    uvTypeVideo.onclick = () => setUploadMode("video");

    function clearUploadSelection() {
      if (uvObjUrl) {
        URL.revokeObjectURL(uvObjUrl);
        uvObjUrl = "";

    function setupReelAutoPlay() {
      if (reelObserver) {
        reelObserver.disconnect();
        reelObserver = null;
      }
      if (activeTab !== "short") return;
      const cards = scroller.querySelectorAll(".twin-reel-card");
      if (!cards.length) return;
      reelObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const card = entry.target;
            const video = card.querySelector("video");
            const indicator = card.querySelector(".twin-reel-play-indicator");
            if (!video) return;
            if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
              video.muted = globalMuted;
              video.play().then(() => {
                indicator?.classList.remove("visible");
              }).catch(() => {
                indicator?.classList.add("visible");
              });
            } else {
              video.pause();
            }
          });
        },
        { root: scroller, threshold: [0.25, 0.65] }
      );
      cards.forEach((c) => reelObserver.observe(c));
    }

      const heartLayer = card.querySelector(".twin-reel-heart-layer");
      const discEl = card.querySelector(".twin-reel-disc");
      const scrubber = card.querySelector(".twin-reel-scrubber");
      const scrubberFill = card.querySelector(".twin-reel-scrubber-fill");

      video.loop = !autoScrollNext;
      video.playbackRate = globalSpeed;
      if (cleanMode) frame.classList.add("clean-mode");

      const spawnTapHeart = (clientX, clientY) => {
        const rect = frame.getBoundingClientRect();
        const x = clientX ? clientX - rect.left : rect.width / 2;
        const y = clientY ? clientY - rect.top : rect.height / 2;
        const h = document.createElement("span");
        h.className = "twin-reel-tap-heart";
        h.style.left = `${x}px`;
        h.style.top = `${y}px`;
        h.innerHTML = `<svg width="74" height="74" viewBox="0 0 24 24" fill="#ff3040" stroke="#ffffff" stroke-width="1.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
        heartLayer.appendChild(h);
        setTimeout(() => h.remove(), 750);
      };

      const ensureLikedOnDoubleTap = async () => {
        if (!me || isGuestUser(me)) return;
        const latest = activeVideoStories.find((s) => s.id === story.id) || story;
        const likes = Array.isArray(latest.likes) ? latest.likes : [];
        if (likes.includes(me.uid)) return;
        try {
          await updateDoc(doc(db, "stories", story.id), { likes: arrayUnion(me.uid) });
          if (latest.authorUid && latest.authorUid !== me.uid) {
            pushNotification(latest.authorUid, {

              fromName: me.name,
              fromAvatar: me.avatar || DEFAULT_AVATAR,
              type: "reaction",

              link: `./reels.html?id=${encodeURIComponent(story.id)}`
            }).catch(() => {});
          }
        } catch {}
      };

      video.addEventListener("play", () => {
        playIndicator.classList.remove("visible");
        discEl?.classList.add("spinning");
      });
      video.addEventListener("pause", () => {
        discEl?.classList.remove("spinning");
      });
      video.addEventListener("timeupdate", () => {
        if (Number.isFinite(video.duration) && video.duration > 0) {
          scrubberFill.style.width = `${(video.currentTime / video.duration) * 100}%`;
        }
      });
      video.addEventListener("ended", () => {
        if (autoScrollNext) {
          scroller.scrollBy({ top: scroller.clientHeight, behavior: "smooth" });
        }
      });

      // Interactive progress bar scrubbing
      scrubber.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!Number.isFinite(video.duration) || video.duration <= 0) return;
        const rect = scrubber.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        video.currentTime = ratio * video.duration;
        scrubberFill.style.width = `${ratio * 100}%`;
      });

      // Press & hold for 2x speed + Double-tap to Heart + Single tap Play/Pause
      let holdTimer = null;
      let wasHolding2x = false;
      let lastTapTime = 0;
      let singleTapTimer = null;

      const releaseHold2x = () => {
        if (holdTimer) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }
        if (video.dataset.holding2x === "1") {
          delete video.dataset.holding2x;
          video.playbackRate = globalSpeed;
          speedPill.classList.remove("visible");
          setTimeout(() => { wasHolding2x = false; }, 60);
        }
      };

      video.addEventListener("pointerdown", () => {
        wasHolding2x = false;
        holdTimer = setTimeout(() => {
          holdTimer = null;
          if (!video.paused) {
            wasHolding2x = true;
            video.dataset.holding2x = "1";
            video.playbackRate = 2;
            speedPill.classList.add("visible");
          }
        }, 360);
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach((ev) =>
        video.addEventListener(ev, releaseHold2x)
      );

      video.addEventListener("click", (e) => {
        if (wasHolding2x) return;
        const now = Date.now();
        if (now - lastTapTime < 280) {
          clearTimeout(singleTapTimer);
          lastTapTime = 0;
          spawnTapHeart(e.clientX, e.clientY);
          ensureLikedOnDoubleTap();
          return;
        }
        lastTapTime = now;
        singleTapTimer = setTimeout(() => {
          if (video.paused) {
            video.play().catch(() => {});
            playIndicator.classList.remove("visible");
          } else {
            video.pause();
            playIndicator.classList.add("visible");
          }
        }, 230);
      });

      card.querySelector(".btn-reel-speed").onclick = (e) => {
        e.stopPropagation();
        globalSpeed = globalSpeed === 1 ? 1.5 : globalSpeed === 1.5 ? 2 : 1;
        syncAllSpeedButtons();
        showToast(`Tốc độ phát: ${globalSpeed}x`);
      };

      card.querySelector(".btn-reel-clean").onclick = (e) => {
        e.stopPropagation();
        cleanMode = !cleanMode;
        syncCleanModeUi();
      };

      card.querySelector(".btn-reel-mute").onclick = (e) => {
        e.stopPropagation();
        globalMuted = !globalMuted;
        syncAllMuteButtons();
        if (!globalMuted && video.paused) {
          video.play().catch(() => {});
          playIndicator.classList.remove("visible");
        }
      };

      card.querySelector(".btn-reel-like").onclick = async (e) => {
        e.stopPropagation();
        if (!requireMemberAction(me, "thả tim tin video ngắn")) return;
        const latest = activeVideoStories.find((s) => s.id === story.id) || story;
        const likes = Array.isArray(latest.likes) ? latest.likes : [];
        const already = likes.includes(me.uid);
        try {
          await updateDoc(doc(db, "stories", story.id), {
            likes: already ? arrayRemove(me.uid) : arrayUnion(me.uid)
          });
          if (!already && latest.authorUid && latest.authorUid !== me.uid) {
            pushNotification(latest.authorUid, {
              fromUid: me.uid,
              fromName: me.name,
              fromAvatar: me.avatar || DEFAULT_AVATAR,
              type: "reaction",
              storyId: story.id,
              text: "đã thả tim tin video ngắn của bạn ❤️",
              link: `./reels.html?id=${encodeURIComponent(story.id)}`
            }).catch(() => {});
          }
        } catch (err) {
          showToast(friendlyError(err));
        }
      };

      card.querySelector(".btn-reel-reply").onclick = (e) => {
        e.stopPropagation();
        const latest = activeVideoStories.find((s) => s.id === story.id) || story;
        openReplyModal(latest);
      };

      card.querySelector(".btn-reel-save").onclick = async (e) => {
        e.stopPropagation();
        if (!requireMemberAction(me, "lưu tin video ngắn")) return;
        const latest = activeVideoStories.find((s) => s.id === story.id) || story;
        const savedBy = Array.isArray(latest.savedBy) ? latest.savedBy : [];
        const already = savedBy.includes(me.uid);
        try {
          await updateDoc(doc(db, "stories", story.id), {
            savedBy: already ? arrayRemove(me.uid) : arrayUnion(me.uid)
          });
          updateDoc(doc(db, "users", me.uid), {
            savedStories: already ? arrayRemove(story.id) : arrayUnion(story.id)
          }).catch(() => {});
          showToast(already ? "Đã bỏ lưu tin." : "Đã lưu tin!");
        } catch (err) {
          showToast(friendlyError(err));
        }
      };

      card.querySelector(".btn-reel-share").onclick = async (e) => {
        e.stopPropagation();
        const url = new URL("./reels.html", window.location.href);
        url.search = `?id=${encodeURIComponent(story.id)}`;
        try {
          await navigator.clipboard.writeText(url.href);
          showToast("Đã sao chép liên kết tin video ngắn!");
        } catch {
          window.prompt("Sao chép liên kết:", url.href);
        }
        if (me && !isGuestUser(me)) {
          updateDoc(doc(db, "stories", story.id), { sharesCount: increment(1) }).catch(() => {});
        }
      };

      const delBtn = card.querySelector(".btn-reel-del");
      if (delBtn) {
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          if (!(await twinConfirm({ title: "Xóa tin video ngắn", message: "Bạn có chắc muốn xóa tin video ngắn này?", confirmText: "Xóa" }))) return;
          try {
            await deleteDoc(doc(db, "stories", story.id));
            showToast("Đã xóa tin video ngắn.");
          } catch (err) {
            showToast(friendlyError(err));
          }
        };
      }

      syncReelDynamicState(card, story);
      return card;
    }

    function filterAndRenderShortStories() {
      const cfg = getSiteSettings();
      const maxAgeMs = (cfg.storyDurationHours || 24) * 3600000;
      const now = Date.now();
      activeVideoStories = rawVideoStories
        .filter((s) => {
          if (!(s.type === "video" || s.videoUrl)) return false;
          if (!canViewStory(s, me)) return false;
          const ts = toMillis(s.createdAt);
          if (!ts) return true;
          return now - ts <= maxAgeMs;
        })
        .sort((a, b) => (toMillis(b.createdAt) || now) - (toMillis(a.createdAt) || now));

      renderShorts(activeVideoStories);
    }

    function renderShorts(shorts) {
      const cfg = getSiteSettings();
      if (!shorts.length) {
        renderedReelMap.clear();
        navArrows.style.display = "none";
        scroller.innerHTML = `
          <div class="twin-card twin-reels-empty">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3);margin-bottom:10px;"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18"/><path d="M8.5 3 11 9"/><path d="M14.5 3 17 9"/><polygon points="10.2 12.2 15.5 15.2 10.2 18.2 10.2 12.2" fill="currentColor" stroke="none"/></svg>
            <h3 style="font-size:17px;font-weight:700;margin-bottom:6px;">Chưa có tin video ngắn nào</h3>
            <p class="twin-post-meta" style="margin-bottom:16px;">Tin video ngắn tối đa ${cfg.maxShortVideoSec || 60} giây và hiển thị trong ${cfg.storyDurationHours || 24} giờ.</p>
            <button type="button" id="reels-empty-upload" class="twin-btn twin-btn-primary">Đăng tin video ngắn</button>
          </div>
        `;
        document.getElementById("reels-empty-upload").onclick = () => openUploadModal("short");
        return;
      }

      [...scroller.children].forEach((ch) => {
        if (!ch.dataset.reelId) ch.remove();
      });

      const seen = new Set();
      let prev = null;
      shorts.forEach((s) => {
        let card = renderedReelMap.get(s.id);
        if (!card) {
          card = createReelCard(s);
          renderedReelMap.set(s.id, card);
        } else {
          syncReelDynamicState(card, s);
        }
        seen.add(s.id);
        const want = prev ? prev.nextSibling : scroller.firstChild;
        if (card !== want) scroller.insertBefore(card, want);
        prev = card;
      });
      for (const [id, card] of renderedReelMap) {
        if (!seen.has(id)) {
          card.remove();
          renderedReelMap.delete(id);
        }
      }

      navArrows.style.display = shorts.length > 1 ? "flex" : "none";
      setupReelAutoPlay();

      if (targetReelId) {
        const targetCard = renderedReelMap.get(targetReelId);
        if (targetCard) {
          targetReelId = "";
          requestAnimationFrame(() => targetCard.scrollIntoView({ behavior: "smooth", block: "start" }));
        } else if (rawVideoStories.length) {
          const missingId = targetReelId;
          targetReelId = "";
          focusReelById(missingId);
        }
      }
    }

    async function focusReelById(reelId) {
      if (!reelId) return;
      setTab("short");
      const existing = renderedReelMap.get(reelId);
      if (existing) {
        requestAnimationFrame(() => existing.scrollIntoView({ behavior: "smooth", block: "start" }));
        return;
      }
      targetReelId = reelId;
      try {
        const snap = await getDoc(doc(db, "stories", reelId));
        if (snap.exists()) {
          const data = { id: snap.id, ...snap.data() };
          if ((data.type === "video" || data.videoUrl) && !rawVideoStories.some((s) => s.id === data.id)) {
            rawVideoStories = [data, ...rawVideoStories];
            activeVideoStories = [data, ...activeVideoStories.filter((s) => s.id !== data.id)];
            renderShorts(activeVideoStories);
          }
        }
      } catch {}
    }

    window.addEventListener("twin-open-reel", (e) => {
      if (e.detail?.reelId) focusReelById(e.detail.reelId);
    });

    function renderVideos(videos) {
      const empty = `
        <div class="twin-card" style="text-align:center;padding:36px 20px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3);margin-bottom:10px;"><rect x="2.5" y="5.5" width="14" height="13" rx="2.5"/><path d="m16.5 10 5-3v10l-5-3"/></svg>
          <h3 style="font-size:17px;font-weight:700;margin-bottom:6px;">Chưa có video nào</h3>
          <p class="twin-post-meta" style="margin-bottom:16px;">Tải lên video từ thiết bị để chia sẻ với bạn bè trên Twin.</p>
          <button type="button" id="videos-empty-upload" class="twin-btn twin-btn-primary">Đăng video đầu tiên</button>
        </div>
      `;
      renderPostList(videoListEl, videos, me, empty);
      const emptyBtn = document.getElementById("videos-empty-upload");
      if (emptyBtn) emptyBtn.onclick = () => openUploadModal("video");
    }

    window.addEventListener("twin-site-settings-changed", () => {
      updateUploadPolicyUi();
      filterAndRenderShortStories();
    });

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;
        const guest = isGuestUser(me);
        if (guest) {
          const upBtn = document.getElementById("reels-open-upload");
          if (upBtn) upBtn.style.display = "none";
        }
        setTab(activeTab);
        updateUploadPolicyUi();

        onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "desc"), limit(80)), (snap) => {
          rawVideoStories = [];
          snap.forEach((d) => {
            const s = { id: d.id, ...d.data() };
            if (s.type === "video" || s.videoUrl) rawVideoStories.push(s);
          });
          filterAndRenderShortStories();
        }, (err) => {
          if (guest && err?.code === "permission-denied") {
            filterAndRenderShortStories();
            return;
          }
          showToast(friendlyError(err));
        });

        onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(200)), (snap) => {
          allVideoPosts = [];
          snap.forEach((d) => {
            const p = { id: d.id, ...d.data() };
            if (p.videoUrl && canViewPost(p, me)) allVideoPosts.push(p);
          });
          allVideoPosts.sort((a, b) => toMillis(b.createdAt) - toMillis(a.createdAt));
          renderVideos(allVideoPosts);
        }, (err) => {
          if (guest && err?.code === "permission-denied") {
            renderVideos([]);
            return;
          }
          showToast(friendlyError(err));
        });
      }
    });
  </script>
</body>
</html>
