<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Video & Video ngắn — Twin</title>
  <meta name="description" content="Xem và đăng tải video ngắn (Reels) và video trên mạng xã hội Twin." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23007aff'/%3E%3Cstop offset='100%25' stop-color='%235856d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Cpath d='M19 21h26v6H35.5v18h-7V27H19z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/twin.css" />
</head>
<body class="page-reels">
  <header id="twin-header" class="twin-header"></header>

  <main class="twin-main twin-reels-main">
    <div class="twin-reels-toolbar">
      <div class="twin-seg-tabs" role="tablist" aria-label="Loại video">
        <button type="button" id="reels-tab-short" class="twin-seg-tab active" role="tab" aria-selected="true">Video ngắn</button>
        <button type="button" id="reels-tab-video" class="twin-seg-tab" role="tab" aria-selected="false">Video</button>
      </div>
      <button type="button" id="reels-open-upload" class="twin-btn twin-btn-primary twin-btn-sm">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Đăng video</span>
      </button>
    </div>

    <!-- Tab 1: Video ngắn (Reels dọc kiểu Instagram) -->
    <section id="reels-short-panel" class="twin-reels-stage-wrap">
      <div id="reels-scroller" class="twin-reels-scroller"></div>
      <div class="twin-reels-nav-arrows" id="reels-nav-arrows" style="display:none;">
        <button type="button" id="reels-prev-btn" class="twin-icon-btn" title="Video ngắn trước" aria-label="Video ngắn trước">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        </button>
        <button type="button" id="reels-next-btn" class="twin-icon-btn" title="Video ngắn tiếp theo" aria-label="Video ngắn tiếp theo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </section>

    <!-- Tab 2: Danh sách Video thường -->
    <section id="reels-video-panel" class="twin-videos-feed" style="display:none;">
      <div id="reels-video-list"></div>
    </section>
  </main>

  <!-- Modal Đăng Video / Video ngắn -->
  <div class="twin-modal-backdrop" id="upload-video-modal">
    <div class="twin-modal" style="max-width:480px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="font-size:19px;font-weight:800;">Đăng video mới</h2>
        <button type="button" id="uv-close-btn" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>

      <form id="uv-form" style="display:flex;flex-direction:column;gap:12px;">
        <div class="twin-seg-tabs" style="width:100%;display:grid;grid-template-columns:1fr 1fr;">
          <button type="button" id="uv-type-short" class="twin-seg-tab active">Video ngắn (9:16)</button>
          <button type="button" id="uv-type-video" class="twin-seg-tab">Video thường</button>
        </div>

        <div id="uv-preview-box" class="twin-composer-video-preview is-short" style="display:none;position:relative;">
          <video id="uv-preview-video" class="twin-post-video" controls playsinline muted></video>
          <button type="button" id="uv-remove-file" class="twin-icon-btn" style="position:absolute;top:8px;right:8px;width:30px;height:30px;background:rgba(0,0,0,0.65);color:#fff;" title="Bỏ chọn video">✕</button>
        </div>

        <label class="twin-btn twin-btn-secondary" style="width:100%;cursor:pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="14" height="13" rx="2.5"/><path d="m16.5 10 5-3v10l-5-3"/></svg>
          <span id="uv-file-label">Chọn video từ thiết bị (tối đa 100MB)</span>
          <input id="uv-file-input" type="file" accept="video/*" hidden />
        </label>

        <div id="uv-meta-row" class="twin-post-meta" style="display:none;font-weight:600;"></div>

        <div>
          <label class="twin-field-label" for="uv-caption">Mô tả / Chú thích</label>
          <textarea id="uv-caption" class="twin-textarea" rows="3" maxlength="1000" placeholder="Viết mô tả cho video của bạn..."></textarea>
        </div>

        <div id="uv-progress" class="twin-upload-progress" style="display:none;">
          <div class="twin-upload-progress-track">
            <div id="uv-progress-fill" class="twin-upload-progress-fill" style="width:0%"></div>
          </div>
          <span id="uv-progress-text" class="twin-post-meta">Đang tải lên 0%...</span>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
          <button type="button" id="uv-cancel-btn" class="twin-btn twin-btn-secondary">Hủy</button>
          <button type="submit" id="uv-submit-btn" class="twin-btn twin-btn-primary">Đăng ngay</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Bình luận cho Video ngắn -->
  <div class="twin-modal-backdrop" id="reel-comments-modal">
    <div class="twin-modal" style="max-width:460px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="font-size:17px;font-weight:800;">Bình luận</h2>
        <button type="button" id="rc-close-btn" class="twin-icon-btn" style="width:32px;height:32px;" aria-label="Đóng">✕</button>
      </div>
      <div id="rc-list" class="twin-reel-cmt-list"></div>
      <form id="rc-form" class="twin-comment-form" style="margin-top:12px;">
        <input id="rc-input" class="twin-input" type="text" placeholder="Viết bình luận..." maxlength="1000" required style="padding:9px 14px;" />
        <button type="submit" class="twin-btn twin-btn-primary twin-btn-sm">Gửi</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initTwinPage } from "./assets/js/layout.js";
    import { renderPostList } from "./assets/js/post-ui.js";
    import {
      db,
      collection,
      doc,
      addDoc,
      updateDoc,
      deleteDoc,
      arrayUnion,
      arrayRemove,
      deleteField,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      uploadVideoToCloudinary,
      readVideoMetadata,
      getVideoPosterUrl,
      formatDuration,
      pushNotification,
      isUserAdmin,
      DEFAULT_AVATAR,
      escapeHtml,
      formatTime,
      toMillis,
      showToast,
      friendlyError
    } from "./assets/js/firebase-service.js";

    const ICON = {
      heart: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
      heartFilled: `<svg width="24" height="24" viewBox="0 0 24 24" fill="#ff3040" stroke="#ff3040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
      comment: `<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c4.9 0 8.8 3.5 8.8 7.9 0 4.4-3.9 7.9-8.8 7.9-1.3 0-2.6-.3-3.7-.8L4 20l1.1-3.7a7.3 7.3 0 0 1-1.9-4.9c0-4.4 3.9-7.9 8.8-7.9Z"/></svg>`,
      share: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 13.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4.5"/></svg>`,
      save: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h11A1.5 1.5 0 0 1 19 5.5v15l-7-4-7 4v-15A1.5 1.5 0 0 1 6.5 4Z"/></svg>`,
      saveFilled: `<svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h11A1.5 1.5 0 0 1 19 5.5v15l-7-4-7 4v-15A1.5 1.5 0 0 1 6.5 4Z"/></svg>`,
      trash: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M18.5 6.5 17.6 19a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8L5.5 6.5"/><path d="M9 6.5v-2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
      muted: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>`,
      sound: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5.5a9.5 9.5 0 0 1 0 13"/></svg>`,
      play: `<svg width="34" height="34" viewBox="0 0 24 24" fill="#ffffff"><polygon points="6 4 20 12 6 20 6 4"/></svg>`
    };

    let me = null;
    let allVideoPosts = [];
    let activeTab = new URLSearchParams(window.location.search).get("tab") === "video" ? "video" : "short";
    let targetReelId = new URLSearchParams(window.location.search).get("id") || "";
    let globalMuted = true;
    let reelObserver = null;
    let activeCommentReelId = null;

    const tabShortBtn = document.getElementById("reels-tab-short");
    const tabVideoBtn = document.getElementById("reels-tab-video");
    const shortPanel = document.getElementById("reels-short-panel");
    const videoPanel = document.getElementById("reels-video-panel");
    const scroller = document.getElementById("reels-scroller");
    const navArrows = document.getElementById("reels-nav-arrows");
    const videoListEl = document.getElementById("reels-video-list");

    function pauseAllReelVideos() {
      scroller.querySelectorAll("video").forEach((v) => {
        try { v.pause(); } catch {}
      });
    }

    function setTab(next) {
      activeTab = next === "video" ? "video" : "short";
      tabShortBtn.classList.toggle("active", activeTab === "short");
      tabShortBtn.setAttribute("aria-selected", activeTab === "short" ? "true" : "false");
      tabVideoBtn.classList.toggle("active", activeTab === "video");
      tabVideoBtn.setAttribute("aria-selected", activeTab === "video" ? "true" : "false");
      shortPanel.style.display = activeTab === "short" ? "flex" : "none";
      videoPanel.style.display = activeTab === "video" ? "block" : "none";
      if (activeTab === "video") {
        pauseAllReelVideos();
      } else {
        setupReelAutoPlay();
      }
    }

    tabShortBtn.onclick = () => setTab("short");
    tabVideoBtn.onclick = () => setTab("video");

    // ---- Upload Video Modal ----
    const uploadModal = document.getElementById("upload-video-modal");
    const uvTypeShort = document.getElementById("uv-type-short");
    const uvTypeVideo = document.getElementById("uv-type-video");
    const uvFileInput = document.getElementById("uv-file-input");
    const uvFileLabel = document.getElementById("uv-file-label");
    const uvPreviewBox = document.getElementById("uv-preview-box");
    const uvPreviewVideo = document.getElementById("uv-preview-video");
    const uvMetaRow = document.getElementById("uv-meta-row");
    const uvCaption = document.getElementById("uv-caption");
    const uvProgress = document.getElementById("uv-progress");
    const uvProgressFill = document.getElementById("uv-progress-fill");
    const uvProgressText = document.getElementById("uv-progress-text");
    const uvSubmitBtn = document.getElementById("uv-submit-btn");

    let uvMode = "short";
    let uvFile = null;
    let uvDuration = 0;
    let uvObjUrl = "";

    function setUploadMode(mode) {
      uvMode = mode === "video" ? "video" : "short";
      uvTypeShort.classList.toggle("active", uvMode === "short");
      uvTypeVideo.classList.toggle("active", uvMode === "video");
      uvPreviewBox.classList.toggle("is-short", uvMode === "short");
    }
    uvTypeShort.onclick = () => setUploadMode("short");
    uvTypeVideo.onclick = () => setUploadMode("video");

    function clearUploadSelection() {
      if (uvObjUrl) {
        URL.revokeObjectURL(uvObjUrl);
        uvObjUrl = "";
      }
      uvFile = null;
      uvDuration = 0;
      uvFileInput.value = "";
      uvPreviewVideo.pause();
      uvPreviewVideo.removeAttribute("src");
      uvPreviewVideo.load();
      uvPreviewBox.style.display = "none";
      uvMetaRow.style.display = "none";
      uvFileLabel.textContent = "Chọn video từ thiết bị (tối đa 100MB)";
    }

    function openUploadModal(defaultMode = activeTab) {
      setUploadMode(defaultMode);
      uploadModal.classList.add("open");
    }

    function closeUploadModal() {
      uploadModal.classList.remove("open");
      uvPreviewVideo.pause();
    }

    document.getElementById("reels-open-upload").onclick = () => openUploadModal(activeTab);
    document.getElementById("uv-close-btn").onclick = closeUploadModal;
    document.getElementById("uv-cancel-btn").onclick = closeUploadModal;
    document.getElementById("uv-remove-file").onclick = clearUploadSelection;

    uvFileInput.onchange = async () => {
      const f = uvFileInput.files[0] || null;
      clearUploadSelection();
      if (!f) return;
      if (!f.type || !f.type.startsWith("video/")) {
        showToast("Vui lòng chọn tệp video hợp lệ.");
        return;
      }
      if (f.size > 100 * 1024 * 1024) {
        showToast("Video quá lớn (tối đa 100MB).");
        return;
      }
      uvFile = f;
      uvObjUrl = URL.createObjectURL(f);
      uvPreviewVideo.src = uvObjUrl;
      uvPreviewBox.style.display = "block";
      uvFileLabel.textContent = "Đổi video: " + f.name;
      const sizeMb = (f.size / (1024 * 1024)).toFixed(1);
      uvMetaRow.textContent = `Dung lượng: ${sizeMb} MB`;
      uvMetaRow.style.display = "block";

      const meta = await readVideoMetadata(f);
      if (uvFile !== f) return;
      uvDuration = meta.duration || 0;
      uvMetaRow.textContent = `${meta.duration ? `Thời lượng: ${formatDuration(meta.duration)} · ` : ""}Dung lượng: ${sizeMb} MB`;
    };

    document.getElementById("uv-form").onsubmit = async (e) => {
      e.preventDefault();
      if (!me) return;
      if (!uvFile) return showToast("Hãy chọn một tệp video để đăng.");

      uvSubmitBtn.disabled = true;
      uvSubmitBtn.textContent = "Đang tải...";
      uvProgress.style.display = "flex";
      uvProgressFill.style.width = "0%";
      uvProgressText.textContent = "Đang tải video 0%...";
      try {
        const uploaded = await uploadVideoToCloudinary(uvFile, (pct) => {
          uvProgressFill.style.width = `${pct}%`;
          uvProgressText.textContent = `Đang tải video ${pct}%...`;
          uvSubmitBtn.textContent = `Đang tải ${pct}%...`;
        });
        const docRef = await addDoc(collection(db, "posts"), {
          authorUid: me.uid,
          authorName: me.name,
          authorAvatar: me.avatar || DEFAULT_AVATAR,
          content: uvCaption.value.trim(),
          isHtml: false,
          feeling: "",
          imageUrl: "",
          videoUrl: uploaded.url,
          videoType: uvMode,
          videoDuration: uploaded.duration || uvDuration || 0,
          videoPoster: uploaded.poster || "",
          pinned: false,
          reactions: {},
          comments: [],
          createdAt: serverTimestamp()
        });
        const postedMode = uvMode;
        uvCaption.value = "";
        clearUploadSelection();
        closeUploadModal();
        targetReelId = postedMode === "short" ? docRef.id : "";
        setTab(postedMode);
        showToast(postedMode === "short" ? "Đã đăng video ngắn!" : "Đã đăng video!");
      } catch (err) {
        showToast(friendlyError(err));
      } finally {
        uvProgress.style.display = "none";
        uvProgressFill.style.width = "0%";
        uvSubmitBtn.disabled = false;
        uvSubmitBtn.textContent = "Đăng ngay";
      }
    };

    // ---- Reel Comments Modal ----
    const rcModal = document.getElementById("reel-comments-modal");
    const rcList = document.getElementById("rc-list");
    const rcInput = document.getElementById("rc-input");

    function renderReelCommentsModal() {
      if (!activeCommentReelId) return;
      const post = allVideoPosts.find((p) => p.id === activeCommentReelId);
      if (!post) {
        rcModal.classList.remove("open");
        activeCommentReelId = null;
        return;
      }
      const comments = post.comments || [];
      if (!comments.length) {
        rcList.innerHTML = '<p class="twin-post-meta" style="text-align:center;padding:24px 8px;">Chưa có bình luận nào. Hãy là người đầu tiên bình luận!</p>';
      } else {
        rcList.innerHTML = comments
          .map(
            (c) => `
          <div class="twin-comment-item">
            <img class="twin-avatar twin-avatar-sm" src="${escapeHtml(c.authorAvatar || DEFAULT_AVATAR)}" alt="" />
            <div class="twin-comment-bubble">
              <div style="font-weight:700;font-size:13px;">${escapeHtml(c.authorName)}</div>
              <div>${escapeHtml(c.text)}</div>
            </div>
          </div>`
          )
          .join("");
      }
    }

    function openReelComments(postId) {
      activeCommentReelId = postId;
      renderReelCommentsModal();
      rcModal.classList.add("open");
      setTimeout(() => rcInput.focus(), 60);
    }

    document.getElementById("rc-close-btn").onclick = () => {
      rcModal.classList.remove("open");
      activeCommentReelId = null;
    };

    document.getElementById("rc-form").onsubmit = async (e) => {
      e.preventDefault();
      if (!me || !activeCommentReelId) return;
      const text = rcInput.value.trim();
      if (!text) return;
      const post = allVideoPosts.find((p) => p.id === activeCommentReelId);
      if (!post) return;
      rcInput.value = "";
      const newCmt = {
        id: Date.now().toString(),
        authorUid: me.uid,
        authorName: me.name,
        authorAvatar: me.avatar || DEFAULT_AVATAR,
        text,
        createdAt: Date.now()
      };
      try {
        await updateDoc(doc(db, "posts", post.id), { comments: arrayUnion(newCmt) });
        if (post.authorUid && post.authorUid !== me.uid) {
          pushNotification(post.authorUid, {
            fromUid: me.uid,
            fromName: me.name,
            fromAvatar: me.avatar || DEFAULT_AVATAR,
            type: "comment",
            text: `đã bình luận video ngắn của bạn: "${text.slice(0, 45)}"`,
            link: `./reels.html?id=${encodeURIComponent(post.id)}`
          }).catch(() => {});
        }
      } catch (err) {
        rcInput.value = text;
        showToast(friendlyError(err));
      }
    };

    // ---- Reels Auto-Play & Navigation ----
    function syncAllMuteButtons() {
      scroller.querySelectorAll(".twin-reel-card").forEach((card) => {
        const video = card.querySelector("video");
        const btn = card.querySelector(".btn-reel-mute");
        if (video) video.muted = globalMuted;
        if (btn) {
          btn.innerHTML = globalMuted ? ICON.muted : ICON.sound;
          btn.title = globalMuted ? "Bật âm thanh" : "Tắt âm thanh";
        }
      });
    }

    function setupReelAutoPlay() {
      if (reelObserver) {
        reelObserver.disconnect();
        reelObserver = null;
      }
      if (activeTab !== "short") return;
      const cards = scroller.querySelectorAll(".twin-reel-card");
      if (!cards.length) return;
      reelObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const card = entry.target;
            const video = card.querySelector("video");
            const indicator = card.querySelector(".twin-reel-play-indicator");
            if (!video) return;
            if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
              video.muted = globalMuted;
              video.play().then(() => {
                indicator?.classList.remove("visible");
              }).catch(() => {
                indicator?.classList.add("visible");
              });
            } else {
              video.pause();
            }
          });
        },
        { root: scroller, threshold: [0.25, 0.65] }
      );
      cards.forEach((c) => reelObserver.observe(c));
    }

    document.getElementById("reels-prev-btn").onclick = () => {
      scroller.scrollBy({ top: -scroller.clientHeight, behavior: "smooth" });
    };
    document.getElementById("reels-next-btn").onclick = () => {
      scroller.scrollBy({ top: scroller.clientHeight, behavior: "smooth" });
    };

    // ---- Render Short Videos (Reels) ----
    const renderedReelMap = new Map();

    function syncReelDynamicState(card, post) {
      const reactions = post.reactions || {};
      const likesCount = Object.keys(reactions).length;
      const liked = Boolean(me && reactions[me.uid]);
      const commentsCount = (post.comments || []).length;
      const saved = Boolean(me && (me.savedPosts || []).includes(post.id));

      const likeBtn = card.querySelector(".btn-reel-like");
      if (likeBtn) {
        likeBtn.classList.toggle("liked", liked);
        likeBtn.querySelector(".twin-reel-act-icon").innerHTML = liked ? ICON.heartFilled : ICON.heart;
        likeBtn.querySelector(".twin-reel-act-count").textContent = String(likesCount);
      }
      const cmtBtn = card.querySelector(".btn-reel-cmt");
      if (cmtBtn) {
        cmtBtn.querySelector(".twin-reel-act-count").textContent = String(commentsCount);
      }
      const saveBtn = card.querySelector(".btn-reel-save");
      if (saveBtn) {
        saveBtn.classList.toggle("saved", saved);
        saveBtn.querySelector(".twin-reel-act-icon").innerHTML = saved ? ICON.saveFilled : ICON.save;
      }
    }

    function createReelCard(post) {
      const card = document.createElement("article");
      card.className = "twin-reel-card";
      card.dataset.reelId = post.id;

      const poster = post.videoPoster || getVideoPosterUrl(post.videoUrl);
      const durText = post.videoDuration ? formatDuration(post.videoDuration) : "";
      const canManage = Boolean(me && (me.uid === post.authorUid || isUserAdmin(me)));

      card.innerHTML = `
        <div class="twin-reel-frame">
          <video
            class="twin-reel-video"
            src="${escapeHtml(post.videoUrl)}"
            ${poster ? `poster="${escapeHtml(poster)}"` : ""}
            playsinline
            loop
            muted
            preload="metadata"
          ></video>

          <div class="twin-reel-play-indicator" aria-hidden="true">${ICON.play}</div>

          <div class="twin-reel-top-bar">
            <span class="twin-post-video-badge short">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>
              <span>Video ngắn${durText ? ` · ${escapeHtml(durText)}` : ""}</span>
            </span>
            <button type="button" class="twin-reel-top-btn btn-reel-mute" title="Bật âm thanh" aria-label="Âm thanh">${globalMuted ? ICON.muted : ICON.sound}</button>
          </div>

          <div class="twin-reel-rail">
            <button type="button" class="twin-reel-act-btn btn-reel-like" title="Thả tim">
              <span class="twin-reel-act-icon">${ICON.heart}</span>
              <span class="twin-reel-act-count">0</span>
            </button>
            <button type="button" class="twin-reel-act-btn btn-reel-cmt" title="Bình luận">
              <span class="twin-reel-act-icon">${ICON.comment}</span>
              <span class="twin-reel-act-count">0</span>
            </button>
            <button type="button" class="twin-reel-act-btn btn-reel-share" title="Chia sẻ">
              <span class="twin-reel-act-icon">${ICON.share}</span>
              <span class="twin-reel-act-count">Gửi</span>
            </button>
            <button type="button" class="twin-reel-act-btn btn-reel-save" title="Lưu video">
              <span class="twin-reel-act-icon">${ICON.save}</span>
            </button>
            ${
              canManage
                ? `<button type="button" class="twin-reel-act-btn btn-reel-del" title="Xóa video ngắn">
                    <span class="twin-reel-act-icon">${ICON.trash}</span>
                  </button>`
                : ""
            }
          </div>

          <div class="twin-reel-meta">
            <a href="./profile.html?uid=${encodeURIComponent(post.authorUid)}" class="twin-reel-author">
              <img class="twin-avatar twin-avatar-sm" src="${escapeHtml(post.authorAvatar || DEFAULT_AVATAR)}" alt="" />
              <div style="min-width:0;">
                <div class="twin-reel-author-name">${escapeHtml(post.authorName || "Thành viên Twin")}</div>
                <div class="twin-reel-time">${escapeHtml(formatTime(post.createdAt))}</div>
              </div>
            </a>
            ${post.content ? `<p class="twin-reel-caption">${escapeHtml(post.content)}</p>` : ""}
          </div>
        </div>
      `;

      const video = card.querySelector("video");
      const playIndicator = card.querySelector(".twin-reel-play-indicator");

      video.addEventListener("click", () => {
        if (video.paused) {
          video.play().catch(() => {});
          playIndicator.classList.remove("visible");
        } else {
          video.pause();
          playIndicator.classList.add("visible");
        }
      });

      card.querySelector(".btn-reel-mute").onclick = (e) => {
        e.stopPropagation();
        globalMuted = !globalMuted;
        syncAllMuteButtons();
        if (!globalMuted && video.paused) {
          video.play().catch(() => {});
          playIndicator.classList.remove("visible");
        }
      };

      card.querySelector(".btn-reel-like").onclick = async (e) => {
        e.stopPropagation();
        if (!me) return;
        const latest = allVideoPosts.find((p) => p.id === post.id) || post;
        const already = Boolean((latest.reactions || {})[me.uid]);
        try {
          await updateDoc(doc(db, "posts", post.id), {
            [`reactions.${me.uid}`]: already ? deleteField() : "love"
          });
          if (!already && latest.authorUid && latest.authorUid !== me.uid) {
            pushNotification(latest.authorUid, {
              fromUid: me.uid,
              fromName: me.name,
              fromAvatar: me.avatar || DEFAULT_AVATAR,
              type: "reaction",
              text: "đã thả tim video ngắn của bạn ❤️",
              link: `./reels.html?id=${encodeURIComponent(post.id)}`
            }).catch(() => {});
          }
        } catch (err) {
          showToast(friendlyError(err));
        }
      };

      card.querySelector(".btn-reel-cmt").onclick = (e) => {
        e.stopPropagation();
        openReelComments(post.id);
      };

      card.querySelector(".btn-reel-share").onclick = async (e) => {
        e.stopPropagation();
        const url = new URL("./reels.html", window.location.href);
        url.search = `?id=${encodeURIComponent(post.id)}`;
        try {
          await navigator.clipboard.writeText(url.href);
          showToast("Đã sao chép liên kết video ngắn!");
        } catch {
          window.prompt("Sao chép liên kết:", url.href);
        }
      };

      card.querySelector(".btn-reel-save").onclick = async (e) => {
        e.stopPropagation();
        if (!me) return;
        const list = Array.isArray(me.savedPosts) ? me.savedPosts : (me.savedPosts = []);
        const wasSaved = list.includes(post.id);
        try {
          await updateDoc(doc(db, "users", me.uid), {
            savedPosts: wasSaved ? arrayRemove(post.id) : arrayUnion(post.id)
          });
          if (wasSaved) {
            const idx = list.indexOf(post.id);
            if (idx >= 0) list.splice(idx, 1);
          } else {
            list.push(post.id);
          }
          syncReelDynamicState(card, allVideoPosts.find((p) => p.id === post.id) || post);
          showToast(wasSaved ? "Đã bỏ lưu video." : "Đã lưu video!");
        } catch (err) {
          showToast(friendlyError(err));
        }
      };

      const delBtn = card.querySelector(".btn-reel-del");
      if (delBtn) {
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          if (!confirm("Xóa video ngắn này?")) return;
          try {
            await deleteDoc(doc(db, "posts", post.id));
            showToast("Đã xóa video ngắn.");
          } catch (err) {
            showToast(friendlyError(err));
          }
        };
      }

      syncReelDynamicState(card, post);
      return card;
    }

    function renderShorts(shorts) {
      if (!shorts.length) {
        renderedReelMap.clear();
        navArrows.style.display = "none";
        scroller.innerHTML = `
          <div class="twin-card twin-reels-empty">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3);margin-bottom:10px;"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18"/><path d="M8.5 3 11 9"/><path d="M14.5 3 17 9"/><polygon points="10.2 12.2 15.5 15.2 10.2 18.2 10.2 12.2" fill="currentColor" stroke="none"/></svg>
            <h3 style="font-size:17px;font-weight:700;margin-bottom:6px;">Chưa có video ngắn nào</h3>
            <p class="twin-post-meta" style="margin-bottom:16px;">Hãy chia sẻ khoảnh khắc ngắn đầu tiên theo phong cách Reels!</p>
            <button type="button" id="reels-empty-upload" class="twin-btn twin-btn-primary">Đăng video ngắn đầu tiên</button>
          </div>
        `;
        document.getElementById("reels-empty-upload").onclick = () => openUploadModal("short");
        return;
      }

      [...scroller.children].forEach((ch) => {
        if (!ch.dataset.reelId) ch.remove();
      });

      const seen = new Set();
      let prev = null;
      shorts.forEach((p) => {
        let card = renderedReelMap.get(p.id);
        if (!card) {
          card = createReelCard(p);
          renderedReelMap.set(p.id, card);
        } else {
          syncReelDynamicState(card, p);
        }
        seen.add(p.id);
        const want = prev ? prev.nextSibling : scroller.firstChild;
        if (card !== want) scroller.insertBefore(card, want);
        prev = card;
      });
      for (const [id, card] of renderedReelMap) {
        if (!seen.has(id)) {
          card.remove();
          renderedReelMap.delete(id);
        }
      }

      navArrows.style.display = shorts.length > 1 ? "flex" : "none";
      setupReelAutoPlay();

      if (targetReelId) {
        const targetCard = renderedReelMap.get(targetReelId);
        if (targetCard) {
          targetReelId = "";
          requestAnimationFrame(() => targetCard.scrollIntoView({ behavior: "smooth", block: "start" }));
        }
      }
    }

    function renderVideos(videos) {
      const empty = `
        <div class="twin-card" style="text-align:center;padding:36px 20px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3);margin-bottom:10px;"><rect x="2.5" y="5.5" width="14" height="13" rx="2.5"/><path d="m16.5 10 5-3v10l-5-3"/></svg>
          <h3 style="font-size:17px;font-weight:700;margin-bottom:6px;">Chưa có video nào</h3>
          <p class="twin-post-meta" style="margin-bottom:16px;">Tải lên video từ thiết bị để chia sẻ với bạn bè trên Twin.</p>
          <button type="button" id="videos-empty-upload" class="twin-btn twin-btn-primary">Đăng video đầu tiên</button>
        </div>
      `;
      renderPostList(videoListEl, videos, me, empty);
      const emptyBtn = document.getElementById("videos-empty-upload");
      if (emptyBtn) emptyBtn.onclick = () => openUploadModal("video");
    }

    initTwinPage({
      requireAuth: true,
      onReady: (user) => {
        me = user;
        if (!me) return;
        setTab(activeTab);

        onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(200)), (snap) => {
          allVideoPosts = [];
          snap.forEach((d) => {
            const p = { id: d.id, ...d.data() };
            if (p.videoUrl) allVideoPosts.push(p);
          });
          allVideoPosts.sort((a, b) => toMillis(b.createdAt) - toMillis(a.createdAt));

          const shorts = allVideoPosts.filter((p) => p.videoType === "short");
          const videos = allVideoPosts.filter((p) => p.videoType !== "short");

          renderShorts(shorts);
          renderVideos(videos);
          if (activeCommentReelId) renderReelCommentsModal();
        }, (err) => showToast(friendlyError(err)));
      }
    });
  </script>
</body>
</html>
